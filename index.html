/* ============================================================
   경량 날짜 유틸 (dayjs 대체 - 외부 CDN 의존 제거)
   ============================================================ */
function dayjs(input){
  let d;
  if(input===undefined) d = new Date();
  else if(input instanceof Date) d = new Date(input);
  else if(typeof input === 'string'){
    d = new Date(input.length<=10 ? input+'T00:00:00' : input);
  } else d = new Date(input);

  const obj = {
    _d: d,
    format(fmt){
      const Y = d.getFullYear(), M = d.getMonth()+1, D = d.getDate();
      const dowNames = ['일','월','화','수','목','금','토'];
      const dow = dowNames[d.getDay()];
      const h = d.getHours(), m = d.getMinutes();
      const pad = n => String(n).padStart(2,'0');
      return fmt
        .replace(/YYYY/g, Y)
        .replace(/MM/g, pad(M))
        .replace(/M/g, M)
        .replace(/DD/g, pad(D))
        .replace(/D/g, D)
        .replace(/ddd/g, dow)
        .replace(/HH/g, pad(h))
        .replace(/mm/g, pad(m));
    },
    add(n, unit){
      const nd = new Date(d);
      if(unit==='day') nd.setDate(nd.getDate()+n);
      else if(unit==='month') nd.setMonth(nd.getMonth()+n);
      else if(unit==='year') nd.setFullYear(nd.getFullYear()+n);
      return dayjs(nd);
    },
    subtract(n, unit){ return obj.add(-n, unit); },
    diff(other, unit){
      const od = other._d ? other._d : new Date(other);
      const ms = d.getTime() - od.getTime();
      if(unit==='day') return Math.round(ms/86400000);
      if(unit==='month') return (d.getFullYear()-od.getFullYear())*12 + (d.getMonth()-od.getMonth());
      return ms;
    },
    date(n){
      if(n===undefined) return d.getDate();
      const nd = new Date(d); nd.setDate(n); return dayjs(nd);
    },
    day(){ return d.getDay(); },
    startOf(unit){
      const nd = new Date(d);
      if(unit==='day'){ nd.setHours(0,0,0,0); }
      else if(unit==='week'){ nd.setDate(nd.getDate()-nd.getDay()); nd.setHours(0,0,0,0); }
      else if(unit==='month'){ nd.setDate(1); nd.setHours(0,0,0,0); }
      else if(unit==='year'){ nd.setMonth(0,1); nd.setHours(0,0,0,0); }
      return dayjs(nd);
    },
    endOf(unit){
      const nd = new Date(d);
      if(unit==='day'){ nd.setHours(23,59,59,999); }
      else if(unit==='week'){ nd.setDate(nd.getDate()+(6-nd.getDay())); nd.setHours(23,59,59,999); }
      else if(unit==='month'){ nd.setMonth(nd.getMonth()+1); nd.setDate(0); nd.setHours(23,59,59,999); }
      else if(unit==='year'){ nd.setMonth(11,31); nd.setHours(23,59,59,999); }
      return dayjs(nd);
    },
    isValid(){ return !isNaN(d.getTime()); }
  };
  return obj;
}

// 실제 파일을 Supabase Storage에 업로드하고 공개 URL을 반환 (JSON 데이터에는 이 URL만 저장 -> 용량 걱정 없음)
async function uploadFileToStorage(blob, folder='uploads', filename='file', contentType){
  const ct = contentType || blob.type || 'application/octet-stream';
  let safeName = (filename||'file').replace(/[^a-zA-Z0-9._-]/g,'_');
  if(!/\.[a-zA-Z0-9]+$/.test(safeName)){
    const ext = ct.includes('png') ? '.png' : ct.includes('jpeg')||ct.includes('jpg') ? '.jpg' : ct.includes('pdf') ? '.pdf' : '';
    safeName += ext;
  }
  const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safeName}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${path}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': ct,
    },
    body: blob
  });
  if(!res.ok){
    const text = await res.text();
    throw new Error(`업로드 실패 (${res.status}): ${text.slice(0,200)}`);
  }
  return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${path}`;
}

// 이미지를 리사이즈+압축한 뒤 Blob으로 반환 (업로드용)
function compressImageToBlob(file, maxDim=480, quality=0.8){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width >= height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const isPng = file.type === 'image/png';
        canvas.toBlob(blob=>{
          if(blob) resolve(blob); else reject(new Error('이미지 압축 실패'));
        }, isPng ? 'image/png' : 'image/jpeg', quality);
      };
      img.onerror = ()=>reject(new Error('이미지를 불러올 수 없습니다'));
      img.src = ev.target.result;
    };
    reader.onerror = ()=>reject(new Error('파일을 읽을 수 없습니다'));
    reader.readAsDataURL(file);
  });
}

function dataUrlToBlob(dataUrl){
  const match = dataUrl.match(/^data:([^;]+);base64,(.*)$/);
  if(!match) return null;
  return base64ToBlob(match[2], match[1]);
}
function base64ToBlob(b64, mime){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], {type: mime||'application/octet-stream'});
}

// ── 일회성 정리 도구: 예전에 JSON 안에 base64로 박혀있던 로고/파일을 전부 Storage로 이전 ──
// 브라우저 콘솔에서 migrateOldAttachmentsToStorage() 실행
window.migrateOldAttachmentsToStorage = async function(){
  const beforeSize = new Blob([JSON.stringify(state.data)]).size;
  let count = 0, failCount = 0;
  showToast('기존 첨부파일 정리를 시작합니다... (콘솔에서 진행상황 확인)');

  async function migrateLogo(obj, label){
    if(obj.logoUrl && obj.logoUrl.startsWith('data:')){
      try{
        const blob = dataUrlToBlob(obj.logoUrl);
        obj.logoUrl = await uploadFileToStorage(blob, 'logos', (label||'logo')+'.jpg');
        count++;
        console.log('✔ 로고 이전 완료:', label);
      }catch(e){ failCount++; console.error('✘ 로고 이전 실패:', label, e); }
    }
  }
  async function migrateLinks(links, label){
    if(!links) return;
    for(const lk of links){
      if(lk.data){
        try{
          const blob = base64ToBlob(lk.data, lk.type);
          lk.url = await uploadFileToStorage(blob, 'attachments', lk.label||'file');
          delete lk.data;
          count++;
          console.log('✔ 파일 이전 완료:', label, lk.label);
        }catch(e){ failCount++; console.error('✘ 파일 이전 실패:', label, lk.label, e); }
      }
    }
  }

  if(state.data.profilePhotoUrl && state.data.profilePhotoUrl.startsWith('data:')){
    try{
      const blob = dataUrlToBlob(state.data.profilePhotoUrl);
      state.data.profilePhotoUrl = await uploadFileToStorage(blob, 'profile-photos', 'profile.jpg');
      count++;
      console.log('✔ 프로필 사진 이전 완료');
    }catch(e){ failCount++; console.error('✘ 프로필 사진 이전 실패:', e); }
  }

  for(const v of (state.data.vendors||[])){
    await migrateLogo(v, v.name);
    await migrateLinks(v.links, v.name);
    for(const b of (v.brands||[])){
      await migrateLogo(b, `${v.name} - ${b.name}`);
      await migrateLinks(b.links, `${v.name} - ${b.name}`);
    }
  }
  for(const p of (state.data.projects||[])){
    await migrateLinks(p.links, p.title);
  }

  const afterSize = new Blob([JSON.stringify(state.data)]).size;
  persist(false);
  render();
  const msg = `정리 완료! ${count}개 이전 (실패 ${failCount}개), 용량 ${(beforeSize/1024/1024).toFixed(1)}MB → ${(afterSize/1024/1024).toFixed(1)}MB`;
  showToast(msg);
  console.log(msg);
};

async function supabaseFetch(path, options={}){
  const url = `${SUPABASE_URL}/rest/v1/${path}`;
  const {prefer, body, method, ...rest} = options;
  const res = await fetch(url, {
    method: method || 'GET',
    mode: 'cors',
    credentials: 'omit',
    body: body || undefined,
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': prefer || 'return=representation',
    }
  });
  if(!res.ok){
    const text = await res.text();
    throw new Error(`Supabase ${res.status}: ${text}`);
  }
  const text = await res.text();
  if(!text) return null;
  try{ return JSON.parse(text); }catch(e){ return null; }
}

async function loadStoreRemote(){
  const rows = await supabaseFetch(`${SUPABASE_TABLE}?id=eq.${SUPABASE_ROW_ID}&select=data`);
  if(rows && rows.length>0 && rows[0].data && Object.keys(rows[0].data).length>0){
    const d = rows[0].data;
    // ── 마이그레이션: calendarEventTypes가 없거나 연차/반차가 빠진 경우 보완 ──
    const defaultEventTypes = [
      {name:'미팅', color:'#1C85E8'},{name:'외근', color:'#D85A30'},
      {name:'마감', color:'#7C3AED'},
      {name:'개인 용무', color:'#F59E0B'},{name:'전화 통화', color:'#38BDF8'},
    ];
    if(!d.calendarEventTypes || d.calendarEventTypes.length < 3){
      d.calendarEventTypes = defaultEventTypes;
    } else {
      // 연차/반차/반반차는 더 이상 수동 관리 유형이 아님 (연차 관리에서 자동 생성됨) → 제거
      d.calendarEventTypes = d.calendarEventTypes.filter(t=>!['연차','반차','반반차'].includes(t.name));
      // 기존 유형에 없는 기본 유형만 앞에 추가
      const existingNames = d.calendarEventTypes.map(t=>t.name);
      const missing = defaultEventTypes.filter(t=>!existingNames.includes(t.name));
      if(missing.length > 0){
        d.calendarEventTypes = [...missing, ...d.calendarEventTypes];
      }
    }
    return d;
  }
  // 행이 비어있으면 시드 데이터로 초기 저장
  const seed = seedData();
  await supabaseFetch(`${SUPABASE_TABLE}?id=eq.${SUPABASE_ROW_ID}`, {
    method: 'PATCH',
    prefer: 'return=minimal',
    body: JSON.stringify({ data: seed })
  });
  return seed;
}

let saveTimer = null;
let saveInFlight = false;
let savePending = false;

function saveStore(){
  // 디바운스: 짧은 시간 내 연속 저장 요청을 묶어서 한 번만 전송
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doSaveStore, 400);
}

async function doSaveStore(){
  if(saveInFlight){ savePending = true; return; }
  saveInFlight = true;
  try{
    const payload = JSON.stringify({ data: state.data, updated_at: new Date().toISOString() });
    const sizeMB = (new Blob([payload]).size / (1024*1024));
    if(sizeMB > 8){
      throw new Error(`데이터 용량이 너무 큽니다 (${sizeMB.toFixed(1)}MB). 첨부된 이미지/파일을 정리해주세요.`);
    }
    await supabaseFetch(`${SUPABASE_TABLE}?id=eq.${SUPABASE_ROW_ID}`, {
      method: 'PATCH',
      prefer: 'return=minimal',
      body: payload
    });
    setSyncStatus('synced');
  }catch(e){
    console.error('저장 실패:', e);
    setSyncStatus('error');
    // 실제 원인 구분: 용량/서버 응답 에러 vs 진짜 네트워크 단절(TypeError: Failed to fetch)
    const msg = (e && e.message) || '';
    if(msg.includes('용량이 너무 큽니다')){
      showToast(`⚠️ ${msg}`);
    } else if(e instanceof TypeError){
      showToast('⚠️ 저장 실패! 인터넷 연결을 확인해주세요.');
    } else {
      showToast(`⚠️ 저장 실패: ${msg.slice(0,120)}`);
    }
  }finally{
    saveInFlight = false;
    if(savePending){ savePending = false; doSaveStore(); }
  }
}

function setSyncStatus(status){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  if(status==='saving'){ el.textContent = '저장 중...'; el.style.color = 'var(--muted)'; }
  else if(status==='synced'){ el.textContent = '저장됨'; el.style.color = '#3B6D11'; }
  else if(status==='error'){ el.textContent = '저장 실패'; el.style.color = '#A32D2D'; }
}

function moveLogToTrash(log){
  if(!state.data.deletedLogs) state.data.deletedLogs = [];
  state.data.deletedLogs.push({...log, deletedAt: Date.now()});
  purgeOldTrash();
}
function purgeOldTrash(){
  if(!state.data.deletedLogs) return;
  const cutoff = Date.now() - 30*24*60*60*1000;
  state.data.deletedLogs = state.data.deletedLogs.filter(l=>(l.deletedAt||0) >= cutoff);
}

function sortLogsDesc(logs){
  return logs.slice().sort((a,b)=>{
    const dateDiff = dayjs(b.date).diff(dayjs(a.date));
    if(dateDiff !== 0) return dateDiff;
    return (b.createdAt||0) - (a.createdAt||0);
  });
}

function eventMeetingNotes(ev){
  if(!ev.meetingNotes) ev.meetingNotes = [];
  // 이전 버전(회의록 1개 = meetingNote/meetingTitle/meetingSummary 단일 필드) 데이터 자동 이전
  // — 새 배열 구조로 넘어오지 못한 기존 회의록이 화면에서 사라져 보이지 않도록 복구
  if(ev.meetingNote && ev.meetingNote.trim()){
    const legacyId = 'legacy_'+ev.id;
    if(!ev.meetingNotes.some(n=>n.id===legacyId)){
      ev.meetingNotes.push({
        id: legacyId,
        title: ev.meetingTitle || '제목 없음',
        text: ev.meetingNote,
        summary: ev.meetingSummary || '',
        date: ev.date
      });
    }
  }
  return ev.meetingNotes.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
function latestMeetingNote(ev){
  const notes = eventMeetingNotes(ev);
  return notes.length ? notes[0] : null;
}
function eventColor(type){

  const custom = (state.data.calendarEventTypes||[]).find(t=>t.name===type);
  if(custom){
    const hex = (custom.color||'#888780').replace('#','');
    const r = parseInt(hex.substr(0,2),16)||0, g = parseInt(hex.substr(2,2),16)||0, b = parseInt(hex.substr(4,2),16)||0;
    const luminance = (0.299*r + 0.587*g + 0.114*b)/255;
    if(luminance > 0.85){
      // 너무 밝은 색(흰색 등)을 선택하면 텍스트가 안 보이므로, 대비되는 진한 회색 텍스트 + 연회색 배경으로 대체
      return {bg:'#EEF0F3', text:'#4B5563', dot:custom.color};
    }
    return {bg:custom.color+'22', text:custom.color, dot:custom.color};
  }
  // 기본 타입
  const defaults = {
    '미팅':     {bg:'#E8F2FE', text:'#0B4E9E', dot:'#1C85E8'},
    '외근':     {bg:'#FAECE7', text:'#993C1D', dot:'#D85A30'},

function getPublicHolidays(year){
  const holidays = [];
  // ── 한국 법정 공휴일 ──
  const kr = [
    {date:`${year}-01-01`, name:'신정'},
    {date:`${year}-03-01`, name:'삼일절'},
    {date:`${year}-05-05`, name:'어린이날'},
    {date:`${year}-06-06`, name:'현충일'},
    {date:`${year}-08-15`, name:'광복절'},
    {date:`${year}-10-03`, name:'개천절'},
    {date:`${year}-10-09`, name:'한글날'},
    {date:`${year}-12-25`, name:'크리스마스'},
  ];
  // 설날 (음력 1/1 전후) — 2025~2027 하드코딩
  const seollal = {'2025':['2025-01-28','2025-01-29','2025-01-30'],'2026':['2026-02-16','2026-02-17','2026-02-18'],'2027':['2027-02-06','2027-02-07','2027-02-08']};
  const chuseok = {'2025':['2025-10-05','2025-10-06','2025-10-07'],'2026':['2026-09-24','2026-09-25','2026-09-26'],'2027':['2027-10-13','2027-10-14','2027-10-15']};
  const buddha = {'2025':'2025-05-12','2026':'2026-05-02','2027':'2027-05-22'};
  const memorial = {'2025':'2025-04-22','2026':'2026-04-14','2027':'2027-04-06'};
  const ys = String(year);
  if(seollal[ys]) seollal[ys].forEach((d,i)=>holidays.push({date:d,name:['설날 전날','설날','설날 다음날'][i],country:'KR'}));
  if(chuseok[ys]) chuseok[ys].forEach((d,i)=>holidays.push({date:d,name:['추석 전날','추석','추석 다음날'][i],country:'KR'}));
  if(buddha[ys]) holidays.push({date:buddha[ys],name:'부처님 오신 날',country:'KR'});
  kr.forEach(h=>holidays.push({...h,country:'KR'}));

  // ── 미국 법정 공휴일 ──
  const us = [
    {date:`${year}-01-01`, name:'New Year\'s Day'},
    {date:`${year}-07-04`, name:'Independence Day'},
    {date:`${year}-11-11`, name:'Veterans Day'},
    {date:`${year}-12-25`, name:'Christmas Day'},
  ];
  // 변동 공휴일 (요일 기반) — 간단 계산
  function nthWeekday(y,m,weekday,n){ // n번째 weekday(0=일,1=월...)
    let d=1; while(new Date(y,m-1,d).getDay()!==weekday) d++;
    return new Date(y,m-1,d+(n-1)*7);
  }
  function lastWeekday(y,m,weekday){
    let d=new Date(y,m,0); // 마지막 날
    while(d.getDay()!==weekday) d.setDate(d.getDate()-1);
    return d;
  }
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  us.push({date:fmt(nthWeekday(year,1,1,3)),name:'MLK Day'});       // 1월 셋째 월
  us.push({date:fmt(nthWeekday(year,2,1,3)),name:'Presidents Day'}); // 2월 셋째 월
  us.push({date:fmt(lastWeekday(year,5,1)),name:'Memorial Day'});    // 5월 마지막 월
  us.push({date:fmt(nthWeekday(year,9,1,1)),name:'Labor Day'});      // 9월 첫째 월
  us.push({date:fmt(nthWeekday(year,10,1,2)),name:'Columbus Day'});  // 10월 둘째 월
  us.push({date:fmt(nthWeekday(year,11,4,4)),name:'Thanksgiving'});  // 11월 넷째 목
  us.forEach(h=>holidays.push({...h,country:'US'}));

  // ── 대체공휴일 (한국) ──
  // 대상: 설날/추석(연휴), 어린이날, 삼일절, 광복절, 개천절, 한글날, 부처님오신날
  // 신정/현충일/크리스마스는 대체공휴일 대상 아님
  const dowOf = dateStr => new Date(dateStr+'T00:00:00').getDay();
  const krDates = new Set(holidays.filter(h=>h.country==='KR').map(h=>h.date));
  function nextFreeWeekday(fromDateStr){
    const d = new Date(fromDateStr+'T00:00:00');
    d.setDate(d.getDate()+1);
    while(true){
      const dow = d.getDay();
      const ds = fmt(d);
      if(dow!==0 && dow!==6 && !krDates.has(ds)) return ds;
      d.setDate(d.getDate()+1);
    }
  }
  const substituteEligibleSingle = ['어린이날','삼일절','광복절','개천절','한글날','부처님 오신 날'];
  const substitutes = [];
  holidays.forEach(h=>{
    if(h.country!=='KR' || !substituteEligibleSingle.includes(h.name)) return;
    const dow = dowOf(h.date);
    if(dow===0 || dow===6){
      const subDate = nextFreeWeekday(h.date);
      substitutes.push({date:subDate, name:h.name+' 대체공휴일', country:'KR'});
      krDates.add(subDate);
    }
  });
  ['설날','추석'].forEach(label=>{
    const days = holidays.filter(h=>h.country==='KR' && h.name.startsWith(label)).sort((a,b)=>a.date.localeCompare(b.date));
    if(days.length===0) return;
    if(days.some(h=>dowOf(h.date)===0)){
      const subDate = nextFreeWeekday(days[days.length-1].date);
      substitutes.push({date:subDate, name:label+' 대체공휴일', country:'KR'});
      krDates.add(subDate);
    }
  });
  holidays.push(...substitutes);

  return holidays;
}

function allCalendarEvents(){

  // 프로젝트 마감일
  state.data.projects.forEach(p=>{
    if(p.deadline){
      evs.push({id:'deadline_'+p.id, date:p.deadline, type:'마감', title:p.title+' 마감', time:'', projectId:p.id});
    }
    // 체크리스트 항목 마감일
    (p.checklist||[]).forEach(c=>{
      if(c.dueDate && !c.done){
        evs.push({id:'ck_'+c.id, date:c.dueDate, type:'마감', title:`[${p.title}] ${c.text}`, time:'', projectId:p.id});
      }
    });
  });
  // 거래처 로그의 "다음 액션 마감일"
  (state.data.vendorLogs||[]).forEach(l=>{
    if(l.nextStepDue && !l.nextStepDone){
      const vendor = state.data.vendors.find(v=>v.id===l.vendorId);
      evs.push({
        id: 'log_'+l.id,
        date: l.nextStepDue,
        type: '마감',
        title: `[${vendor?vendor.name:'거래처'}] ${l.nextStep||l.summary||'다음 액션'}`,
        time: '',
        vendorIds: l.vendorId ? [l.vendorId] : [],
        projectId: l.linkedProjectId || '',
        logId: l.id
      });
    }
  });
  // 연차/반차 자동 반영
  (state.data.leave?.logs||[]).forEach(l=>{
    if(!evs.find(e=>e.id==='leave_'+l.id)){
      evs.push({id:'leave_'+l.id, date:l.date, type:l.type, title:l.type+(l.memo?' ('+l.memo+')':''), time:'', isLeave:true});
    }
  });
  // 공휴일 (현재 연도 + 내년)
  const yr = new Date().getFullYear();
  [yr, yr+1].forEach(y=>{
    getPublicHolidays(y).forEach(h=>{
      evs.push({id:'holiday_'+h.date+'_'+h.country, date:h.date, type:h.country==='KR'?'한국 공휴일':'미국 공휴일', title:h.name, time:'', isHoliday:true, country:h.country});
    });
  });
  return evs;
}

// 공용 페이지네이션 렌더러 — "이전 1 2 ... N 다음" 스타일, btnClass로 클릭 위임
function pagerHTML(page, totalPages, btnClass){
  if(totalPages<=1) return '';
  let range;
  if(totalPages<=7){
    range = Array.from({length:totalPages}, (_,i)=>i);
  } else {
    const set = new Set([0, totalPages-1, page, Math.max(0,page-1), Math.min(totalPages-1,page+1)]);
    range = Array.from(set).filter(p=>p>=0 && p<totalPages).sort((a,b)=>a-b);
  }
  let html = `<div class="pager-bar">`;
  html += `<button class="${btnClass} pager-btn pager-prev" data-page="${Math.max(0,page-1)}" ${page===0?'disabled':''}>이전</button>`;
  let prev = null;
  range.forEach(p=>{
    if(prev!==null && p-prev>1) html += `<span class="pager-ellipsis">···</span>`;
    html += `<button class="${btnClass} pager-btn ${p===page?'pager-active':''}" data-page="${p}">${p+1}</button>`;
    prev = p;
  });
  html += `<button class="${btnClass} pager-btn pager-next" data-page="${Math.min(totalPages-1,page+1)}" ${page>=totalPages-1?'disabled':''}>다음</button>`;
  html += `</div>`;
  return html;
}

function avatarColor(name){
  const colors = ['#1C85E8','#7C3AED','#DB2777','#D97706','#059669','#DC2626','#0891B2','#65A30D'];
  let h = 0; for(let c of (name||'?')) h = (h*31 + c.charCodeAt(0)) & 0xFFFFFF;
  return colors[Math.abs(h) % colors.length];
}
function isColorTooLight(hex){
  const h = (hex||'#888780').replace('#','');
  const r = parseInt(h.substr(0,2),16)||0, g = parseInt(h.substr(2,2),16)||0, b = parseInt(h.substr(4,2),16)||0;
  return (0.299*r + 0.587*g + 0.114*b)/255 > 0.85;
}
function typeColorFor(t){
  const custom = state.data.companyTypeColors?.[t];
  if(custom) return custom;
  const defaults = {
    '벤더':  {bg:'#E8F2FE',color:'#0B4E9E'},
    '물류사':{bg:'#EAF3DE',color:'#3B6D11'},
    '파트너':{bg:'#FEF3C7',color:'#92400E'},
    '기타':  {bg:'#F1EFE8',color:'#5F5E5A'},
  };
  return defaults[t] || {bg:'#F1EFE8',color:'#5F5E5A'};
}

function av(name, size=28, logoUrl){
  // logoUrl 우선 → vendor 데이터에서 자동 탐색 → 이니셜 폴백
  const url = logoUrl || (() => {
    const v = state.data?.vendors?.find(x=>x.name===name);
    return v?.logoUrl || null;
  })();
  if(url){
    return `<img src="${url}" alt="${name}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;background:#fff;border:0.5px solid var(--bd);flex-shrink:0;display:block;vertical-align:middle"/>`;
  }
  const initials = (name||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const bg = avatarColor(name);
  return `<div class="av" style="width:${size}px;height:${size}px;background:${bg};font-size:${size<=24?9:11}px;flex-shrink:0;border-radius:50%;box-sizing:border-box">${initials}</div>`;
}

function bindProfilePhotoModal(){
  let pendingFile = null;
  const selectBtn = document.getElementById('profilePhotoSelectBtn');
  const fileInput = document.getElementById('profilePhotoInput');
  const preview = document.getElementById('profilePhotoPreview');
  const saveBtn = document.getElementById('profilePhotoSaveBtn');
  const removeBtn = document.getElementById('profilePhotoRemoveBtn');

  if(selectBtn) selectBtn.addEventListener('click', ()=> fileInput.click());

  if(fileInput) fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){ showToast('이미지 파일만 업로드할 수 있습니다.'); return; }
    if(file.size > 5*1024*1024){ showToast('이미지 용량은 5MB 이하로 올려주세요.'); return; }
    pendingFile = file;
    if(preview) preview.innerHTML = `<img src="${URL.createObjectURL(file)}" style="width:96px;height:96px;border-radius:50%;object-fit:cover;border:0.5px solid var(--bd)"/>`;
    if(saveBtn) saveBtn.disabled = false;
  });

  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    if(!pendingFile) return;
    saveBtn.disabled = true;
    showToast('사진 업로드 중...');
    compressImageToBlob(pendingFile, 300).then(blob=>uploadFileToStorage(blob, 'profile-photos', pendingFile.name)).then(url=>{

      persist(false);
      closeModal();
      render();
      showToast('프로필 사진이 변경되었습니다.');
    }).catch(err=>{
      console.error(err);
      saveBtn.disabled = false;
      showToast('업로드 실패: ' + (err.message||'').slice(0,100));
    });
  });

  if(removeBtn) removeBtn.addEventListener('click', ()=>{
    state.data.profilePhotoUrl = '';
    persist(false);
    closeModal();
    render();
    showToast('기본 이미지로 되돌렸습니다.');
  });
}

function findFileItemById(id){
  for(const v of state.data.vendors){
    for(const src of [v,...(v.brands||[])]){
      const l=(src.links||[]).find(x=>x.id===id);
      if(l) return {target:src,link:l};
    }
  }
  for(const p of (state.data.projects||[])){
    const l=(p.links||[]).find(x=>x.id===id);
    if(l) return {target:p,link:l};
  }
  for(const log of (state.data.vendorLogs||[])){
    const l=(log.links||[]).find(x=>x.id===id);
    if(l) return {target:log,link:l};
  }
  return null;
}

        :`<a href="${(lk.url||'').replace(/"/g,'&quot;')}" target="_blank" class="btn" style="padding:3px 8px;font-size:11px;border-radius:999px;text-decoration:none"><i class="ti ti-external-link"></i></a>`;
    return `<div class="files-item-row">
      <i class="ti ${icon}" style="font-size:17px;color:${color};flex-shrink:0"></i>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${label}</div>
        <div style="display:flex;gap:6px;align-items:center;margin-top:2px">
          <span style="font-size:10px;color:var(--muted);background:rgba(255,255,255,.5);padding:1px 8px;border-radius:20px">${lk._src||''}</span>
          ${date?`<span style="font-size:10px;color:var(--muted)">${dayjs(date).format('M월 D일')}</span>`:''}
        </div>
      </div>
      <div style="display:flex;gap:4px;flex-shrink:0">${acts}</div>
    </div>`;
  }).join('');
}

/* ── 자동 분류 ── */
function getAutoFolders(all){
  const vm={},pm={};
  all.forEach(it=>{
    if(it._srcType==='vendor'||it._srcType==='log'){
      const v=state.data.vendors.find(x=>x.id===it._vid);
      if(v){if(!vm[v.id]) vm[v.id]={name:v.name,items:[]};vm[v.id].items.push(it);}
    } else if(it._srcType==='project'){
      if(!pm[it._pid]) pm[it._pid]={name:it._src,items:[]};
      pm[it._pid].items.push(it);
    }
  });
  const r=[];
  Object.values(vm).forEach(g=>{if(g.items.length) r.push({id:'auto_v_'+g.name,name:g.name,color:'#1C85E8',items:g.items});});
  Object.values(pm).forEach(g=>{if(g.items.length) r.push({id:'auto_p_'+g.name,name:g.name,color:'#7C3AED',items:g.items});});
  return r;
}

/* ── 폴더 유틸 ── */
function findFolder(folders,id){
  for(const f of folders){if(f.id===id) return f;if(f.children){const r=findFolder(f.children,id);if(r) return r;}}
  return null;
}
function findFolderName(folders,id){return findFolder(folders,id)?.name||'';}
function findFolderColor(folders,id){return findFolder(folders,id)?.color||null;}
function getAllFolderIds(folder){
  const ids=[...(folder.items||[])];
  (folder.children||[]).forEach(c=>ids.push(...getAllFolderIds(c)));
  return ids;
}
function getFolderItems(folders,id,all){
  const f=findFolder(folders,id);
  if(!f) return [];
  const ids=new Set(f.items||[]);
  return all.filter(it=>ids.has(it.id));
}

/* ── 폴더 트리 렌더링 ── */
function renderFolderTree(folders,activeId,all,depth){
  return folders.map(f=>{
    const isAct=activeId===f.id,c=f.color||'#1C85E8';
    const cnt=getFolderItems(folders,f.id,all).length;
    const children=f.children||[];
    const isOpen=(state.filesOpenFolders||{})[f.id]!==false;
    const pl=(4+depth*12)+'px';
    return `<div>
      <div style="display:flex;align-items:center;border-radius:10px;${isAct?`background:${c}18`:''};margin-bottom:1px">
        ${children.length?`<button class="files-tree-toggle" data-fid="${f.id}" style="border:none;background:none;cursor:pointer;color:var(--muted);padding:0 2px 0 ${pl};font-size:11px;flex-shrink:0"><i class="ti ti-chevron-${isOpen?'down':'right'}"></i></button>`:`<div style="width:${parseInt(pl)+12}px;flex-shrink:0"></div>`}
        <button class="files-folder-btn ${isAct?'active':''}" data-fid="${f.id}" style="flex:1;padding-left:4px;${isAct?`color:${c};font-weight:500`:''}">
          <i class="ti ti-folder-filled" style="color:${c};font-size:14px;flex-shrink:0"></i>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">${f.name}</span>
          <span style="font-size:10px;color:var(--muted);background:rgba(255,255,255,.5);padding:1px 6px;border-radius:20px;flex-shrink:0">${cnt}</span>
        </button>
        <div style="display:flex;gap:1px;padding-right:4px;flex-shrink:0">
          <button class="btn folder-add-child-btn" data-fid="${f.id}" style="padding:2px 5px;font-size:10px;border:none;background:none;color:var(--muted)" title="하위 폴더 추가"><i class="ti ti-folder-plus"></i></button>
          <button class="btn folder-edit-btn" data-fid="${f.id}" style="padding:2px 5px;font-size:10px;border:none;background:none;color:var(--muted)" title="편집"><i class="ti ti-dots-vertical"></i></button>
        </div>
      </div>
      ${isOpen&&children.length?`<div>${renderFolderTree(children,activeId,all,depth+1)}</div>`:''}</div>`;
  }).join('');
}

function viewFiles(){
  if(!state.data.fileFolders) state.data.fileFolders=[];
  const all=collectAllFileItems();
  const manualFolders=state.data.fileFolders;
  const autoFolders=getAutoFolders(all);
  const assignedIds=new Set(manualFolders.flatMap(f=>getAllFolderIds(f)));
  const unassigned=all.filter(it=>!assignedIds.has(it.id));
  const activeId=state.filesActiveFolderId||'root';

  // 현재 보여줄 폴더/파일 결정
  let currentFolders=[], viewItems=[], breadcrumb=[];
  if(activeId==='root'){
    currentFolders=manualFolders;
    viewItems=unassigned;
    breadcrumb=[];
  } else if(activeId==='all'){
    currentFolders=[];
    viewItems=all;
  } else if(activeId==='unassigned'){
    currentFolders=[];
    viewItems=unassigned;
  } else if(activeId.startsWith('auto_')){
    currentFolders=[];
    viewItems=autoFolders.find(f=>f.id===activeId)?.items||[];
  } else {
    const f=findFolder(manualFolders,activeId);
    currentFolders=f?.children||[];
    viewItems=getFolderItems(manualFolders,activeId,all);
    // 브레드크럼 빌드
    function buildCrumb(folders,targetId,trail=[]){
      for(const f of folders){
        const next=[...trail,{id:f.id,name:f.name}];
        if(f.id===targetId) return next;
        if(f.children){const r=buildCrumb(f.children,targetId,next);if(r) return r;}
      }
      return null;
    }
    breadcrumb=buildCrumb(manualFolders,activeId)||[];
  }

  const PAGE=20,filePage=state.filesPage||0;
  const totalPages=Math.ceil(viewItems.length/PAGE);
  const pageItems=viewItems.slice(filePage*PAGE,(filePage+1)*PAGE);
  const selCount=(state.filesSelected||new Set()).size;
  const selBarHtml=selCount>0?`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px 14px;background:rgba(28,133,232,.1);border:1px solid rgba(28,133,232,.25);border-radius:12px"><i class="ti ti-checkbox" style="color:var(--o);font-size:16px"></i><span style="font-size:13px;font-weight:600;color:var(--od)">${selCount}개 선택됨</span><span style="font-size:12px;color:var(--muted)">— 내 폴더 카드로 드래그해서 이동</span><button id="fcClearSelBtn" class="btn" style="margin-left:auto;font-size:11px;padding:3px 10px;border-radius:999px">선택 해제</button></div>`:'';

  // 파일 아이콘/색상
  function fileIconColor(lk){
    if(lk.type==='doc') return {icon:'ti-file-text',color:'#7C3AED',bg:'#F3F0FF'};
    if(lk.data){
      const t=lk.type||'';
      if(t.includes('image')) return {icon:'ti-photo',color:'#0891B2',bg:'#E0F7FA'};
      if(t.includes('pdf')) return {icon:'ti-file-type-pdf',color:'#DC2626',bg:'#FEE2E2'};
      if(t.includes('sheet')||String(lk.label||'').endsWith('.xlsx')) return {icon:'ti-file-spreadsheet',color:'#15803D',bg:'#DCFCE7'};
      return {icon:'ti-file',color:'#6B7280',bg:'#F3F4F6'};
    }
    const u=lk.url||'';
    if(u.includes('drive.google')) return {icon:'ti-brand-google-drive',color:'#1C85E8',bg:'#EFF6FF'};
    if(u.includes('notion.')) return {icon:'ti-brand-notion',color:'#374151',bg:'#F3F4F6'};
    if(u.includes('sharepoint')) return {icon:'ti-brand-office',color:'#D97706',bg:'#FEF3C7'};
    return {icon:'ti-link',color:'#1C85E8',bg:'#EFF6FF'};
  }

  // 폴더 카드
  function folderCard(f,isDraggable=true){
    const c=f.color||'#1C85E8';
    const childCnt=(f.children||[]).length;
    const itemCnt=(f.items||[]).length;
    const isAuto=f.id.startsWith('auto_');
    return `<div class="fc-card fc-folder" data-fid="${f.id}" draggable="${isDraggable&&!isAuto}" 
      style="background:rgba(255,255,255,.72);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);border-radius:16px;padding:16px;cursor:pointer;transition:box-shadow .18s,transform .15s;position:relative;user-select:none"
      onmouseenter="this.style.boxShadow='0 8px 24px rgba(11,27,46,.12)';this.style.transform='translateY(-2px)'"
      onmouseleave="this.style.boxShadow='';this.style.transform=''">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px">
        <div style="width:44px;height:44px;border-radius:12px;background:${c}22;display:flex;align-items:center;justify-content:center">
          <i class="ti ti-folder-filled" style="font-size:24px;color:${c}"></i>
        </div>
        ${!isAuto?`<div style="display:flex;gap:2px;opacity:0;transition:opacity .15s" class="fc-actions">
          <button class="btn folder-add-child-btn" data-fid="${f.id}" onclick="event.stopPropagation()" style="padding:2px 6px;font-size:10px;border-radius:8px" title="하위 폴더"><i class="ti ti-folder-plus"></i></button>
          <button class="btn folder-edit-btn" data-fid="${f.id}" onclick="event.stopPropagation()" style="padding:2px 6px;font-size:10px;border-radius:8px" title="편집"><i class="ti ti-dots-vertical"></i></button>
        </div>`:''}
      </div>
      <div style="font-size:13px;font-weight:600;color:#111;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</div>
      <div style="font-size:11px;color:var(--muted)">${childCnt?childCnt+'개 폴더 · ':''} ${itemCnt}개 파일</div>
      <div class="fc-drop-overlay" style="display:none;position:absolute;inset:0;border-radius:16px;background:${c}22;border:2px dashed ${c};align-items:center;justify-content:center;font-size:12px;font-weight:600;color:${c}">여기에 이동</div>
    </div>`;
  }

  // 파일 카드
  function fileCard(lk){
    const {icon,color,bg}=fileIconColor(lk);
    const label=(lk.label||'파일').replace(/</g,'&lt;');
    const date=lk.addedDate||lk._date||'';
    const isDoc=lk.type==='doc';
    const isSel=(state.filesSelected||new Set()).has(lk.id);
    return `<div class="fc-card fc-file ${isSel?'fc-selected':''}" data-fid="${lk.id}" draggable="true"
      style="background:${isSel?'rgba(28,133,232,.12)':'rgba(255,255,255,.72)'};backdrop-filter:blur(14px);border:${isSel?'2px solid rgba(28,133,232,.5)':'1px solid rgba(255,255,255,.8)'};border-radius:16px;padding:16px;transition:box-shadow .18s,transform .15s,border .12s,background .12s;position:relative;cursor:grab;user-select:none"
      onmouseenter="if(!this.classList.contains('fc-selected')){this.style.boxShadow='0 8px 24px rgba(11,27,46,.12)';this.style.transform='translateY(-2px)';}this.querySelector('.fc-actions')&&(this.querySelector('.fc-actions').style.opacity='1')"
      onmouseleave="if(!this.classList.contains('fc-selected')){this.style.boxShadow='';this.style.transform='';}this.querySelector('.fc-actions')&&(this.querySelector('.fc-actions').style.opacity='0')">
      <!-- 체크박스 (좌상단) -->
      <div class="fc-check" style="position:absolute;top:10px;left:10px;width:18px;height:18px;border-radius:5px;border:1.5px solid ${isSel?'var(--o)':'rgba(0,0,0,.25)'};background:${isSel?'var(--o)':'rgba(255,255,255,.7)'};display:flex;align-items:center;justify-content:center;opacity:${isSel?'1':'0'};transition:opacity .12s;cursor:pointer;z-index:2;flex-shrink:0">
        ${isSel?'<i class="ti ti-check" style="font-size:11px;color:#fff"></i>':''}
      </div>
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px">
        <div style="width:44px;height:44px;border-radius:12px;background:${bg};display:flex;align-items:center;justify-content:center">
          <i class="ti ${icon}" style="font-size:22px;color:${color}"></i>
        </div>
        <div style="display:flex;gap:2px;opacity:0;transition:opacity .15s" class="fc-actions">
          ${isDoc?`<button class="btn files-doc-open" data-id="${lk.id}" onclick="event.stopPropagation()" style="padding:2px 6px;font-size:10px;border-radius:8px"><i class="ti ti-edit"></i></button>
                   <button class="btn files-doc-dl" data-id="${lk.id}" onclick="event.stopPropagation()" style="padding:2px 6px;font-size:10px;border-radius:8px"><i class="ti ti-download"></i></button>`
          :lk.data?`<a href="data:${lk.type};base64,${lk.data}" download="${label}" class="btn" onclick="event.stopPropagation()" style="padding:2px 6px;font-size:10px;border-radius:8px;text-decoration:none"><i class="ti ti-download"></i></a>`
          :`<a href="${(lk.url||'').replace(/"/g,'&quot;')}" target="_blank" class="btn" onclick="event.stopPropagation()" style="padding:2px 6px;font-size:10px;border-radius:8px;text-decoration:none"><i class="ti ti-external-link"></i></a>`}
        </div>
      </div>
      <div style="font-size:13px;font-weight:500;color:#111;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${label}">${label}</div>
      <div style="font-size:11px;color:var(--muted)">${lk._src||''}${date?' · '+dayjs(date).format('YY.M.D'):''}</div>
    </div>`;
  }

  // 사이드바
  const sidebarHtml=`
    <div style="width:200px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.4);padding:14px 10px;background:rgba(255,255,255,.15);overflow-y:auto">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding:0 4px">탐색</div>
      <button class="files-folder-btn ${activeId==='all'?'active':''}" data-fid="all"><i class="ti ti-files" style="font-size:14px;flex-shrink:0;color:var(--muted)"></i><span style="flex:1">전체 파일</span><span style="font-size:10px;color:var(--muted);background:rgba(255,255,255,.5);padding:1px 6px;border-radius:20px">${all.length}</span></button>
      <button class="files-folder-btn ${activeId==='root'?'active':''}" data-fid="root"><i class="ti ti-home" style="font-size:14px;flex-shrink:0;color:var(--muted)"></i><span style="flex:1">내 폴더</span></button>
      <button class="files-folder-btn ${activeId==='unassigned'?'active':''}" data-fid="unassigned"><i class="ti ti-file-unknown" style="font-size:14px;flex-shrink:0;color:var(--muted)"></i><span style="flex:1">미분류</span><span style="font-size:10px;color:var(--muted);background:rgba(255,255,255,.5);padding:1px 6px;border-radius:20px">${unassigned.length}</span></button>
      ${autoFolders.length?`
      <div style="height:1px;background:rgba(255,255,255,.4);margin:8px 4px"></div>
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;padding:0 4px">자동 분류</div>
      ${autoFolders.map(f=>{const isAct=activeId===f.id;return `<button class="files-folder-btn ${isAct?'active':''}" data-fid="${f.id}"><i class="ti ti-folder-filled" style="font-size:14px;flex-shrink:0;color:${f.color}"></i><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span><span style="font-size:10px;color:var(--muted);background:rgba(255,255,255,.5);padding:1px 6px;border-radius:20px;flex-shrink:0">${f.items.length}</span></button>`;}).join('')}`:''}

  const crumbHtml=breadcrumb.length?`
    <div style="display:flex;align-items:center;gap:4px;margin-bottom:4px">
      <button class="files-folder-btn" data-fid="root" style="padding:2px 8px;font-size:12px;background:none"><i class="ti ti-home" style="font-size:12px"></i></button>

        <i class="ti ti-chevron-right" style="font-size:11px;color:var(--muted)"></i>
        <button class="files-folder-btn" data-fid="${c.id}" style="padding:2px 8px;font-size:12px;background:none;font-weight:${i===breadcrumb.length-1?'600':'400'}">${c.name}</button>
      `).join('')}

  // 페이저
  const pagerHtml=totalPages>1?`
    <div style="display:flex;justify-content:center;gap:4px;margin-top:16px">
      <button class="btn files-page-btn" data-p="${Math.max(0,filePage-1)}" ${filePage===0?'disabled':''} style="padding:4px 10px;border-radius:999px"><i class="ti ti-chevron-left"></i></button>
      ${Array.from({length:totalPages},(_,i)=>`<button class="btn files-page-btn ${i===filePage?'btn-o':''}" data-p="${i}" style="padding:4px 10px;min-width:32px;border-radius:999px">${i+1}</button>`).join('')}
      <button class="btn files-page-btn" data-p="${Math.min(totalPages-1,filePage+1)}" ${filePage>=totalPages-1?'disabled':''} style="padding:4px 10px;border-radius:999px"><i class="ti ti-chevron-right"></i></button>
    </div>`:'';

  const showAddFolder=activeId==='root'||(!activeId.startsWith('auto_')&&activeId!=='all'&&activeId!=='unassigned');

  return `<div style="display:flex;min-height:calc(100vh - 120px)">
    ${sidebarHtml}
    <div style="flex:1;padding:20px 24px;min-width:0;overflow-y:auto">
      <!-- 타이틀 행 -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
        <div>
          ${crumbHtml}
          <span style="font-size:18px;font-weight:700;color:#111">
            ${activeId==='root'?'내 폴더':activeId==='all'?'전체 파일':activeId==='unassigned'?'미분류':breadcrumb[breadcrumb.length-1]?.name||''}
          </span>
        </div>
        <div style="display:flex;gap:6px">
          ${showAddFolder?`<button id="addFolderBtn" class="btn" style="border-radius:999px;font-size:12px"><i class="ti ti-folder-plus"></i> 새 폴더</button>`:''}
          ${(!activeId.startsWith('auto_')&&activeId!=='all')&&findFolder(manualFolders,activeId)?`<button id="addItemsToFolderBtn" class="btn btn-o" style="border-radius:999px;font-size:12px"><i class="ti ti-plus"></i> 파일 추가</button>`:''}
        </div>
      </div>

      ${selBarHtml}
      <!-- 그리드 -->
      <div id="filesGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px">
        ${currentFolders.map(f=>folderCard(f)).join('')}
        ${pageItems.map(lk=>fileCard(lk)).join('')}
        ${currentFolders.length===0&&pageItems.length===0?`<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:var(--muted)"><i class="ti ti-inbox" style="font-size:40px;display:block;margin-bottom:10px;opacity:.3"></i>비어 있습니다</div>`:''}
      </div>
      ${pagerHtml}
    </div>
  </div>`;
}

/* ── 폴더 모달 ── */

    <div class="mf"><button class="btn" id="closeModal" style="border-radius:999px">취소</button><button type="submit" form="folderForm" class="btn btn-o" style="border-radius:999px"><i class="ti ti-device-floppy"></i> 저장</button></div>

function bindFolderModal(existingFolder,parentId){
  document.querySelectorAll('.cpick').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.cpick').forEach(b=>b.style.borderColor='transparent');
      btn.style.borderColor='#111';
      document.getElementById('folderColorVal').value=btn.dataset.color;
    });
  });
  document.getElementById('folderForm').addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const name=(fd.get('name')||'').trim(),color=fd.get('color')||'#1C85E8',pid=fd.get('parentId')||'';
    if(!name){showToast('이름을 입력하세요.');return;}
    if(!state.data.fileFolders) state.data.fileFolders=[];
    if(existingFolder){existingFolder.name=name;existingFolder.color=color;}
    else{
      const nf={id:uid('ff'),name,color,items:[],children:[]};
      if(pid){const par=findFolder(state.data.fileFolders,pid);if(par){if(!par.children) par.children=[];par.children.push(nf);}else state.data.fileFolders.push(nf);}
      else state.data.fileFolders.push(nf);
    }
    closeModal();persist(false);render();showToast(existingFolder?'폴더가 수정됐습니다.':'폴더가 추가됐습니다.');
  });
  const delBtn=document.getElementById('deleteFolderBtn');
  if(delBtn&&existingFolder) delBtn.addEventListener('click',()=>{
    if(!confirm(`"${existingFolder.name}" 폴더를 삭제할까요?\n하위 폴더도 함께 삭제됩니다.`)) return;
    function rm(folders,id){const i=folders.findIndex(f=>f.id===id);if(i>-1){folders.splice(i,1);return true;}for(const f of folders){if(f.children&&rm(f.children,id)) return true;}return false;}
    rm(state.data.fileFolders,existingFolder.id);
    if(state.filesActiveFolderId===existingFolder.id) state.filesActiveFolderId='all';
    closeModal();persist(false);render();showToast('폴더가 삭제됐습니다.');
  });
}

  function getSelectedTable(){
    const sel=window.getSelection();
    if(!sel.rangeCount) return null;
    let n=sel.getRangeAt(0).commonAncestorContainer;
    while(n&&n!==area){if(n.tagName==='TABLE') return n;n=n.parentNode;}
    return null;
  }
  document.getElementById('docAddRowBtn').addEventListener('click',()=>{
    const tbl=getSelectedTable();if(!tbl) return;
    const cols=tbl.rows[0]?.cells?.length||3;

    for(let i=0;i<cols;i++){const td=tr.insertCell();td.style.cssText='border:1px solid #ddd;padding:6px 10px;min-width:60px';td.textContent='내용';}
  });
  document.getElementById('docAddColBtn').addEventListener('click',()=>{
    const tbl=getSelectedTable();if(!tbl) return;
    Array.from(tbl.rows).forEach(row=>{const td=row.insertCell();td.style.cssText='border:1px solid #ddd;padding:6px 10px;min-width:60px';td.textContent='내용';});
  });

  // 닫기
  document.getElementById('docCloseBtn').addEventListener('click',()=>{overlay.remove();placeholderStyle.remove();});
  document.getElementById('docCancelBtn').addEventListener('click',()=>{overlay.remove();placeholderStyle.remove();});

  // 저장
  document.getElementById('docFileSaveBtn').addEventListener('click',()=>{
    const title=(document.getElementById('docTitleInp').value||'').trim()||'제목 없는 문서';
    const content=area.innerHTML.trim();
    if(!content){showToast('내용을 입력해주세요.');return;}
    if(link){link.label=title;link.content=content;link.updatedDate=dayjs().format('YYYY-MM-DD');}
    else{target.links.push({id:uid('doc'),type:'doc',label:title,content,addedDate:dayjs().format('YYYY-MM-DD')});}
    overlay.remove();placeholderStyle.remove();persist(false);render();showToast('문서가 저장됐습니다.');
  });

  // Ctrl+S 저장
  overlay.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();document.getElementById('docFileSaveBtn').click();}
  });

  area.focus();
}

function downloadDocAsWord(label,html){
  const name=(label||'문서').replace(/[\\/:*?"<>|]/g,'_');
  const blob=new Blob(['\ufeff',`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${name}</title></head><body>${html||''}</body></html>`],{type:'application/msword'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.doc';document.body.appendChild(a);a.click();a.remove();
}

function viewHome(){
  const today = dayjs().startOf('day');
  const todayStr = today.format('YYYY-MM-DD');
  const allEvs = allCalendarEvents();
  const todayEvs = allEvs.filter(e=>e.date===todayStr);
  const deadlines = state.data.projects
    .filter(p=>p.deadline)
    .map(p=>({...p, dday: dayjs(p.deadline).diff(today,'day')}))
    .filter(p=>p.dday>=0 && p.dday<=7).sort((a,b)=>a.dday-b.dday);
  // 미완료 프로젝트 전체 (마감일이 있고, 완료되지 않은 프로젝트) — 7일 이내 빨강 / 30일 이내 파랑 / 그 외 초록
  const ddayBadgeClass = (d)=> d<=7 ? 'dl-c' : d<=30 ? 'dl-b' : 'dl-ok';
  const incompleteProjects = state.data.projects
    .filter(p=>p.deadline && (p.status||'진행중')==='진행중')
    .map(p=>({...p, dday: dayjs(p.deadline).diff(today,'day')}))
    .filter(p=>p.dday>=0)
    .sort((a,b)=>a.dday-b.dday);
  const ipPage = state.homeIncompleteProjectPage || 0;
  const IP_PER_PAGE = 5;
  const ipTotalPages = Math.ceil(incompleteProjects.length / IP_PER_PAGE);
  const ipPageItems = incompleteProjects.slice(ipPage*IP_PER_PAGE, ipPage*IP_PER_PAGE+IP_PER_PAGE);
  const ACT_PER_PAGE = 12;
  const actPage = state.dashActivityPage || 0;
  const oneMonthAgo = dayjs().subtract(1,'month');
  const recentLogsAll = collectAllRecentActivity().filter(l=>dayjs(l.date).diff(oneMonthAgo) >= 0);
  const actTotalPages = Math.ceil(recentLogsAll.length / ACT_PER_PAGE);
  const recentLogs = recentLogsAll.slice(actPage*ACT_PER_PAGE, actPage*ACT_PER_PAGE+ACT_PER_PAGE);
  const allCL = state.data.projects.flatMap(p=>p.checklist.map(c=>({...c,pid:p.id,ptitle:p.title})));
  const inProgProjects = state.data.projects.filter(p=> progressOf(p) > 0 && progressOf(p) < 100).length;
  const undoneItems = allCL.filter(c=>!c.done).length;
  const thisMonthStr = today.format('YYYY-MM');

  // 다가오는 공휴일 (7일 이내)
  const upcomingHolidays = allCalendarEvents()
    .filter(e=>e.isHoliday)
    .map(e=>({...e, dday:dayjs(e.date).diff(today,'day')}))
    .filter(e=>e.dday>=0 && e.dday<=7)
    .sort((a,b)=>a.dday-b.dday);
  const meetingTypes = ['미팅','전화 통화','온라인 미팅','외근'];
  const thisMonthMeetings = allCalendarEvents().filter(e=>e.date.startsWith(thisMonthStr) && meetingTypes.includes(e.type)).length;

  // 프로젝트별 진행률
  const projColors = ['#3E8ED9','#9B6FD1','#E0709B','#D9A23E','#4FAE8E','#D9645A','#4FB8C4','#8FB562'];

  // 미완료 다음액션 (nextStep이 있고, 완료 아닌 로그들)
  const paFilter = state.dashActionFilter || '전체';
  let pendingActionsAll = state.data.vendorLogs
    .filter(l=>l.nextStep && l.nextStep.trim() && !l.nextStepDone);
  if(paFilter==='이번주'){
    const weekEndStr = dayjs().endOf('week').format('YYYY-MM-DD');
    pendingActionsAll = pendingActionsAll.filter(l=>l.nextStepDue && l.nextStepDue<=weekEndStr);
  } else if(paFilter==='이번달'){
    const monthEndStr = dayjs().endOf('month').format('YYYY-MM-DD');
    pendingActionsAll = pendingActionsAll.filter(l=>l.nextStepDue && l.nextStepDue<=monthEndStr);
  }
  pendingActionsAll = pendingActionsAll.sort((a,b)=>{

  {tz:'Asia/Seoul', label:'서울'},
  {tz:'America/Los_Angeles', label:'시애틀'},

  {tz:'Asia/Shanghai', label:'상하이'},
  {tz:'Asia/Hong_Kong', label:'홍콩'},
  {tz:'Asia/Singapore', label:'싱가포르'},
  {tz:'Australia/Sydney', label:'시드니'},
  {tz:'Asia/Dubai', label:'두바이'},
];

function tzParts(tz){
  const now = new Date();
  let timeStr = '--:--', dateStr = '', offset = '', isDay = true;
  try{
    timeStr = new Intl.DateTimeFormat('en-GB',{timeZone:tz, hour:'2-digit', minute:'2-digit', hour12:false}).format(now);
    const hour = parseInt(new Intl.DateTimeFormat('en-US',{timeZone:tz, hour:'2-digit', hour12:false}).format(now).replace(/\D/g,''),10);
    const days=['일','월','화','수','목','금','토'];
    const dParts = new Intl.DateTimeFormat('en-US',{timeZone:tz, month:'numeric', day:'numeric', weekday:'short'}).formatToParts(now);
    const month = dParts.find(p=>p.type==='month')?.value;
    const day = dParts.find(p=>p.type==='day')?.value;
    const wkKR = new Intl.DateTimeFormat('en-US',{timeZone:tz, weekday:'short'}).format(now);
    const wkMap = {Sun:'일',Mon:'월',Tue:'화',Wed:'수',Thu:'목',Fri:'금',Sat:'토'};
    dateStr = `${month}/${day} (${wkMap[wkKR]||''})`;
    const offParts = new Intl.DateTimeFormat('en-US',{timeZone:tz, timeZoneName:'shortOffset'}).formatToParts(now);
    offset = (offParts.find(p=>p.type==='timeZoneName')?.value||'').replace('GMT','UTC');
    isDay = hour>=6 && hour<18;
  }catch(e){}
  return {timeStr, dateStr, offset, isDay};
}

let clockInterval = null;
function startClock(){
  function tick(){
    document.querySelectorAll('.tz-time[data-tz]').forEach(el=>{
      const tz = el.dataset.tz;
      const {timeStr, dateStr, offset, isDay} = tzParts(tz);
      el.textContent = timeStr;
      const dateEl = document.querySelector(`.tz-date[data-tz="${CSS.escape(tz)}"]`);
      if(dateEl) dateEl.textContent = dateStr;
      const offEl = document.querySelector(`.tz-offset[data-tz="${CSS.escape(tz)}"]`);
      if(offEl) offEl.textContent = offset;
      const dnEl = document.querySelector(`.tz-daynight[data-tz="${CSS.escape(tz)}"]`);
      if(dnEl) dnEl.innerHTML = isDay ? '<i class="ti ti-sun" style="font-size:10px;color:#D97706"></i> Day' : '<i class="ti ti-moon" style="font-size:10px;color:#6366F1"></i> Night';
      const rowEl = document.querySelector(`.tz-card[data-tz="${CSS.escape(tz)}"]`);
      if(rowEl) rowEl.style.background = isDay ? 'rgba(255,255,255,.45)' : 'rgba(30,41,59,.06)';
    });
  }
  if(clockInterval) clearInterval(clockInterval);
  tick();
  clockInterval = setInterval(tick, 1000);
}


async function loadQuote(){
  // 다국어 명언 API (zenquotes.io 또는 fallback)
  const fallbacks = [
    '성공은 작은 노력들이 매일 반복된 결과입니다.',
    '오늘 할 수 있는 일을 내일로 미루지 마세요.',
    '목표를 향해 한 걸음씩 나아가는 것이 중요합니다.',
    '어려운 상황이 훌륭한 사람을 만듭니다.',
    '작은 진전이라도 진전입니다.',
    '지금 이 순간에 집중하세요.',
    '성장은 편안함 밖에서 일어납니다.',
    '끈기는 재능을 이깁니다.',
    '실패는 성공의 어머니입니다.',
    '오늘도 최선을 다하면 됩니다.'
  ];
  try{
    const res = await fetch('https://api.quotable.io/random?maxLength=100', {mode:'cors'});
    if(res.ok){
      const data = await res.json();
      const el = document.getElementById('quoteText');
      if(el) el.textContent = `"${data.content}" — ${data.author}`;
      return;
    }
  }catch(e){}
  // 폴백: 로컬 명언
  const el = document.getElementById('quoteText');
  if(el) el.textContent = fallbacks[new Date().getDate() % fallbacks.length];
}

function renderLogLinks(links){
  if(!links || !links.length) return '';
  const items = links.map(lk=>{
    const label = (lk.label||lk.name||'파일').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if(lk.data){
      // 직접 업로드 파일 → 아이콘/색상 구분 + 다운로드
      const t = lk.type||'';
      const icon = t.includes('image') ? 'ti-photo'
                 : t.includes('pdf') ? 'ti-file-type-pdf'
                 : (t.includes('sheet')||label.endsWith('.xlsx')||label.endsWith('.xls')) ? 'ti-file-spreadsheet'
                 : (t.includes('word')||label.endsWith('.docx')) ? 'ti-file-word'
                 : 'ti-file';
      const color = t.includes('image') ? '#0891B2'
                  : t.includes('pdf') ? '#DC2626'
                  : (t.includes('sheet')||label.endsWith('.xlsx')) ? '#15803D'
                  : '#6B21A8';
      const bg = t.includes('image') ? '#E0F2FE'
               : t.includes('pdf') ? '#FEE2E2'
               : (t.includes('sheet')||label.endsWith('.xlsx')) ? '#DCFCE7'
               : '#F3E8FF';
      return '<a href="data:'+t+';base64,'+lk.data+'" download="'+label+'" style="font-size:11px;padding:2px 8px;border-radius:20px;background:'+bg+';color:'+color+';text-decoration:none;display:inline-flex;align-items:center;gap:3px;border:0.5px solid '+color+'33"><i class="ti '+icon+'" style="font-size:10px"></i>'+label+'</a>';
    }
    // URL 링크
    const url = (lk.url||'').replace(/"/g,'&quot;');
    const isDrive = url.includes('drive.google')||url.includes('docs.google');
    const isNotion = url.includes('notion.');
    const urlIcon = isDrive ? 'ti-brand-google-drive' : isNotion ? 'ti-brand-notion' : 'ti-link';
    return '<a href="'+url+'" target="_blank" rel="noopener" style="font-size:11px;padding:2px 8px;border-radius:20px;background:#FEF3C7;color:#92400E;text-decoration:none;display:inline-flex;align-items:center;gap:3px;border:0.5px solid #F59E0B33"><i class="ti '+urlIcon+'" style="font-size:10px"></i>'+label+'</a>';
  });
  return '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">'+items.join('')+'</div>';
}

let _activeDropdown = null; // {trigger, menu}
let _dropdownOpenedAt = 0;

function closeDropdown(){
  if(_activeDropdown){
    _activeDropdown.menu.remove();
    _activeDropdown.trigger.classList.remove('cdd-open');
    _activeDropdown = null;
  }
}

function openDropdown(trigger, options){
  const rect = trigger.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'cdd-menu-portal';
  menu.innerHTML = options.map((o,i)=>{
    if(o.divider) return '<div class="cdd-divider"></div>';
    const iconHtml = o.icon ? `<i class="ti ${o.icon} cdd-icon" style="color:${o.iconColor||'var(--muted)'}"></i>` : (o.dot?`<span class="cdd-dot" style="background:${o.dot}"></span>`:'');
    return `<div class="cdd-item ${o.active?'active':''}" data-idx="${i}">${iconHtml}<span>${o.label}</span>${o.active?'<i class="ti ti-check cdd-check"></i>':''}</div>`;
  }).join('');
  document.body.appendChild(menu);
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let top = rect.bottom + 6, left = rect.left;
  if(left + mw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - mw - 8);
  if(top + mh > window.innerHeight - 8) top = Math.max(8, rect.top - mh - 6);
  menu.style.top = top+'px';
  menu.style.left = left+'px';
  menu.style.minWidth = Math.max(rect.width, 150)+'px';
  trigger.classList.add('cdd-open');
  _dropdownOpenedAt = Date.now();
  menu.querySelectorAll('.cdd-item').forEach(item=>{
    item.addEventListener('click', ev=>{
      ev.stopPropagation();
      const o = options[parseInt(item.dataset.idx)];
      closeDropdown();
      if(o && o.onSelect) o.onSelect();
    });
  });
  _activeDropdown = {trigger, menu};
}

// 범용: 사람 다중 선택 드롭다운 (트리거 버튼 + 체크박스 메뉴)
function bindMultiPersonSelect(triggerEl, people, initialIds, onChange){
  let selected = (initialIds||[]).slice();
  const labelSpan = triggerEl.querySelector('span');
  function syncLabel(){
    if(selected.length===0){ labelSpan.textContent = '담당자 선택'; labelSpan.style.color = 'var(--muted)'; }
    else {
      const names = people.filter(p=>selected.includes(p.id)).map(p=>p.name);
      labelSpan.textContent = names.join(', ');
      labelSpan.style.color = 'var(--text)';
    }
    if(onChange) onChange(selected.slice());
  }
  syncLabel();
  triggerEl.addEventListener('click', e=>{
    e.stopPropagation();
    if(_activeDropdown && _activeDropdown.trigger === triggerEl){ closeDropdown(); return; }
    closeDropdown();
    const rect = triggerEl.getBoundingClientRect();
    const menu = document.createElement('div');
    menu.className = 'cdd-menu-portal';
    menu.innerHTML = people.length ? people.map(p=>{
      const active = selected.includes(p.id);
      return `<div class="cdd-item ${active?'active':''}" data-pid="${p.id}"><i class="ti ${active?'ti-square-check':'ti-square'} cdd-icon" style="color:${active?'var(--o)':'var(--muted)'}"></i><span>${p.name}${p.title?' ('+p.title+')':''}</span></div>`;
    }).join('') : '<div class="empty-state" style="padding:16px;font-size:12px">등록된 담당자가 없습니다.</div>';
    document.body.appendChild(menu);
    const mw = menu.offsetWidth, mh = menu.offsetHeight;
    let top = rect.bottom + 6, left = rect.left;
    if(left + mw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - mw - 8);
    if(top + mh > window.innerHeight - 8) top = Math.max(8, rect.top - mh - 6);
    menu.style.top = top+'px'; menu.style.left = left+'px'; menu.style.minWidth = Math.max(rect.width, 200)+'px';
    triggerEl.classList.add('cdd-open');
    _dropdownOpenedAt = Date.now();
    menu.querySelectorAll('.cdd-item[data-pid]').forEach(item=>{
      item.addEventListener('click', ev=>{
        ev.stopPropagation();
        const pid = item.dataset.pid;
        if(selected.includes(pid)) selected = selected.filter(id=>id!==pid);
        else selected = [...selected, pid];
        const isActive = selected.includes(pid);
        item.classList.toggle('active', isActive);
        const icon = item.querySelector('.cdd-icon');
        icon.className = 'ti '+(isActive?'ti-square-check':'ti-square')+' cdd-icon';
        icon.style.color = isActive?'var(--o)':'var(--muted)';
        syncLabel();
      });
    });
    _activeDropdown = {trigger:triggerEl, menu};
  });
  return { getSelected: ()=>selected.slice() };
}

/* ── 네이티브 <select> 자동 커스텀 드롭다운 변환 ── */
const _enhancedSelects = new WeakSet();
function enhanceSelect(sel){
  if(_enhancedSelects.has(sel) || sel.multiple) return;
  _enhancedSelects.add(sel);
  const trigger = document.createElement('button');
  trigger.type = 'button';
  const extraStyle = sel.getAttribute('style') || '';
  const hasInpClass = sel.classList.contains('inp');
  trigger.className = (hasInpClass ? 'inp cdd-trigger select-shell-trigger ' : 'cdd-trigger select-shell-trigger ') + sel.className;
  const baseStyle = hasInpClass ? '' : 'width:auto;flex-shrink:0;';
  trigger.setAttribute('style', baseStyle + extraStyle + ';display:flex;align-items:center;justify-content:space-between;text-align:left;gap:6px;-webkit-appearance:none;appearance:none');
  const labelSpan = document.createElement('span');
  labelSpan.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0';
  trigger.appendChild(labelSpan);
  const caret = document.createElement('i');
  caret.className = 'ti ti-chevron-down cdd-caret';
  caret.style.cssText = 'flex-shrink:0;font-size:11px;opacity:.6';
  trigger.appendChild(caret);
  function syncLabel(){
    const opt = sel.options[sel.selectedIndex];
    labelSpan.textContent = opt ? opt.textContent : '';
  }
  syncLabel();
  sel.style.display = 'none';
  sel.insertAdjacentElement('afterend', trigger);
  if(sel.disabled){
    trigger.disabled = true;
    trigger.style.opacity = '.55';
    trigger.style.cursor = 'not-allowed';
    return;
  }
  trigger.addEventListener('click', e=>{
    e.stopPropagation();
    if(_activeDropdown && _activeDropdown.trigger === trigger){ closeDropdown(); return; }
    closeDropdown();
    const opts = Array.from(sel.options).map((o,i)=>({
      label: o.textContent, active: i===sel.selectedIndex,
      onSelect: ()=>{
        if(sel.selectedIndex !== i){
          sel.selectedIndex = i;
          sel.dispatchEvent(new Event('change', {bubbles:true}));
        }
        syncLabel();
      }
    }));
    openDropdown(trigger, opts);
  });
  sel.addEventListener('change', syncLabel);
}
function enhanceSelectsIn(node){
  if(!(node instanceof Element)) return;
  if(node.tagName === 'SELECT') enhanceSelect(node);
  if(node.querySelectorAll) node.querySelectorAll('select').forEach(enhanceSelect);
}
new MutationObserver(muts=>{
  muts.forEach(m=>{ m.addedNodes.forEach(n=>enhanceSelectsIn(n)); });
}).observe(document.documentElement, {childList:true, subtree:true});

// 표(row) 안에 있는 트리거는 onclick="event.stopPropagation()"으로 행 클릭 내비게이션을 막기 때문에
// document까지 버블링되지 않는다 → 인라인에서 직접 호출 가능한 전역 함수로 노출
window.toggleCdd = function(trigger){
  if(_activeDropdown && _activeDropdown.trigger === trigger){ closeDropdown(); return; }
  closeDropdown();
  const type = trigger.dataset.cddType;
  if(type === 'vendor-status'){
    const v = state.data.vendors.find(x=>x.id===trigger.dataset.vid);
    if(v) openDropdown(trigger, cddVendorStatusOptions(v.companyStatus, val=>{
      v.companyStatus = val;
      if(val==='Inactive'){ v.priority='낮음'; if(!v.actionStatus||v.actionStatus==='') v.actionStatus='계약 중단'; }
      persist(false); render();
    }));
  } else if(type === 'brand-status'){
    const v = state.data.vendors.find(x=>x.id===state.selectedVendorId);
    const brand = v?.brands?.find(b=>b.id===state.activeBrandId);
    if(brand) openDropdown(trigger, cddVendorStatusOptions(brand.companyStatus, val=>{
      brand.companyStatus = val;
      persist(false); render(); showToast('브랜드 상태가 변경되었습니다.');
    }));
  } else if(type === 'proj-status'){
    const p = state.data.projects.find(x=>x.id===trigger.dataset.pid);
    if(p) openDropdown(trigger, cddProjStatusOptions(p.status, val=>{
      p.status = val;
      if(val==='완료' && !p.completedDate) p.completedDate = dayjs().format('YYYY-MM-DD');
      if(val!=='완료') p.completedDate = '';
      persist(false); render();
    }));
  } else if(type === 'action-status'){
    const v = state.data.vendors.find(x=>x.id===state.selectedVendorId);
    if(v){
      const actionStatuses = [
        {value:'', label:'상태 미지정', icon:'ti-circle-dashed', iconColor:'var(--muted)'},
        {value:'회신 대기중', label:'회신 대기중', icon:'ti-hourglass', iconColor:'#92400E'},
        {value:'회신 해야함', label:'회신 해야함', icon:'ti-send', iconColor:'#A32D2D'},
        {value:'미팅 예정', label:'미팅 예정', icon:'ti-calendar-event', iconColor:'#0B4E9E'},
        {value:'발주 예정', label:'발주 예정', icon:'ti-shopping-cart', iconColor:'#0B4E9E'},
        {value:'계약 진행중', label:'계약 진행중', icon:'ti-file-pencil', iconColor:'#92400E'},
        {value:'팔로업 필요', label:'팔로업 필요', icon:'ti-bell', iconColor:'#A32D2D'},
        {value:'신규 브랜드 검토', label:'신규 브랜드 검토', icon:'ti-search', iconColor:'#6B21A8'},
        {value:'협의 완료', label:'협의 완료', icon:'ti-circle-check', iconColor:'#3B6D11'},
        {value:'계약 중단', label:'계약 중단', icon:'ti-ban', iconColor:'#475569'},
        {value:'보류', label:'보류', icon:'ti-player-pause', iconColor:'var(--muted)'},
      ];
      const cur = v.actionStatus || '';
      openDropdown(trigger, actionStatuses.map(s=>({
        label:s.label, icon:s.icon, iconColor:s.iconColor, active:s.value===cur,
        onSelect:()=>{ v.actionStatus=s.value; persist(false); showToast('액션 상태가 저장되었습니다.'); render(); }
      })));
    }
  } else if(type === 'vendor-status-filter'){
    const cur = state.vendorStatusFilter || '전체';
    const list = [{v:'전체',l:'거래상태 전체',c:'#8A93A3'}, ...CDD_VENDOR_STATUS_LIST];
    openDropdown(trigger, list.map(s=>({
      label:s.l, dot:s.c, active:cur===s.v,
      onSelect:()=>{ state.vendorStatusFilter=s.v; render(); }
    })));
  } else if(type === 'vendor-priority-filter'){
    const cur = state.vendorPriorityFilter || '전체';
    const list = [{v:'전체',l:'우선순위 전체'},{v:'높음',l:'높음'},{v:'보통',l:'보통'},{v:'낮음',l:'낮음'}];
    openDropdown(trigger, list.map(s=>({
      label:s.l, active:cur===s.v,
      onSelect:()=>{ state.vendorPriorityFilter=s.v; render(); }
    })));
  } else if(type === 'vendor-analytics-year'){
    const { yearTotals } = computeVendorAnalyticsData();
    const currentYearNum = Number(dayjs().format('YYYY'));
    let years = Object.keys(yearTotals).map(Number).sort((a,b)=>b-a);
    if(!years.includes(currentYearNum)) years = [currentYearNum, ...years];
    const cur = state.vendorAnalyticsYear || (years.includes(currentYearNum) ? currentYearNum : years[0]);
    openDropdown(trigger, years.map(y=>({
      label: y+'년', active: cur===y,
      onSelect:()=>{ state.vendorAnalyticsYear=y; render(); }
    })));
  }
};

document.addEventListener('click', function(e){
  // ── 커스텀 드롭다운 트리거 (document까지 버블링되는 경우 - stopPropagation 없는 트리거) ──
  const cddTrigger = e.target.closest('.cdd-trigger');

    toggleCdd(cddTrigger);
    return;

});

function vendorActionBadge(status){
  const map = {
    '회신 대기중':    {bg:'#FEF3C7', color:'#92400E'},
    '회신 해야함':    {bg:'#FCEBEB', color:'#A32D2D'},
    '미팅 예정':      {bg:'#E8F2FE', color:'#0B4E9E'},
    '발주 예정':      {bg:'#E8F2FE', color:'#0B4E9E'},
    '계약 진행중':    {bg:'#FEF3C7', color:'#92400E'},
    '팔로업 필요':    {bg:'#FCEBEB', color:'#A32D2D'},
    '신규 브랜드 검토':{bg:'#F3E8FF', color:'#6B21A8'},
    '협의 완료':      {bg:'#EAF3DE', color:'#3B6D11'},
    '계약 중단':      {bg:'#F1F5F9', color:'#475569'},
    '보류':           {bg:'#F1EFE8', color:'#5F5E5A'},
  };
  if(!status) return '';
  const s = map[status] || {bg:'var(--sf)', color:'var(--muted)'};
  return `<span style="font-size:10px;padding:2px 8px;border-radius:20px;background:${s.bg};color:${s.color};font-weight:300;white-space:nowrap">${status}</span>`;
}

function viewVendorList(){
  const companyTypes = ['전체', ...(state.data.companyTypes||['벤더','물류사','파트너','기타'])];
  const activeType = state.vendorTypeFilter || '전체';
  const statusFilter = state.vendorStatusFilter || '전체';
  const priorityFilter = state.vendorPriorityFilter || '전체';
  let vendors = state.data.vendors.map(v=>({...v, latest:latestLogForVendor(v.id)}));

  if(state.vendorSearch){
    const q = state.vendorSearch.toLowerCase();
    vendors = vendors.filter(v=>{
      if(v.name.toLowerCase().includes(q)) return true;
      if((v.contact?.name||'').toLowerCase().includes(q)) return true;
      // 브랜드명으로도 검색
      if(v.brands?.some(b=>(b.name||'').toLowerCase().includes(q))) return true;
      return false;
    });
  }
  if(activeType !== '전체') vendors = vendors.filter(v=>(v.companyType||'벤더') === activeType);
  if(statusFilter !== '전체') vendors = vendors.filter(v=>(v.companyStatus||'Active') === statusFilter);
  if(priorityFilter !== '전체') vendors = vendors.filter(v=>v.priority === priorityFilter);

  const alphaFilter = state.vendorAlphaFilter || '전체';
  if(alphaFilter === '한글'){
    vendors = vendors.filter(v=>/^[가-힣]/.test(v.name));

    vendors = vendors.filter(v=>v.name.trim().toUpperCase().startsWith(alphaFilter));
  }

  // 이름 가나다/ABC 순 정렬
  vendors.sort((a,b)=>a.name.localeCompare(b.name, ['ko','en'], {sensitivity:'base'}));

  const highCount = vendors.filter(v=>v.priority==='높음').length;
  const waitingCount = vendors.filter(v=>{const l=latestLogForVendor(v.id);return l&&(l.status==='전송'||l.status==='수신');}).length;
  const staleCount = vendors.filter(v=>v.latest&&daysAgo(v.latest.date)>=90).length;

  const typeBadge = t=>typeColorFor(t);

  return `
    <div class="sh">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">

      </div>

    </div>

    <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center">
      <div class="pill-bar">${companyTypes.map(t=>`<button class="btn ${activeType===t?'btn-o':''}" data-vendor-type="${t}">${t}${t!=='전체'?` (${state.data.vendors.filter(v=>(v.companyType||'벤더')===t).length})`:` (${state.data.vendors.length})`}</button>`).join('')}</div>
      <div style="margin-left:auto;display:flex;gap:6px">

            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
