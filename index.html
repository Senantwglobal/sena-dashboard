          <span class="badge bo">${p.category}</span>
          <select class="proj-status-select" data-pid="${p.id}" style="font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid;cursor:pointer;outline:none;${projStatusStyle(p.status||'진행중')}">${['진행중','보류','중단','완료'].map(s=>`<option value="${s}" ${(p.status||'진행중')===s?'selected':''}>${s}</option>`).join('')}</select>
          <span style="font-size:12px;color:var(--muted)">담당: ${p.owner}</span>
          ${p.deadline?`<span class="dlc ${dday!==null&&dday<=2?'dl-c':dday<=5?'dl-w':'dl-ok'}">${fmtDate(p.deadline)} (D-${dday})</span>`:''}
          ${linkedVendors.map(v=>`<span style="display:flex;align-items:center;gap:4px;font-size:12px;background:var(--sf);padding:2px 8px;border-radius:20px">${av(v.name,16)} ${v.name}</span>`).join('')}
        </div>
      </div>
      ${!isReadOnly()?`<button class="btn" id="editProjectBtn"><i class="ti ti-pencil"></i> 편집</button>`:''}
    </div>

    <div class="pgb" style="margin-bottom:14px;height:8px;border-radius:4px">
      <div class="pgf" style="width:${prog}%;background:var(--o);border-radius:4px"></div>
    </div>

    ${(() => {
      const today = dayjs().format('YYYY-MM-DD');
      const upcoming = (state.data.calendar||[])
        .filter(e=>e.projectId===p.id && e.date>=today)
        .sort((a,b)=>a.date.localeCompare(b.date))
        .slice(0,4);
      if(upcoming.length===0) return '';
      return `<div class="card" style="margin-bottom:14px;padding:14px;border-left:3px solid var(--o)">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
          <i class="ti ti-calendar-event" style="color:var(--o);font-size:14px"></i>
          <span style="font-size:12px;font-weight:300;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">예정된 미팅</span>
          <span style="font-size:11px;color:var(--muted)">${upcoming.length}건</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${upcoming.map(e=>{
            const dday = dayjs(e.date).diff(dayjs().startOf('day'),'day');
            const ddayLabel = dday===0?'오늘':`D-${dday}`;
            const vids = e.vendorIds && e.vendorIds.length ? e.vendorIds : (e.vendorId ? [e.vendorId] : []);
            const evVendors = vids.map(vid=>state.data.vendors.find(v=>v.id===vid)).filter(Boolean);
            return `<div class="calendar-event-link" data-eid="${e.id}" style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 8px;border-radius:8px" onmouseover="this.style.background='var(--sf)'" onmouseout="this.style.background='transparent'">
              <span class="dlc ${dday<=2?'dl-c':dday<=5?'dl-w':'dl-ok'}" style="flex-shrink:0">${ddayLabel}</span>
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.title}</div>
                <div style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap">
                  <span>${fmtDateDow(e.date)}${e.time?' · '+e.time:''}</span>
                  ${evVendors.map(v=>`<span style="display:flex;align-items:center;gap:3px">${av(v.name,14)}${v.name}</span>`).join('')}
                  ${e.location?`<span>${e.location}</span>`:''}
                </div>
              </div>
              <i class="ti ti-chevron-right" style="font-size:12px;color:var(--muted);flex-shrink:0"></i>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    })()}

    ${(() => {

      const pastAll = (state.data.calendar||[])
        .filter(e=>e.projectId===p.id && e.date<today)
        .sort((a,b)=>b.date.localeCompare(a.date));
      if(pastAll.length===0) return '';
      const PE_PER_PAGE = 3;
      const pePage = state.projPastEventPage || 0;
      const peTotalPages = Math.ceil(pastAll.length / PE_PER_PAGE);
      const past = pastAll.slice(pePage*PE_PER_PAGE, pePage*PE_PER_PAGE+PE_PER_PAGE);
      return `<div class="card" style="margin-bottom:14px;padding:14px;border-left:3px solid var(--muted)">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
          <i class="ti ti-history" style="color:var(--muted);font-size:14px"></i>
          <span style="font-size:12px;font-weight:300;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">지난 일정</span>
          <span style="font-size:11px;color:var(--muted)">${pastAll.length}건</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${past.map(e=>{
            const vids = e.vendorIds && e.vendorIds.length ? e.vendorIds : (e.vendorId ? [e.vendorId] : []);
            const evVendors = vids.map(vid=>state.data.vendors.find(v=>v.id===vid)).filter(Boolean);
            const hasNote = eventMeetingNotes(e).length>0;
            const latestNote = latestMeetingNote(e);
            return `<div class="calendar-event-link" data-eid="${e.id}" style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 8px;border-radius:8px" onmouseover="this.style.background='var(--sf)'" onmouseout="this.style.background='transparent'">
              <span style="font-size:10px;color:var(--muted);flex-shrink:0;white-space:nowrap;width:52px">${fmtDate(e.date)}</span>
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.title}${hasNote?` <i class="ti ti-notes" style="font-size:11px;color:var(--o)" title="회의록 ${eventMeetingNotes(e).length}건"></i>`:''}</div>
                <div style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap">
                  ${e.time?`<span>${e.time}</span>`:''}
                  ${evVendors.map(v=>`<span style="display:flex;align-items:center;gap:3px">${av(v.name,14)}${v.name}</span>`).join('')}

              </div>
              <i class="ti ti-chevron-right" style="font-size:12px;color:var(--muted);flex-shrink:0"></i>
            </div>`;
          }).join('')}
        </div>
        ${peTotalPages>1?`<div style="display:flex;justify-content:center;align-items:center;gap:4px;padding-top:10px">

          ${Array.from({length:peTotalPages}).map((_,i)=>`<button class="btn proj-past-event-page-btn ${i===pePage?'btn-o':''}" data-page="${i}" style="padding:3px 9px;font-size:11px;min-width:26px">${i+1}</button>`).join('')}

        </div>`:''}
      </div>`;
    })()}

    <!-- 체크리스트 -->
    <div class="card" style="margin-bottom:14px">
      <div class="sh">
        <div class="st"><i class="ti ti-checklist oi"></i>체크리스트</div>
        ${!isReadOnly()?`<button class="btn" id="addChecklistItemBtn"><i class="ti ti-plus"></i> 항목 추가</button>`:''}
      </div>
      ${p.checklist.length===0?'<div class="empty-state">체크리스트 항목이 없습니다.</div>':
        (() => {
          const CK_PAGE = 4;
          const showAllCk = !!state.projChecklistShowAll;
          const ckList = showAllCk ? p.checklist : p.checklist.slice(0, CK_PAGE);
          const rowsHtml = ckList.map(c=>{
            const sc=checklistStatusColor(c.status);
            const assignee=checklistAssigneeName(c);
            return `<div class="checklist-card ck-item" data-cid="${c.id}">

        const sourceTag = (lk._imported||lk._fromLog)?`<span style="font-size:9px;color:var(--o);background:var(--ol);padding:1px 5px;border-radius:8px;flex-shrink:0">${lk._sourceLabel}</span>`:'';
        if(lk.data){
          const t=lk.type||'';
          const icon=t.includes('image')?'ti-photo':t.includes('pdf')?'ti-file-type-pdf':(t.includes('sheet')||String(lk.label||'').endsWith('.xlsx'))?'ti-file-spreadsheet':'ti-file';
          const color=t.includes('image')?'#0891B2':t.includes('pdf')?'#DC2626':'#15803D';
          return folderHtml + `<div style="display:flex;align-items:center;gap:8px;padding:7px 0 7px 8px;border-bottom:0.5px solid var(--bd)">
            <i class="ti ${icon}" style="font-size:16px;color:${color};flex-shrink:0"></i>
            <a href="data:${t};base64,${lk.data}" download="${lk.label||'파일'}" style="flex:1;font-size:12px;font-weight:300;color:${color};text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${lk.label||'파일'}</a>

          </div>`;
        }

        const isDrive=url.includes('drive.google')||url.includes('docs.google');

    <!-- 전체 활동 로그 (맨 아래) -->

function checklistAssigneeName(c){
  if(!c.assigneeId) return '';
  if(c.assigneeType==='internal') return c.assigneeId;
  const people=allPeopleFlat();
  const person=people.find(p=>p.id===c.assigneeId);
  return person?`${person.companyName} · ${person.name}`:'';
}

function checklistStatusColor(status){
  if(status==='완료') return {bg:'#EAF3DE',text:'#3B6D11'};
  if(status==='진행중') return {bg:'var(--ol)',text:'var(--od)'};
  if(status==='보류') return {bg:'#FEF3C7',text:'#92400E'};
  return {bg:'var(--sf)',text:'var(--muted)'};
}

function viewCalendar(){
  const month = dayjs(state.calMonth+'-01');
  const startDay = month.startOf('month').day();
  const daysInMonth = month.endOf('month').date();
  const todayStr = dayjs().format('YYYY-MM-DD');
  const allEvs = allCalendarEvents();
  const dowNames = ['일','월','화','수','목','금','토'];
  let cells = [];
  for(let i=0;i<startDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);

  // 이번 달 일정 목록 (오늘 이후)
  const monthStr = month.format('YYYY-MM');
  const monthEvs = allEvs.filter(e=>e.date.startsWith(monthStr)).sort((a,b)=>a.date.localeCompare(b.date));
  const todayEvs = allEvs.filter(e=>e.date===todayStr);

  // 모든 이벤트 타입 (calendarEventTypes에서)
  const allEventTypes = state.data.calendarEventTypes || [
    {name:'미팅',color:'#1C85E8'},{name:'외근',color:'#D85A30'},{name:'마감',color:'#7C3AED'},
    {name:'개인 용무',color:'#F59E0B'},{name:'전화 통화',color:'#38BDF8'}
  ];

  return `
    <div class="sh">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button class="btn" id="prevMonth"><i class="ti ti-chevron-left"></i></button>
        <span style="font-size:16px;font-weight:300">${month.format('YYYY년 M월')}</span>
        <button class="btn" id="nextMonth"><i class="ti ti-chevron-right"></i></button>
        <button class="btn" id="goTodayBtn" style="font-size:11px;padding:4px 10px;background:var(--ol);color:var(--od);border:0.5px solid var(--o)"><i class="ti ti-calendar-event"></i> 오늘</button>
        <span style="font-size:12px;color:var(--muted);padding:4px 8px;background:var(--sf);border-radius:6px">${dayjs().format('M월 D일 (ddd)')}</span>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="viewAllMeetingNotesBtn"><i class="ti ti-notes"></i> 회의록 모아보기</button>
        ${!isReadOnly()?`<button class="btn" id="manageEventTypesBtn"><i class="ti ti-settings"></i> 일정 유형 관리</button>`:''}
        ${!isReadOnly()?`<button class="btn btn-o" id="addEventBtnTop"><i class="ti ti-plus"></i> 일정 등록</button>`:''}
      </div>
    </div>

    <div class="legend-row" style="flex-wrap:wrap">
      ${allEventTypes.filter(t=>!['연차','반차','반반차'].includes(t.name)).map(t=>{
        const c=eventColor(t.name); return `<span><span class="legend-dot" style="background:${c.dot}"></span>${t.name}</span>`;
      }).join('')}
    </div>

    ${(() => {
      const weeks = [];
      for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
      const BAR_H = 18, BAR_GAP = 3, NUM_H = 22;

      const weekBlocks = weeks.map(weekCells=>{
        const weekDates = weekCells.map(d=> d===null ? null : month.date(d).format('YYYY-MM-DD'));
        const validDates = weekDates.filter(Boolean);
        const wMin = validDates[0], wMax = validDates[validDates.length-1];

        // 기간(다일) 일정 - endDate가 있고 date와 다른 경우
        const multiEvs = wMin ? allEvs.filter(e=>{
          if(!e.endDate || e.endDate===e.date) return false;
          return e.date <= wMax && e.endDate >= wMin;
        }).sort((a,b)=>a.date.localeCompare(b.date)) : [];

        // 레인 배정 (그리디)
        const laneEnds = []; // 각 레인의 마지막 colEnd
        const bars = multiEvs.map(e=>{
          const clampedStart = e.date < wMin ? wMin : e.date;
          const clampedEnd = e.endDate > wMax ? wMax : e.endDate;
          const colStart = weekDates.indexOf(clampedStart);
          const colEnd = weekDates.indexOf(clampedEnd);
          if(colStart===-1 || colEnd===-1) return null;
          let lane = laneEnds.findIndex(end => end < colStart);
          if(lane===-1){ lane = laneEnds.length; laneEnds.push(colEnd); }
          else laneEnds[lane] = colEnd;
          return {e, colStart, colEnd, lane, isStartCap: e.date>=wMin, isEndCap: e.endDate<=wMax};
        }).filter(Boolean);

        const laneCount = laneEnds.length;
        const barsAreaH = laneCount>0 ? laneCount*(BAR_H+BAR_GAP) : 0;
        const BARS_MAX_H = 45; // 막대 영역 최대 확보 높이 (이보다 레인이 많아지면 넘치는 부분은 자동으로 겹쳐 표시되지 않고 생략됨)
        const cappedBarsAreaH = Math.min(barsAreaH, BARS_MAX_H);

        const numbersRow = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
          ${weekCells.map((d,ci)=>{
            if(d===null) return `<div class="cal-cell empty" style="aspect-ratio:16/9"></div>`;
            const dateStr = weekDates[ci];
            const isToday = dateStr===todayStr;
            const dayEvsAll = allEvs.filter(e=>e.date===dateStr && (!e.endDate || e.endDate===e.date));
            const holidayEvs = dayEvsAll.filter(e=>e.isHoliday);
            const leaveEvs = dayEvsAll.filter(e=>e.isLeave);
            const dayEvs = dayEvsAll.filter(e=>!e.isHoliday && !e.isLeave);
            const EV_MAX = 2;
            const labelParts = [...holidayEvs.map(h=>h.title), ...leaveEvs.map(l=>l.title)];
            return `<div class="cal-cell${isToday?' today':''}" data-date="${dateStr}" style="aspect-ratio:16/9">
              <div style="display:flex;align-items:baseline;gap:4px;min-width:0">
                <span class="cal-num${isToday?' today':''}" style="${holidayEvs.length>0&&!isToday?'color:#DC2626':''};flex-shrink:0">${d}</span>
                ${labelParts.length>0?`<span style="font-size:8.5px;color:${holidayEvs.length>0?'#DC2626':'var(--muted)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">${labelParts.join(', ')}</span>`:''}
              </div>
              <div style="height:${cappedBarsAreaH}px"></div>
              ${dayEvs.slice(0,EV_MAX).map(e=>{const c=eventColor(e.type);return `<span class="cal-ev" draggable="true" data-eid="${e.id}" data-pid="${e.projectId||''}" data-vid="${(e.vendorIds&&e.vendorIds[0])||''}" style="background:${c.bg};color:${c.text}"><span class="cal-ev-title">${e.title}</span>${e.time&&e.time!=='종일'?`<span class="cal-ev-time">${e.time}</span>`:''}</span>`;}).join('')}
              ${dayEvs.length>EV_MAX?`<span class="cal-more-btn" data-date="${dateStr}" style="font-size:9px;color:var(--o);cursor:pointer">+${dayEvs.length-EV_MAX}건 더보기</span>`:''}
            </div>`;
          }).join('')}
        </div>`;

        const barsOverlay = laneCount>0 ? `<div style="position:absolute;top:${NUM_H}px;left:0;right:0;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;pointer-events:none">
          ${bars.filter(b=>b.lane*(BAR_H+BAR_GAP) < BARS_MAX_H).map(b=>{
            const c = eventColor(b.e.type);
            return `<div class="cal-ev cal-ev-bar" data-eid="${b.e.id}" data-pid="${b.e.projectId||''}" style="grid-column:${b.colStart+1} / span ${b.colEnd-b.colStart+1};grid-row:1;margin-top:${b.lane*(BAR_H+BAR_GAP)}px;height:${BAR_H}px;background:${c.bg};color:${c.text};display:flex;align-items:center;padding:0 6px;border-radius:${b.isStartCap?'4px':'0'} ${b.isEndCap?'4px':'0'} ${b.isEndCap?'4px':'0'} ${b.isStartCap?'4px':'0'};font-size:10px;overflow:hidden;white-space:nowrap;pointer-events:auto;cursor:pointer;font-weight:600">${b.isStartCap?b.e.title:''}</div>`;
          }).join('')}
        </div>` : '';

        return `<div style="position:relative">${numbersRow}${barsOverlay}</div>`;
      }).join('');

      return `
      <div class="cal-grid" style="margin-bottom:10px">
        ${dowNames.map(d=>`<div class="cal-dh">${d}</div>`).join('')}
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:20px">
        ${weekBlocks}
      </div>`;
    })()}

    ${todayEvs.length>0 ? `
    <div class="card" style="margin-bottom:14px;border-left:3px solid var(--o)">
      <div class="sh"><div class="st"><i class="ti ti-sun oi"></i>오늘 일정 (${todayStr})</div></div>
      ${todayEvs.map(e=>{
        const c=eventColor(e.type);
        const isEditable = state.data.calendar.some(x=>x.id===e.id);
        return `<div class="dash-row" style="gap:8px">
        <span style="width:8px;height:8px;border-radius:50%;background:${c.dot};flex-shrink:0"></span>
        <span style="font-size:13px;font-weight:300">${e.title}</span>
        ${e.time?`<span style="font-size:12px;color:var(--muted);margin-left:auto">${e.time}</span>`:''}
        <span style="font-size:10px;padding:1px 7px;border-radius:20px;background:${c.bg};color:${c.text}">${e.type}</span>
        ${isEditable?`<button class="btn calendar-event-link" data-eid="${e.id}" style="font-size:10px;padding:3px 9px;flex-shrink:0"><i class="ti ti-eye" style="font-size:11px"></i> 상세보기</button>`:''}
      </div>`;}).join('')}
    </div>` : `
    <div class="card" style="margin-bottom:14px;background:var(--sf)">
      <div style="padding:10px;font-size:13px;color:var(--muted);text-align:center"><i class="ti ti-calendar-off" style="font-size:16px"></i> 오늘은 등록된 일정이 없습니다</div>
    </div>`}

    ${monthEvs.length>0 ? `
    <div class="card">
      <div class="sh"><div class="st"><i class="ti ti-list oi"></i>${month.format('M월')} 전체 일정</div>
      <span style="font-size:12px;color:var(--muted)">${monthEvs.length}건</span></div>
      ${(() => {
        const specialEvs = monthEvs.filter(e=>e.isHoliday||e.isLeave);
        const realEvs = monthEvs.filter(e=>!e.isHoliday && !e.isLeave);
        const specialHtml = specialEvs.length>0 ? `
          <div style="margin-bottom:10px;padding-bottom:10px;border-bottom:0.5px solid var(--bd)">
            <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px">공휴일 · 연차/반차</div>
            <div style="display:flex;flex-direction:column;gap:4px">
              ${specialEvs.map(e=>{
                const isToday = e.date===todayStr;
                return `<div style="display:flex;align-items:center;gap:8px">
                  <span style="font-size:11px;color:${isToday?'var(--o)':'var(--muted)'};width:56px;flex-shrink:0">${fmtDate(e.date)}</span>
                  <span style="font-size:12px;color:${e.isHoliday?'#DC2626':'var(--muted)'};font-weight:600">${e.title}</span>
                </div>`;
              }).join('')}
            </div>
          </div>` : '';
        const realHtml = realEvs.map(e=>{
          const c=eventColor(e.type);
          const isToday=e.date===todayStr;
          const isEditable = state.data.calendar.some(x=>x.id===e.id);
          return `<div class="dash-row" style="gap:8px">
          <span style="font-size:11px;color:${isToday?'var(--o)':'var(--muted)'};font-weight:${isToday?'700':'300'};width:56px;flex-shrink:0">${fmtDate(e.date)}</span>
          <span style="width:8px;height:8px;border-radius:50%;background:${c.dot};flex-shrink:0"></span>
          <span style="font-size:13px;flex:1">${e.title}${e.time?' · '+e.time:''}</span>
          <span style="font-size:10px;padding:1px 7px;border-radius:20px;background:${c.bg};color:${c.text}">${e.type}</span>
          ${isEditable?`<button class="btn calendar-event-link" data-eid="${e.id}" style="font-size:10px;padding:3px 9px;flex-shrink:0"><i class="ti ti-eye" style="font-size:11px"></i> 상세보기</button>`:''}
        </div>`;
        }).join('');
        return specialHtml + realHtml;
      })()}
    </div>` : ''}
  `;
}

function bindLogModal(preVendorId, preProjectId){
  bindModalCommon();
  let pendingFileReads = 0;

  const vendorList = document.getElementById('lmVendorCheckList');
  const projSel = document.getElementById('lmProjSel');

  function updateProjectsForCheckedVendors(){
    if(!projSel) return;
    const checkedVids = Array.from(document.querySelectorAll('#lmVendorCheckList .ev-vendor-cb:checked')).map(cb=>cb.value);
    const rel = state.data.projects.filter(p=>{
      const ids = p.vendorIds||(p.vendorId?[p.vendorId]:[]);
      return ids.some(id=>checkedVids.includes(id));
    });
    const curVal = projSel.value;
    projSel.innerHTML = `<option value="">없음</option>`
      + rel.map(p=>`<option value="${p.id}" ${p.id===(curVal||preProjectId)?'selected':''}>${p.title}</option>`).join('');
  }

  bindVendorPersonChecklists('lmVendorCheckList', 'lmPersonCheckList', 'lmVendorSearch');
  if(vendorList) vendorList.addEventListener('change', e=>{
    if(e.target.classList.contains('ev-vendor-cb')) updateProjectsForCheckedVendors();
  });

  // API 키 설정 버튼
  const apiKeyBtn = document.getElementById('lmApiKeyBtn');
  if(apiKeyBtn) apiKeyBtn.addEventListener('click', ()=>{
    openModal(modalApiKeySettings());
    bindModalCommon();
    bindApiKeySettings();
  });

  // AI 요약
  const aiBtn = document.getElementById('lmAiBtn');
  if(aiBtn) aiBtn.addEventListener('click', async ()=>{
    const rawEl = document.getElementById('lmRawText');
    const raw = rawEl?.value?.trim();
    if(!raw){
      showToast('원본 내용을 먼저 입력해주세요.');
      if(rawEl){
        rawEl.style.border = '1.5px solid #DC2626';
        rawEl.style.boxShadow = '0 0 0 3px rgba(220,38,38,.15)';
        rawEl.focus();
        setTimeout(()=>{ rawEl.style.border=''; rawEl.style.boxShadow=''; }, 1600);
      }
      return;
    }
    const summEl = document.getElementById('lmSummary');
    const originalLabel = aiBtn.innerHTML;
    aiBtn.disabled = true;
    aiBtn.innerHTML = '<i class="ti ti-loader-2"></i> 생성 중...';
    try{
      if(state.anthropicApiKey){
        const aiResult = await callClaudeSummary(raw);
        if(aiResult){
          if(summEl) summEl.value = aiResult;
          showToast('Claude AI 요약이 생성되었습니다.');
          return;
        }
      }
      const summary = generateOneLineSummary(raw);
      if(summEl) summEl.value = summary;
      showToast(state.anthropicApiKey ? 'AI 응답이 비어있어 규칙 기반 요약을 사용했습니다.' : '요약이 생성되었습니다. (Claude 연동은 열쇠 아이콘에서 설정)');
    }catch(err){
      console.error(err);
      const summary = generateOneLineSummary(raw);
      if(summEl) summEl.value = summary;
      showToast('Claude API 호출 실패 — 규칙 기반 요약으로 대체했습니다. (' + err.message.slice(0,60) + ')');
    }finally{
      aiBtn.disabled = false;
      aiBtn.innerHTML = originalLabel;
    }
  });

  // 파일/링크 탭 전환
  const lmTabLink = document.getElementById('lmTabLink');
  const lmTabFile = document.getElementById('lmTabFile');
  const lmLinkArea = document.getElementById('lmLinkArea');
  const lmFileArea = document.getElementById('lmFileArea');
  if(lmTabLink) lmTabLink.addEventListener('click', ()=>{
    lmLinkArea.style.display='flex'; lmFileArea.style.display='none';
    lmTabLink.className='btn btn-o'; lmTabFile.className='btn';
  });
  if(lmTabFile) lmTabFile.addEventListener('click', ()=>{
    lmLinkArea.style.display='none'; lmFileArea.style.display='block';
    lmTabFile.className='btn btn-o'; lmTabLink.className='btn';
  });

  // 파일 업로드 처리
  function addFileToLinkList(file){
    if(file.size > 2*1024*1024){
      showToast(`${file.name}: 2MB 초과 파일은 업로드할 수 없습니다.`); return;
    }
    pendingFileReads++;
    updateSubmitBtnState();
    const reader = new FileReader();
    reader.onload = ev => {
      const base64 = ev.target.result.split(',')[1];
      const list = document.getElementById('lmLinkList');
      const row = document.createElement('div');
      row.className = 'link-row';
      row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;border-radius:8px;border:0.5px solid var(--bd)';
      const ext = file.name.split('.').pop().toLowerCase();
      const icon = ['jpg','jpeg','png','gif','webp'].includes(ext) ? '🖼️'
                 : ext === 'pdf' ? '📄'
                 : ['xlsx','xls','csv'].includes(ext) ? '📊'
                 : ['docx','doc'].includes(ext) ? '📝' : '📎';
      row.innerHTML = `<span style="font-size:16px">${icon}</span>
        <input type="hidden" class="link-label" value="${file.name}"/>
        <input type="hidden" class="link-url" value=""/>
        <input type="hidden" class="link-data" value="${base64}"/>
        <input type="hidden" class="link-type" value="${file.type||'application/octet-stream'}"/>
        <span style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${file.name}</span>
        <span style="font-size:10px;color:var(--muted);flex-shrink:0">${(file.size/1024).toFixed(0)}KB</span>
        <button type="button" class="btn btn-red" style="padding:2px 6px;font-size:10px;flex-shrink:0" onclick="this.closest('.link-row').remove()"><i class="ti ti-x"></i></button>`;
      list.appendChild(row);
      pendingFileReads--;
      updateSubmitBtnState();
    };
    reader.onerror = () => {
      showToast(`${file.name} 파일을 읽는 중 오류가 발생했습니다.`);
      pendingFileReads--;
      updateSubmitBtnState();
    };
    reader.readAsDataURL(file);
  }

  function updateSubmitBtnState(){
    const submitBtn = document.querySelector('button[type=submit][form=logModalForm]');
    if(!submitBtn) return;
    if(pendingFileReads > 0){
      submitBtn.disabled = true;
      submitBtn.dataset.origLabel = submitBtn.dataset.origLabel || submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="ti ti-loader-2"></i> 파일 처리 중...';
    } else {
      submitBtn.disabled = false;
      if(submitBtn.dataset.origLabel) submitBtn.innerHTML = submitBtn.dataset.origLabel;
    }
  }

  const lmFileInput = document.getElementById('lmFileInput');
  const lmDropZone = document.getElementById('lmFileDropZone');
  if(lmDropZone){
    lmDropZone.addEventListener('click', ()=>lmFileInput?.click());
    lmDropZone.addEventListener('dragover', e=>{ e.preventDefault(); lmDropZone.style.borderColor='var(--o)'; lmDropZone.style.background='var(--ol)'; });
    lmDropZone.addEventListener('dragleave', ()=>{ lmDropZone.style.borderColor='var(--bd)'; lmDropZone.style.background='#fff'; });
    lmDropZone.addEventListener('drop', e=>{
      e.preventDefault();
      lmDropZone.style.borderColor='var(--bd)'; lmDropZone.style.background='#fff';
      Array.from(e.dataTransfer.files).forEach(addFileToLinkList);
    });
  }
  if(lmFileInput) lmFileInput.addEventListener('change', e=>{
    Array.from(e.target.files).forEach(addFileToLinkList);
    e.target.value='';
  });

  // 파일 링크 추가
  const addLinkBtn = document.getElementById('lmAddLinkBtn');
  if(addLinkBtn) addLinkBtn.addEventListener('click', ()=>{
    const label = document.getElementById('lmLinkLabel').value.trim();
    const url = document.getElementById('lmLinkUrl').value.trim();
    if(!url){ showToast('URL을 입력해주세요.'); return; }
    const list = document.getElementById('lmLinkList');
    const id = uid('lk');
    const row = document.createElement('div');
    row.className = 'link-row';
    row.dataset.id = id;
    row.style.cssText = 'display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--sf);border-radius:6px';
    row.innerHTML = `<i class="ti ti-paperclip" style="font-size:12px;color:var(--muted)"></i>
      <input type="hidden" class="link-label" value="${label||url}"/>
      <input type="hidden" class="link-url" value="${url}"/>
      <span style="font-size:12px;flex:1">${label||url}</span>
      <button type="button" class="btn btn-red" style="padding:2px 6px;font-size:10px" onclick="this.closest('.link-row').remove()"><i class="ti ti-x"></i></button>`;
    list.appendChild(row);
    document.getElementById('lmLinkLabel').value = '';
    document.getElementById('lmLinkUrl').value = '';
  });
  // 링크 입력창에서 Enter키 누르면 폼이 조기 제출되지 않고 링크만 추가되도록 처리
  ['lmLinkLabel','lmLinkUrl'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); addLinkBtn?.click(); }
    });
  });

  // 폼 제출
  const form = document.getElementById('logModalForm');
  if(form) form.addEventListener('submit', e=>{
    e.preventDefault();
    if(pendingFileReads > 0){
      showToast('파일을 처리하는 중입니다. 잠시 후 다시 시도해주세요.');
      return;
    }
    const fd = new FormData(form);
    const checkedVendorIds = Array.from(document.querySelectorAll('#lmVendorCheckList .ev-vendor-cb:checked')).map(cb=>cb.value);
    if(checkedVendorIds.length===0){ showToast('거래처를 최소 1곳 선택해주세요.'); return; }
    const checkedPersonIds = Array.from(document.querySelectorAll('#lmPersonCheckList .ev-person-cb:checked')).map(cb=>cb.value);
    const linkedProjectId = fd.get('linkedProjectId')||'';
    const nextStep = fd.get('nextStep')||'';
    const needsApproval = fd.get('needsApproval')==='on';

    // 링크+파일 수집 (모든 선택 거래처 로그에 공통 반영)
    const links = [];
    document.querySelectorAll('#lmLinkList .link-row').forEach(row=>{
      const label = row.querySelector('.link-label')?.value?.trim();
      const url   = row.querySelector('.link-url')?.value?.trim();
      const data  = row.querySelector('.link-data')?.value?.trim();
      const type  = row.querySelector('.link-type')?.value?.trim();
      if(data){
        links.push({label: label||'파일', url:'', data, type});
      } else if(url){
        links.push({label: label||url, url});
      }
    });

    const createdLogs = [];
    checkedVendorIds.forEach(vendorId=>{
      const vendor = state.data.vendors.find(v=>v.id===vendorId);
      // 이 거래처에 소속된 담당자만 필터링
      const contactPersonIds = checkedPersonIds.filter(pid => (vendor?.people||[]).some(p=>p.id===pid));

      const newLog = {
        id: uid('vl'), vendorId, date: fd.get('date'),
        type: fd.get('type'), status: fd.get('status'), priority: fd.get('priority'),
        summary: fd.get('summary'), nextStep,
        nextStepDue: fd.get('nextStepDue')||'',
        rawText: fd.get('rawText')||'',
        needsApproval, nextStepDone: false,
        links, linkedProjectId,
        contactPersonIds,
        createdAt: Date.now()
      };
      createdLogs.push(newLog);
      state.data.vendorLogs.push(newLog);

      // 다음액션 → 벤더 체크리스트 자동 생성
      if(nextStep && vendor){
        if(!vendor.checklist) vendor.checklist = [];
        vendor.checklist.push({id:uid('ck'), text:nextStep, done:false, fromLog:newLog.id});
      }

      // 대표님 승인
      if(needsApproval){
        if(!state.data.approvalItems) state.data.approvalItems = [];
        state.data.approvalItems.push({id:uid('ap'), vendorId, content: fd.get('summary'), date: fd.get('date'), approved:false, logId: newLog.id});
      }

      // 연결 프로젝트에 자동 반영
      if(linkedProjectId){
        const proj = state.data.projects.find(p=>p.id===linkedProjectId);
        if(proj){
          if(!proj.vendorLogs) proj.vendorLogs = {};
          if(!proj.vendorLogs[vendorId]) proj.vendorLogs[vendorId] = [];
          proj.vendorLogs[vendorId].unshift(newLog);
        }
      }
    });

    state.data.vendorLogs = sortLogsDesc(state.data.vendorLogs);

    closeModal();
    persist(false);
    render();
    showToast(checkedVendorIds.length>1 ? `거래처 ${checkedVendorIds.length}곳에 로그가 저장되었습니다.` : '로그가 저장되었습니다.');
  });
}


/* ---------- 연차 계산 로직 ---------- */
function calcLeave(asOfDateStr){
  const l = state.data.leave;
  let totalGranted = 0;
  let grantDetails = [];
  let yearsWorked = 0;
  let monthsWorked = 0;
  const asOf = asOfDateStr ? new Date(asOfDateStr + 'T00:00:00') : new Date();

  if(l.joinDate){
    const join = new Date(l.joinDate + 'T00:00:00');
    const now = asOf;

    // 정확한 연/월 계산
    yearsWorked = now.getFullYear() - join.getFullYear();
    const monthDiff = now.getMonth() - join.getMonth();
    const dayDiff = now.getDate() - join.getDate();

    // 아직 기념일이 지나지 않았으면 1년 빼기
    if(monthDiff < 0 || (monthDiff === 0 && dayDiff < 0)) yearsWorked--;

    // 총 완성된 개월수
    monthsWorked = (now.getFullYear() - join.getFullYear()) * 12 + (now.getMonth() - join.getMonth());
    if(dayDiff < 0) monthsWorked--;
    monthsWorked = Math.max(0, monthsWorked);
    yearsWorked = Math.max(0, yearsWorked);

    if(yearsWorked < 1){
      // 1년 미만: 완성된 개월수만큼 발생 (최대 11개)
      const months = Math.min(monthsWorked, 11);
      totalGranted = months;
      grantDetails.push({label:`입사 ${monthsWorked}개월차 · 발생 ${months}개`, amount:months});
    } else {
      // 1년 이상: 15개 기본, 3년차부터 2년마다 +1 (최대 25개)
      const base = 15;
      const extra = yearsWorked >= 3 ? Math.min(Math.floor((yearsWorked - 1) / 2), 10) : 0;
      const annual = Math.min(base + extra, 25);
      totalGranted = annual;
      grantDetails.push({label:`${yearsWorked}년차 연차 ${annual}개 발생`, amount:annual});
    }
  }

  const asOfStr = dayjs(asOf).format('YYYY-MM-DD');
  const compTotal = (l.compLogs||[]).filter(c=>c.date<=asOfStr).reduce((sum,c)=>sum+c.amount, 0);
  const used = (l.logs||[]).filter(r=>r.date<=asOfStr).reduce((sum,r)=>sum+r.amount, 0);
  const remaining = Math.round((totalGranted + compTotal - used) * 100) / 100;

  return { totalGranted, compTotal, used, remaining, grantDetails, yearsWorked, monthsWorked };
}

function viewCompanyList(){
  const alphaFilter = state.companyAlphaFilter || 'ALL';
  let companies = state.data.companies.slice();
  if(state.companySearch){
    const q=state.companySearch.toLowerCase();
    companies=companies.filter(c=>c.name.toLowerCase().includes(q)||c.people.some(p=>p.name.toLowerCase().includes(q)));
  }
  if(alphaFilter !== 'ALL'){
    const getFirstChoseong = name => {
      const code = (name||'').charCodeAt(0);
      if(code >= 0xAC00 && code <= 0xD7A3){
        const fullInitials = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
        const map2 = {'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
        const cho = fullInitials[Math.floor((code-0xAC00)/28/21)];
        return map2[cho]||cho;
      }
      return (name||'')[0]?.toUpperCase()||'';
    };
    companies = companies.filter(c=>getFirstChoseong(c.name)===alphaFilter||c.name[0]?.toUpperCase()===alphaFilter);
  }
  companies.sort((a,b)=>a.name.localeCompare(b.name));

  // 한글 초성 추출 함수
  const getChoseong = ch => {
    const code = ch.charCodeAt(0);
    if(code >= 0xAC00 && code <= 0xD7A3){
      const initials = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
      const idx = Math.floor((code - 0xAC00) / 28 / 21);
      const fullInitials = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
      const cho = fullInitials[idx];
      // ㄲ→ㄱ, ㄸ→ㄷ, ㅃ→ㅂ, ㅆ→ㅅ, ㅉ→ㅈ 통합
      const map = {'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
      return map[cho] || cho;
    }
    if(code >= 65 && code <= 90) return ch.toUpperCase(); // A-Z
    if(code >= 97 && code <= 122) return ch.toUpperCase(); // a-z
    return ch.toUpperCase();
  };

  // 한글 ㄱㄴㄷ 순서
  const HANGUL_ORDER = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const isHangul = ch => /[ㄱ-ㅎ가-힣]/.test(ch);
  const isAlpha = ch => /[A-Za-z]/.test(ch);

  // 실제 존재하는 초성 목록 추출 + 정렬
  const allInitials = [...new Set(state.data.companies.map(c=>getChoseong(c.name[0]||'')).filter(Boolean))];
  const sortedInitials = allInitials.sort((a,b) => {
    const aH = isHangul(a), bH = isHangul(b);
    if(aH && bH) return HANGUL_ORDER.indexOf(a) - HANGUL_ORDER.indexOf(b);
    if(aH) return -1; // 한글 먼저
    if(bH) return 1;
    return a.localeCompare(b); // 영문은 알파벳순
  });

  const alphaButtons = ['ALL', ...sortedInitials].map(ch=>
    `<button class="btn ${alphaFilter===ch?'btn-o':''}" data-alpha="${ch}" style="padding:4px 8px;font-size:11px;min-width:32px">${ch}</button>`
  ).join('');

function openModal(html){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  const stackIndex = document.querySelectorAll('.overlay').length;
  if(stackIndex===0) overlay.id = 'modalOverlay'; // 하위 호환용 (기존 코드가 이 id를 참조할 수 있음)
  overlay.style.zIndex = String(200 + stackIndex*10);
  overlay.innerHTML = html;
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
}
function closeModal(){
  const overlays = document.querySelectorAll('.overlay');
  const last = overlays[overlays.length-1];
  if(last) last.remove();
}

function renderGlobalSearchResults(query){
  const q = query.trim().toLowerCase();
  if(!q) return `<div style="font-size:12px;color:var(--muted);text-align:center;padding:24px 0">검색어를 입력하세요.</div>`;

  const vendors = state.data.vendors.filter(v=>(v.name||'').toLowerCase().includes(q)).slice(0,8);
  const projects = state.data.projects.filter(p=>(p.title||'').toLowerCase().includes(q)).slice(0,8);
  const logs = state.data.vendorLogs.filter(l=>(l.summary||'').toLowerCase().includes(q) || (l.rawText||'').toLowerCase().includes(q) || (l.nextStep||'').toLowerCase().includes(q)).slice(0,10);

  if(vendors.length===0 && projects.length===0 && logs.length===0){
    return `<div style="font-size:12px;color:var(--muted);text-align:center;padding:24px 0">'${query}'에 대한 검색 결과가 없습니다.</div>`;
  }

  let html = '';
  if(vendors.length>0){
    html += `<div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:6px 0 6px">거래처</div>`;
    html += vendors.map(v=>`<div class="search-result-item" data-type="vendor" data-id="${v.id}" style="display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;cursor:pointer">
      ${av(v.name,26)}
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v.name}</div>
        <div style="font-size:10.5px;color:var(--muted)">${v.type||''}</div>
      </div>
      <i class="ti ti-chevron-right" style="font-size:13px;color:var(--muted)"></i>
    </div>`).join('');
  }
  if(projects.length>0){
    html += `<div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">프로젝트</div>`;
    html += projects.map(p=>`<div class="search-result-item" data-type="project" data-id="${p.id}" style="display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;cursor:pointer">
      <div style="width:26px;height:26px;border-radius:8px;background:var(--ol);color:var(--od);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-folder" style="font-size:13px"></i></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.title}</div>
        <div style="font-size:10.5px;color:var(--muted)">${p.category||''} · ${p.status||'진행중'}</div>
      </div>
      <i class="ti ti-chevron-right" style="font-size:13px;color:var(--muted)"></i>
    </div>`).join('');
  }
  if(logs.length>0){
    html += `<div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">로그</div>`;
    html += logs.map(l=>{
      const v = state.data.vendors.find(x=>x.id===l.vendorId);
      return `<div class="search-result-item" data-type="log" data-vid="${l.vendorId}" style="padding:8px;border-radius:8px;cursor:pointer">
        <div style="font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px">${l.summary||''}</div>
        <div style="font-size:10.5px;color:var(--muted)">${v?v.name:''} · ${fmtDate(l.date)}</div>
      </div>`;
    }).join('');
  }
  return html;
}

function bindVendorMeetingNoteForm(vid, editCtx){
  const saveBtn = document.getElementById('vmSaveBtn');
  if(!saveBtn) return;
  saveBtn.addEventListener('click', ()=>{
    const isEdit = !!editCtx;
    const projectId = isEdit ? editCtx.projectId : document.getElementById('vmProjectSel').value;
    const personId = document.getElementById('vmPersonSel').value;
    const title = document.getElementById('vmTitle').value.trim();
    const date = document.getElementById('vmDate').value;
    const text = document.getElementById('vmText').value.trim();
    if(!projectId){ showToast('연관 프로젝트를 선택해주세요.'); return; }
    if(!title){ showToast('제목을 입력해주세요.'); return; }
    if(!text){ showToast('회의 내용을 입력해주세요.'); return; }
    const p = state.data.projects.find(x=>x.id===projectId);
    if(!p) return;
    const v = state.data.vendors.find(x=>x.id===vid);
    const person = personId ? (v && v.people || []).find(pp=>pp.id===personId) : null;
    if(!p.vendorMeetings) p.vendorMeetings = {};
    if(!p.vendorMeetings[vid]) p.vendorMeetings[vid] = [];
    if(isEdit){
      const n = p.vendorMeetings[vid].find(x=>x.id===editCtx.note.id);
      if(n){
        n.title = title; n.date = date; n.text = text;
        n.personId = personId || ''; n.personName = person ? person.name : '';
      }
    } else {
      p.vendorMeetings[vid].unshift({
        id: uid('vm'), title, date, text, summary:'',
        personId: personId || '', personName: person ? person.name : ''
      });
    }
    closeModal(); persist(false); render();
    showToast(isEdit?'회의록이 수정되었습니다.':'회의록이 저장되었습니다.');
  });
}

function modalEditLog(log){
  const vendorOptions = state.data.vendors.slice().sort((a,b)=>a.name.localeCompare(b.name,'ko')).map(v=>
    `<option value="${v.id}" ${v.id===log.vendorId?'selected':''}>${v.name}</option>`
  ).join('');

  // 브랜드 옵션 (해당 거래처의 브랜드)
  const logVendor = state.data.vendors.find(v=>v.id===log.vendorId);
  const vendorBrands = logVendor?.brands || [];
  const brandOptions = vendorBrands.map(b=>
    `<option value="${b.id}" ${log.brandId===b.id?'selected':''}>${b.name}</option>`
  ).join('');

  // 이 로그의 벤더가 연결된 프로젝트만 필터
  const relatedProjects = state.data.projects.filter(p=>{
    const ids = p.vendorIds || (p.vendorId ? [p.vendorId] : []);
    return ids.includes(log.vendorId);
  });
  const projectOptions = relatedProjects.map(p=>
    `<option value="${p.id}" ${log.linkedProjectId===p.id?'selected':''}>${p.title}</option>`
  ).join('');

  return `

            <div class="field"><label class="field-label">거래처</label>
              <select class="inp" name="vendorId" required>
                <option value="">선택하세요</option>${vendorOptions}

          ${vendorBrands.length > 0 ? `
          <div class="field">
            <label class="field-label" style="display:flex;align-items:center;gap:6px">
              <i class="ti ti-brand-tabs" style="font-size:14px;color:var(--o)"></i>
              브랜드

            <select class="inp" name="brandId">
              <option value="">브랜드 없음 (미배정)</option>${brandOptions}

          ${relatedProjects.length > 0 ? `

              <i class="ti ti-clipboard-list" style="font-size:14px;color:var(--o)"></i>
              연결 프로젝트 <span style="font-size:11px;color:var(--muted);font-weight:300">(이 거래처가 연결된 프로젝트만 표시)</span>
            </label>
            <select class="inp" name="linkedProjectId">
              <option value="">프로젝트 없음</option>${projectOptions}
            </select>
          </div>` : `
          <div style="font-size:12px;color:var(--muted);background:var(--sf);padding:8px 12px;border-radius:8px;margin-bottom:10px">
            <i class="ti ti-info-circle" style="font-size:12px"></i> 이 거래처가 연결된 프로젝트가 없습니다. 프로젝트 편집에서 벤더를 추가해주세요.

            <div class="field"><label class="field-label">업데이트 유형</label>
              <select class="inp" name="type">
                ${['이메일','전화/콜','온라인 미팅','외부 미팅','발주','견적/계약','이슈/리스크','내부 회의','보고서 작성','자료 취합','담당자 배정','신규 브랜드','기타'].map(t=>`<option ${log.type===t?'selected':''}>${t}</option>`).join('')}

              <button type="button" id="elAddLinkBtn" class="btn" style="padding:7px 10px"><i class="ti ti-plus"></i></button>
            </div>
            <!-- 파일 업로드 -->

function bindEventTypesManager(){
  document.getElementById('addEventTypeBtn').addEventListener('click', ()=>{
    const name = document.getElementById('newEventTypeName').value.trim();
    const color = document.getElementById('newEventTypeColor').value;
    if(!name) return;
    const list = document.getElementById('eventTypeList');
    const idx = list.querySelectorAll('.event-type-row').length;
    const row = document.createElement('div');
    row.className = 'event-type-row';
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sf);border-radius:8px';
    row.innerHTML = `
      <input type="color" value="${color}" class="event-type-color" data-idx="${idx}" style="width:32px;height:28px;border:none;border-radius:6px;cursor:pointer;padding:2px"/>
      <input type="text" value="${name}" class="inp event-type-name" data-idx="${idx}" style="flex:1;margin:0"/>
      <button class="btn btn-red event-type-delete" data-idx="${idx}" style="padding:5px 8px;font-size:12px"><i class="ti ti-x"></i></button>
    `;
    list.appendChild(row);
    row.querySelector('.event-type-delete').addEventListener('click', ()=>row.remove());
    document.getElementById('newEventTypeName').value = '';
  });
  document.querySelectorAll('.event-type-delete').forEach(btn=>{
    btn.addEventListener('click', ()=>btn.closest('.event-type-row').remove());
  });
  document.getElementById('saveEventTypesBtn').addEventListener('click', ()=>{
    const rows = document.querySelectorAll('.event-type-row');
    state.data.calendarEventTypes = Array.from(rows).map(r=>({
      name: r.querySelector('.event-type-name').value.trim(),
      color: r.querySelector('.event-type-color').value
    })).filter(t=>t.name);
    closeModal(); persist(false); showToast('일정 유형이 저장되었습니다.');
  });
}

function generateMeetingSummary(text){
  const sentences = text.split(/[.。\n\r]/).map(s=>s.trim()).filter(Boolean);
  const summary = sentences.slice(0,2).join('. ') + (sentences.length>0?'.':'');
  const actionKeywords = ['필요','예정','하기로','전달','검토','보고','확인','요청','작성'];
  const candidates = sentences.filter(s=> actionKeywords.some(k=>s.includes(k)));
  const items = candidates.slice(0,5).map(s=>({text:s.replace(/^(그리고|또한|그래서)\s*/,''), deadline:''}));
  if(items.length===0 && sentences.length>0){
    items.push({text:sentences[0], deadline:''});
  }
  return {summary: summary || '요약할 내용이 없습니다.', items};
}

/* ============================================================
   실제 Claude API를 이용한 AI 요약 (선택사항, API 키 필요)
   ============================================================ */
async function callClaudeSummary(text){
  if(!state.anthropicApiKey) return null;
  const prompt = `다음은 업무 이메일/통화/미팅 원문입니다. 인사말이나 서명은 무시하고, 핵심 요청사항·결정사항·다음 액션이 드러나도록 15~40자 내외의 한국어 한 줄로 요약해줘. 요약 문장 하나만 출력하고 다른 설명은 절대 하지마.\n\n---\n${text.slice(0,4000)}`;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': state.anthropicApiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 120,
      messages: [{ role: 'user', content: prompt }],
    }),
  });
  if(!res.ok){
    const errBody = await res.text().catch(()=>'');
    throw new Error(`API 오류 (${res.status}): ${errBody.slice(0,200)}`);
  }
  const data = await res.json();
  const textBlock = data.content?.find(b=>b.type==='text');
  return textBlock?.text?.trim() || null;
}

/* 규칙 기반 폴백 요약 (API 키 없거나 호출 실패 시 사용)
   인사말/서명/기밀고지 등 정보값 낮은 문장은 제외하고, 핵심 키워드나 질문이 담긴 문장을 우선 선택 */
function generateOneLineSummary(text){
  if(!text) return '';
  // 서명 블록/기밀고지 등 뒷부분 통째로 제거 (흔한 마커 기준)
  const cutMarkers = [
    /confidentiality notice/i, /this (message|email) and any attachments/i,
    /sent from my iphone/i, /ios용 outlook/i, /보낸 사람\s*:/,
  ];
  let body = text;
  cutMarkers.forEach(m=>{
    const idx = body.search(m);
    if(idx > 20) body = body.slice(0, idx);
  });

  const rawLines = body.split(/[\n\r]+/).map(s=>s.trim()).filter(Boolean);
  const sentences = [];
  rawLines.forEach(line=>{
    line.split(/(?<=[.?!。])\s+/).forEach(s=>{
      const t = s.trim();
      if(t) sentences.push(t);
    });
  });
  if(sentences.length===0) return '';

  // 인사말/클로징/서명/연락처 라인 등 정보값 낮은 문장 제외
  const skipPatterns = [
    /^(hi|hello|dear|hey)\b/i, /^안녕하세요/, /^(thanks?|thank you|best regards|regards|sincerely|kind regards|cheers)\b[,.]?$/i,
    /^감사합니다[.!]?$/, /드림\s*$/, /^[A-Za-z가-힣\s]{1,15}(드림|올림)$/,
    /^(e|m|tel|mobile|phone|office)\s*[:.]/i, /^\+?\d[\d\-\s()]{6,}$/, /^https?:\/\//i,
    /^[\w.+-]+@[\w-]+\.[\w.]+$/,
  ];
  const candidates = sentences.filter(s => !skipPatterns.some(p=>p.test(s)) && s.length>3);
  const pool = candidates.length>0 ? candidates : sentences;

  // 핵심 키워드/질문 포함 문장 우선순위 부여
  const keywords = ['필요','예정','요청','확인','회신','검토','전달','계약','견적','가격','협의','일정','안내','부탁',
    'please','request','need','confirm','schedule','meeting','quote','price','contract','deadline','follow up','asap','urgent'];
  const scored = pool.map(s=>{
    let score = 0;
    if(/\?$/.test(s)) score += 3;
    keywords.forEach(k=>{ if(s.toLowerCase().includes(k)) score += 2; });
    if(s.length>=15 && s.length<=90) score += 1;
    return {s, score};
  }).sort((a,b)=>b.score-a.score);

  let picked = scored[0]?.s || pool[0];
  if(picked.length>80) picked = picked.slice(0,77)+'...';
  return picked;
}

  function openPersonModal(vendorId, person, idx){
    const v = state.data.vendors.find(x=>x.id===vendorId);
    const brand = state.activeBrandId && v?.brands ? v.brands.find(b=>b.id===state.activeBrandId) : null;
    const target = (brand && brand.inherit === false) ? brand : v;
    const targetLabel = brand ? ` — ${brand.name}` : '';
    openModal(`
      <div class="modal">
        <div class="mh"><h3>${person?'담당자 수정':'담당자 추가'}${targetLabel}</h3>
          <button class="btn btn-g close-x" id="closeModal"><i class="ti ti-x"></i></button>
        </div>
        <div class="mb">
          <form id="personForm">
            <div class="two">
              <div class="field"><label class="field-label">이름</label><input class="inp" name="name" value="${person?.name||''}" required/></div>
              <div class="field"><label class="field-label">직함</label><input class="inp" name="title" value="${person?.title||''}"/></div>
            </div>
            <div class="field"><label class="field-label">이메일</label><input class="inp" type="email" name="email" value="${person?.email||''}"/></div>
            <div class="field"><label class="field-label">전화</label><input class="inp" name="phone" value="${person?.phone||''}"/></div>
          </form>
        </div>
        <div class="mf"><button type="submit" form="personForm" class="btn btn-o"><i class="ti ti-device-floppy"></i> 저장</button></div>
      </div>`);
    bindModalCommon();
    document.getElementById('personForm').addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      if(!target.people) target.people = [];
      if(person && idx !== undefined){
        target.people[idx] = {...target.people[idx], name:fd.get('name'), title:fd.get('title'), email:fd.get('email'), phone:fd.get('phone')};
      } else {
        target.people.push({id:'p_'+uid('px'), name:fd.get('name'), title:fd.get('title'), email:fd.get('email'), phone:fd.get('phone'), isMain:target.people.length===0});
      }
      closeModal(); persist(false); render(); showToast('담당자가 저장되었습니다.');
    });
  }

function moveCalendarEventToDate(eid, newDate){
  if(eid.startsWith('deadline_')){
    const pid = eid.slice('deadline_'.length);
    const p = state.data.projects.find(x=>x.id===pid);
    if(p){ p.deadline = newDate; return {ok:true, label:'프로젝트 마감일'}; }
    return {ok:false};
  }
  if(eid.startsWith('ck_')){
    const cid = eid.slice('ck_'.length);
    for(const p of state.data.projects){
      const item = (p.checklist||[]).find(c=>c.id===cid);
      if(item){ item.dueDate = newDate; return {ok:true, label:'체크리스트 마감일'}; }
    }
    return {ok:false};
  }
  if(eid.startsWith('log_')){
    const lid = eid.slice('log_'.length);
    const log = state.data.vendorLogs.find(x=>x.id===lid);
    if(log){ log.nextStepDue = newDate; return {ok:true, label:'다음 액션 마감일'}; }
    return {ok:false};
  }
  if(eid.startsWith('leave_') || eid.startsWith('holiday_')){
    return {ok:false};
  }
  const ev = state.data.calendar.find(x=>x.id===eid);
  if(ev){ ev.date = newDate; return {ok:true, label:'일정'}; }
  return {ok:false};
}

  // 캘린더 이벤트 드래그 앤 드롭 → 날짜(마감일) 변경
  if(!isReadOnly()){
    document.querySelectorAll('.cal-ev[draggable="true"]').forEach(el=>{
      el.addEventListener('dragstart', e=>{
        e.dataTransfer.setData('text/plain', el.dataset.eid);
        e.dataTransfer.effectAllowed = 'move';
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', ()=>{
        el.classList.remove('dragging');
      });
    });

    document.querySelectorAll('.cal-cell[data-date]').forEach(el=>{
      el.addEventListener('dragover', e=>{
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        el.classList.add('drag-over');
      });
      el.addEventListener('dragleave', ()=>{
        el.classList.remove('drag-over');
      });
      el.addEventListener('drop', e=>{
        e.preventDefault();
        el.classList.remove('drag-over');
        const eid = e.dataTransfer.getData('text/plain');
        if(!eid) return;
        const newDate = el.dataset.date;
        const result = moveCalendarEventToDate(eid, newDate);
        if(result.ok){
          persist(false);
          render();
          showToast(`${result.label}이(가) ${fmtDate(newDate)}(으)로 변경되었습니다.`);
        }
      });
    });
  }

function bindChecklistDetailForm(item){
  const typeSel = document.getElementById('assigneeTypeSelect');
  typeSel.addEventListener('change', ()=>{
    document.getElementById('assigneeInternalField').style.display = typeSel.value==='internal' ? 'block' : 'none';
    document.getElementById('assigneeExternalField').style.display = typeSel.value==='external' ? 'block' : 'none';
  });

  let attachments = (item.attachments||[]).slice();
  document.getElementById('addAttachmentBtn').addEventListener('click', ()=>{
    const list = document.getElementById('attachmentList');
    const idx = list.children.length;
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; gap:6px; align-items:center;';
    row.innerHTML = `<input type="text" class="attachment-input" placeholder="https://..." style="flex:1;"/><i class="ti ti-x remove-attachment" style="cursor:pointer; color:var(--text-muted);"></i>`;
    list.appendChild(row);
    row.querySelector('.remove-attachment').addEventListener('click', ()=> row.remove());
  });
  document.querySelectorAll('.remove-attachment').forEach(el=>{
    el.addEventListener('click', ()=> el.closest('div').remove());
  });

  document.getElementById('checklistDetailForm').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const p = state.data.projects.find(x=>x.id===state.selectedProjectId);
    const target = p.checklist.find(c=>c.id===item.id);
    target.text = fd.get('text');
    target.status = fd.get('status');
    target.priority = fd.get('priority');
    target.startDate = fd.get('startDate')||'';
    target.dueDate = fd.get('dueDate')||'';
    target.requester = fd.get('requester')||'';
    target.done = fd.get('status')==='완료';
    const aType = fd.get('assigneeType');
    target.assigneeType = aType;
    if(aType==='internal') target.assigneeId = fd.get('assigneeInternal')||'';
    else if(aType==='external') target.assigneeId = fd.get('assigneeExternal')||'';
    else target.assigneeId = '';
    target.attachments = Array.from(document.querySelectorAll('.attachment-input')).map(i=>i.value.trim()).filter(Boolean);
    closeModal(); persist(false); showToast('체크리스트 항목이 저장되었습니다.');
  });
  const deleteBtn = document.getElementById('deleteChecklistBtn');
  if(deleteBtn) deleteBtn.addEventListener('click', ()=>{
    if(confirm('이 항목을 삭제하시겠습니까?')){
      const p = state.data.projects.find(x=>x.id===state.selectedProjectId);
      p.checklist = p.checklist.filter(c=>c.id!==item.id);
      closeModal(); persist(false); showToast('항목이 삭제되었습니다.');
    }
  });
}

function bindVendorFormSubmit(existingVendor){
  document.getElementById('vendorForm').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const updates = {
      name: fd.get('name'),
      priority: fd.get('priority'),
      companyType: fd.get('companyType') || '벤더',
      contact:{name:fd.get('contactName'), title:fd.get('contactTitle'), email:fd.get('contactEmail'), phone:fd.get('contactPhone')},
      notes:{discount:fd.get('discount'), payment:fd.get('payment'), moq:fd.get('moq'), creditLimit:fd.get('creditLimit')}
    };
    if(existingVendor){
      const idx = state.data.vendors.findIndex(v=>v.id===existingVendor.id);
      // 기존 데이터(people, customNotes, logoUrl, companyStatus 등) 보존하고 편집 필드만 업데이트
      state.data.vendors[idx] = { ...state.data.vendors[idx], ...updates };
    } else {
      state.data.vendors.push({
        id: uid('v'),
        status: '전송',
        actionStatus: '',
        companyStatus: 'Active',
        people: [],
        customNotes: [],
        ...updates
      });
    }
    closeModal(); persist(false); showToast('회사 정보가 저장되었습니다.');
  });
  // 모달 내 삭제 버튼 (편집 모달에서)
  const deleteBtn = document.getElementById('deleteVendorBtn');
  if(deleteBtn && existingVendor) deleteBtn.addEventListener('click', ()=>{
    if(confirm(`"${existingVendor.name}"을(를) 삭제하시겠습니까?\n연결된 로그 데이터는 유지됩니다.`)){
      state.data.vendors = state.data.vendors.filter(v=>v.id!==existingVendor.id);
      state.selectedVendorId = null;
      closeModal(); persist(false); render(); showToast('삭제되었습니다.');
    }
  });
}

function bindProjectFormSubmit(existingProject){

  const searchInput = document.getElementById('vendorSearchModal');
  if(searchInput) searchInput.addEventListener('input', e=>{
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.vendor-check-row').forEach(row=>{
      row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });

  // 선택 카운트 업데이트
  document.querySelectorAll('input[name="vendorIds"]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const count = document.querySelectorAll('input[name="vendorIds"]:checked').length;
      const el = document.getElementById('selectedVendorCount');
      if(el) el.textContent = count > 0 ? `${count}개 선택됨` : '선택 안함';
    });
  });

  document.getElementById('projectForm').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    let category = fd.get('category');
    if(category==='__new__'){
      const nc = (fd.get('newCategory')||'').trim();
      category = nc || '기타';
      if(nc && !state.data.categories.includes(nc)) state.data.categories.push(nc);
    }
    const vendorIds = Array.from(document.querySelectorAll('input[name="vendorIds"]:checked')).map(cb=>cb.value);
    const obj = {
      id: existingProject ? existingProject.id : uid('p'),
      title: fd.get('title'), category, owner: fd.get('owner')||'천세나',
      deadline: fd.get('deadline')||'',
      vendorIds,
      vendorId: vendorIds[0]||'', // 하위 호환성 유지
      checklist: existingProject ? existingProject.checklist : [],
      meetingNotes: existingProject ? existingProject.meetingNotes : [],
      logs: existingProject ? (existingProject.logs||[]) : [],
      vendorLogs: existingProject ? (existingProject.vendorLogs||{}) : {} // 벤더별 로그 맵
    };
    if(existingProject){
      const idx = state.data.projects.findIndex(p=>p.id===existingProject.id);
      state.data.projects[idx] = obj;
    } else {
      state.data.projects.push(obj);
    }
    closeModal(); persist(false); showToast('프로젝트가 저장되었습니다.');
  });

  const deleteBtn = document.getElementById('deleteProjectBtn');
  if(deleteBtn) deleteBtn.addEventListener('click', ()=>{
    if(confirm('이 프로젝트를 삭제하시겠습니까?')){
      state.data.projects = state.data.projects.filter(p=>p.id!==existingProject.id);
      state.selectedProjectId = null;
      closeModal(); persist(false); showToast('프로젝트가 삭제되었습니다.');
    }
  });
}
