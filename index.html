function bindLogModal(preVendorId, preProjectId){
  bindModalCommon();
  let pendingFileReads = 0;

  // 업데이트 유형이 '이메일'일 때만 발신/수신/제목 필드 표시
  const typeSel = document.querySelector('#logModalForm select[name="type"]');
  const emailFields = document.getElementById('lmEmailFields');
  const rawTextLabel = document.getElementById('lmRawTextLabel');
  function toggleEmailFields(){
    if(!typeSel || !emailFields) return;
    const isEmail = typeSel.value === '이메일';
    emailFields.style.display = isEmail ? '' : 'none';
    if(rawTextLabel) rawTextLabel.textContent = isEmail ? '이메일 본문' : '원본 내용 (통화/미팅 메모 등)';
    const rawTextArea = document.getElementById('lmRawText');
    if(rawTextArea) rawTextArea.placeholder = isEmail ? '이메일 본문 내용을 붙여넣으세요' : '통화 내용, 미팅 메모 등을 입력하세요';
  }
  if(typeSel){
    typeSel.addEventListener('change', toggleEmailFields);
    toggleEmailFields();
  }

  const vendorList = document.getElementById('lmVendorCheckList');
  const projSel = document.getElementById('lmProjSel');

  function updateProjectsForCheckedVendors(){
    if(!projSel) return;
    const checkedVids = Array.from(document.querySelectorAll('#lmVendorCheckList .ev-vendor-cb:checked')).map(cb=>cb.value);
    const rel = state.data.projects.filter(p=>{
      const ids = p.vendorIds||(p.vendorId?[p.vendorId]:[]);
      return ids.some(id=>checkedVids.includes(id));
    });
    const curVal = projSel.value;
    projSel.innerHTML = `<option value="">없음</option>`
      + rel.map(p=>`<option value="${p.id}" ${p.id===(curVal||preProjectId)?'selected':''}>${p.title}</option>`).join('');
  }

  bindVendorPersonChecklists('lmVendorCheckList', 'lmPersonCheckList', 'lmVendorSearch');
  if(vendorList) vendorList.addEventListener('change', e=>{
    if(e.target.classList.contains('ev-vendor-cb')) updateProjectsForCheckedVendors();
  });

  // API 키 설정 버튼
  const apiKeyBtn = document.getElementById('lmApiKeyBtn');
  if(apiKeyBtn) apiKeyBtn.addEventListener('click', ()=>{
    openModal(modalApiKeySettings());
    bindModalCommon();
    bindApiKeySettings();
  });

  // AI 요약
  const aiBtn = document.getElementById('lmAiBtn');
  if(aiBtn) aiBtn.addEventListener('click', async ()=>{
    const rawEl = document.getElementById('lmRawText');
    const subjectEl = document.getElementById('lmEmailSubject');
    const rawBody = rawEl?.value?.trim();
    const subject = subjectEl?.value?.trim();
    const raw = subject ? `제목: ${subject}\n${rawBody||''}` : rawBody;
    if(!rawBody){
      showToast('원본 내용을 먼저 입력해주세요.');
      if(rawEl){
        rawEl.style.border = '1.5px solid #DC2626';
        rawEl.style.boxShadow = '0 0 0 3px rgba(220,38,38,.15)';
        rawEl.focus();
        setTimeout(()=>{ rawEl.style.border=''; rawEl.style.boxShadow=''; }, 1600);
      }
      return;
    }
    const summEl = document.getElementById('lmSummary');
    const originalLabel = aiBtn.innerHTML;
    aiBtn.disabled = true;
    aiBtn.innerHTML = '<i class="ti ti-loader-2"></i> 생성 중...';
    try{
      if(state.anthropicApiKey){
        const aiResult = await callClaudeSummary(raw);
        if(aiResult){
          if(summEl) summEl.value = aiResult;
          showToast('Claude AI 요약이 생성되었습니다.');
          return;
        }
      }
      const summary = generateOneLineSummary(raw);
      if(summEl) summEl.value = summary;
      showToast(state.anthropicApiKey ? 'AI 응답이 비어있어 규칙 기반 요약을 사용했습니다.' : '요약이 생성되었습니다. (Claude 연동은 열쇠 아이콘에서 설정)');
    }catch(err){
      console.error(err);
      const summary = generateOneLineSummary(raw);
      if(summEl) summEl.value = summary;
      showToast('Claude API 호출 실패 — 규칙 기반 요약으로 대체했습니다. (' + err.message.slice(0,60) + ')');
    }finally{
      aiBtn.disabled = false;
      aiBtn.innerHTML = originalLabel;
    }
  });

  // 파일/링크 탭 전환
  const lmTabLink = document.getElementById('lmTabLink');
  const lmTabFile = document.getElementById('lmTabFile');
  const lmLinkArea = document.getElementById('lmLinkArea');
  const lmFileArea = document.getElementById('lmFileArea');
  if(lmTabLink) lmTabLink.addEventListener('click', ()=>{
    lmLinkArea.style.display='flex'; lmFileArea.style.display='none';
    lmTabLink.className='btn btn-o'; lmTabFile.className='btn';
  });
  if(lmTabFile) lmTabFile.addEventListener('click', ()=>{
    lmLinkArea.style.display='none'; lmFileArea.style.display='block';
    lmTabFile.className='btn btn-o'; lmTabLink.className='btn';
  });

  // 파일 업로드 처리 (Storage에 업로드 후 URL만 저장 -> 용량 걱정 없음)
  function addFileToLinkList(file){
    if(file.size > 10*1024*1024){
      showToast(`${file.name}: 10MB 초과 파일은 업로드할 수 없습니다.`); return;
    }
    pendingFileReads++;
    updateSubmitBtnState();
    const list = document.getElementById('lmLinkList');
    const row = document.createElement('div');
    row.className = 'link-row';
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;border-radius:8px;border:0.5px solid var(--bd)';
    const ext = file.name.split('.').pop().toLowerCase();
    const icon = ['jpg','jpeg','png','gif','webp'].includes(ext) ? '🖼️'
               : ext === 'pdf' ? '📄'
               : ['xlsx','xls','csv'].includes(ext) ? '📊'
               : ['docx','doc'].includes(ext) ? '📝' : '📎';
    row.innerHTML = `<span style="font-size:16px">${icon}</span>
      <input type="hidden" class="link-label" value="${file.name}"/>
      <input type="hidden" class="link-url" value=""/>
      <input type="hidden" class="link-data" value=""/>
      <input type="hidden" class="link-type" value="${file.type||'application/octet-stream'}"/>
      <span style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${file.name}</span>
      <span class="link-upload-status" style="font-size:10px;color:var(--muted);flex-shrink:0">업로드 중...</span>
      <button type="button" class="btn btn-red" style="padding:2px 6px;font-size:10px;flex-shrink:0" onclick="this.closest('.link-row').remove()"><i class="ti ti-x"></i></button>`;
    list.appendChild(row);

    const isImage = (file.type||'').startsWith('image/');
    const uploadPromise = isImage
      ? compressImageToBlob(file, 1600, 0.85).then(blob=>uploadFileToStorage(blob, 'attachments', file.name))
      : uploadFileToStorage(file, 'attachments', file.name);

    uploadPromise.then(url=>{
      const urlInput = row.querySelector('.link-url');
      if(urlInput) urlInput.value = url;
      const statusEl = row.querySelector('.link-upload-status');
      if(statusEl) statusEl.textContent = (file.size/1024).toFixed(0)+'KB';
      pendingFileReads--;
      updateSubmitBtnState();
    }).catch(err=>{
      console.error(err);
      showToast(`${file.name} 업로드 실패: ` + (err.message||'').slice(0,80));
      row.remove();
      pendingFileReads--;
      updateSubmitBtnState();
    });
  }

  function updateSubmitBtnState(){
    const submitBtn = document.querySelector('button[type=submit][form=logModalForm]');
    if(!submitBtn) return;
    if(pendingFileReads > 0){
      submitBtn.disabled = true;
      submitBtn.dataset.origLabel = submitBtn.dataset.origLabel || submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="ti ti-loader-2"></i> 파일 처리 중...';
    } else {
      submitBtn.disabled = false;
      if(submitBtn.dataset.origLabel) submitBtn.innerHTML = submitBtn.dataset.origLabel;
    }
  }

  const lmFileInput = document.getElementById('lmFileInput');
  const lmDropZone = document.getElementById('lmFileDropZone');
  if(lmDropZone){
    lmDropZone.addEventListener('click', ()=>lmFileInput?.click());
    lmDropZone.addEventListener('dragover', e=>{ e.preventDefault(); lmDropZone.style.borderColor='var(--o)'; lmDropZone.style.background='var(--ol)'; });
    lmDropZone.addEventListener('dragleave', ()=>{ lmDropZone.style.borderColor='var(--bd)'; lmDropZone.style.background='#fff'; });
    lmDropZone.addEventListener('drop', e=>{
      e.preventDefault();
      lmDropZone.style.borderColor='var(--bd)'; lmDropZone.style.background='#fff';
      Array.from(e.dataTransfer.files).forEach(addFileToLinkList);
    });
  }
  if(lmFileInput) lmFileInput.addEventListener('change', e=>{
    Array.from(e.target.files).forEach(addFileToLinkList);
    e.target.value='';
  });

  // 파일 링크 추가
  const addLinkBtn = document.getElementById('lmAddLinkBtn');
  if(addLinkBtn) addLinkBtn.addEventListener('click', ()=>{
    const label = document.getElementById('lmLinkLabel').value.trim();
    const url = document.getElementById('lmLinkUrl').value.trim();
    if(!url){ showToast('URL을 입력해주세요.'); return; }
    const list = document.getElementById('lmLinkList');
    const id = uid('lk');
    const row = document.createElement('div');
    row.className = 'link-row';
    row.dataset.id = id;
    row.style.cssText = 'display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--sf);border-radius:6px';
    row.innerHTML = `<i class="ti ti-paperclip" style="font-size:12px;color:var(--muted)"></i>
      <input type="hidden" class="link-label" value="${label||url}"/>
      <input type="hidden" class="link-url" value="${url}"/>
      <span style="font-size:12px;flex:1">${label||url}</span>
      <button type="button" class="btn btn-red" style="padding:2px 6px;font-size:10px" onclick="this.closest('.link-row').remove()"><i class="ti ti-x"></i></button>`;
    list.appendChild(row);
    document.getElementById('lmLinkLabel').value = '';
    document.getElementById('lmLinkUrl').value = '';
  });
  // 링크 입력창에서 Enter키 누르면 폼이 조기 제출되지 않고 링크만 추가되도록 처리
  ['lmLinkLabel','lmLinkUrl'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); addLinkBtn?.click(); }
    });
  });

  // 폼 제출
  const form = document.getElementById('logModalForm');
  if(form) form.addEventListener('submit', e=>{
    e.preventDefault();
    if(pendingFileReads > 0){
      showToast('파일을 처리하는 중입니다. 잠시 후 다시 시도해주세요.');
      return;
    }
    const fd = new FormData(form);
    const checkedVendorIds = Array.from(document.querySelectorAll('#lmVendorCheckList .ev-vendor-cb:checked')).map(cb=>cb.value);
    if(checkedVendorIds.length===0){ showToast('거래처를 최소 1곳 선택해주세요.'); return; }
    const checkedPersonIds = Array.from(document.querySelectorAll('#lmPersonCheckList .ev-person-cb:checked')).map(cb=>cb.value);
    const linkedProjectId = fd.get('linkedProjectId')||'';
    const nextStep = fd.get('nextStep')||'';
    const needsApproval = fd.get('needsApproval')==='on';

    // 링크+파일 수집 (모든 선택 거래처 로그에 공통 반영)
    const links = [];
    document.querySelectorAll('#lmLinkList .link-row').forEach(row=>{
      const label = row.querySelector('.link-label')?.value?.trim();
      const url   = row.querySelector('.link-url')?.value?.trim();
      const data  = row.querySelector('.link-data')?.value?.trim();
      const type  = row.querySelector('.link-type')?.value?.trim();
      if(data){
        links.push({label: label||'파일', url:'', data, type});
      } else if(url){
        links.push({label: label||url, url});
      }
    });

    const createdLogs = [];
    checkedVendorIds.forEach(vendorId=>{
      const vendor = state.data.vendors.find(v=>v.id===vendorId);
      // 이 거래처에 소속된 담당자만 필터링
      const contactPersonIds = checkedPersonIds.filter(pid => (vendor?.people||[]).some(p=>p.id===pid));

      const newLog = {
        id: uid('vl'), vendorId, date: fd.get('date'),
        type: fd.get('type'), status: fd.get('status'), priority: fd.get('priority'),
        summary: fd.get('summary'), nextStep,
        nextStepDue: fd.get('nextStepDue')||'',
        rawText: fd.get('rawText')||'',
        emailFrom: fd.get('emailFrom')||'', emailTo: fd.get('emailTo')||'', emailSubject: fd.get('emailSubject')||'',
        needsApproval, nextStepDone: false,
        links, linkedProjectId,
        contactPersonIds,
        createdAt: Date.now()
      };
      createdLogs.push(newLog);
      state.data.vendorLogs.push(newLog);

      // 다음액션 → 벤더 체크리스트 자동 생성
      if(nextStep && vendor){
        if(!vendor.checklist) vendor.checklist = [];
        vendor.checklist.push({id:uid('ck'), text:nextStep, done:false, fromLog:newLog.id});
      }

      // 대표님 승인
      if(needsApproval){
        if(!state.data.approvalItems) state.data.approvalItems = [];
        state.data.approvalItems.push({id:uid('ap'), vendorId, content: fd.get('summary'), date: fd.get('date'), approved:false, logId: newLog.id});
      }

      // 연결 프로젝트에 자동 반영
      if(linkedProjectId){
        const proj = state.data.projects.find(p=>p.id===linkedProjectId);
        if(proj){
          if(!proj.vendorLogs) proj.vendorLogs = {};
          if(!proj.vendorLogs[vendorId]) proj.vendorLogs[vendorId] = [];
          proj.vendorLogs[vendorId].unshift(newLog);
        }
      }
    });

    state.data.vendorLogs = sortLogsDesc(state.data.vendorLogs);

    closeModal();
    persist(false);
    render();
    showToast(checkedVendorIds.length>1 ? `거래처 ${checkedVendorIds.length}곳에 로그가 저장되었습니다.` : '로그가 저장되었습니다.');
  });
}


/* ---------- 연차 계산 로직 ---------- */
function calcLeave(asOfDateStr){
  const l = state.data.leave;
  let totalGranted = 0;
  let grantDetails = [];
  let yearsWorked = 0;
  let monthsWorked = 0;
  const asOf = asOfDateStr ? new Date(asOfDateStr + 'T00:00:00') : new Date();

  if(l.joinDate){
    const join = new Date(l.joinDate + 'T00:00:00');
    const now = asOf;

    // 정확한 연/월 계산
    yearsWorked = now.getFullYear() - join.getFullYear();
    const monthDiff = now.getMonth() - join.getMonth();
    const dayDiff = now.getDate() - join.getDate();

    // 아직 기념일이 지나지 않았으면 1년 빼기
    if(monthDiff < 0 || (monthDiff === 0 && dayDiff < 0)) yearsWorked--;

    // 총 완성된 개월수
    monthsWorked = (now.getFullYear() - join.getFullYear()) * 12 + (now.getMonth() - join.getMonth());
    if(dayDiff < 0) monthsWorked--;
    monthsWorked = Math.max(0, monthsWorked);
    yearsWorked = Math.max(0, yearsWorked);

    if(yearsWorked < 1){
      // 1년 미만: 완성된 개월수만큼 발생 (최대 11개)
      const months = Math.min(monthsWorked, 11);
      totalGranted = months;
      grantDetails.push({label:`입사 ${monthsWorked}개월차 · 발생 ${months}개`, amount:months});
    } else {
      // 1년 이상: 15개 기본, 3년차부터 2년마다 +1 (최대 25개)
      const base = 15;
      const extra = yearsWorked >= 3 ? Math.min(Math.floor((yearsWorked - 1) / 2), 10) : 0;
      const annual = Math.min(base + extra, 25);
      totalGranted = annual;
      grantDetails.push({label:`${yearsWorked}년차 연차 ${annual}개 발생`, amount:annual});
    }
  }

  const asOfStr = dayjs(asOf).format('YYYY-MM-DD');
  const compTotal = (l.compLogs||[]).filter(c=>c.date<=asOfStr).reduce((sum,c)=>sum+c.amount, 0);
  const used = (l.logs||[]).filter(r=>r.date<=asOfStr).reduce((sum,r)=>sum+r.amount, 0);
  const remaining = Math.round((totalGranted + compTotal - used) * 100) / 100;

  return { totalGranted, compTotal, used, remaining, grantDetails, yearsWorked, monthsWorked };
}

function viewCompanyList(){
  const alphaFilter = state.companyAlphaFilter || 'ALL';
  let companies = state.data.companies.slice();
  if(state.companySearch){
    const q=state.companySearch.toLowerCase();
    companies=companies.filter(c=>c.name.toLowerCase().includes(q)||c.people.some(p=>p.name.toLowerCase().includes(q)));
  }
  if(alphaFilter !== 'ALL'){
    const getFirstChoseong = name => {
      const code = (name||'').charCodeAt(0);
      if(code >= 0xAC00 && code <= 0xD7A3){
        const fullInitials = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
        const map2 = {'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
        const cho = fullInitials[Math.floor((code-0xAC00)/28/21)];
        return map2[cho]||cho;
      }
      return (name||'')[0]?.toUpperCase()||'';
    };
    companies = companies.filter(c=>getFirstChoseong(c.name)===alphaFilter||c.name[0]?.toUpperCase()===alphaFilter);
  }
  companies.sort((a,b)=>a.name.localeCompare(b.name));

  // 한글 초성 추출 함수
  const getChoseong = ch => {
    const code = ch.charCodeAt(0);
    if(code >= 0xAC00 && code <= 0xD7A3){
      const initials = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
      const idx = Math.floor((code - 0xAC00) / 28 / 21);
      const fullInitials = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
      const cho = fullInitials[idx];
      // ㄲ→ㄱ, ㄸ→ㄷ, ㅃ→ㅂ, ㅆ→ㅅ, ㅉ→ㅈ 통합
      const map = {'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
      return map[cho] || cho;
    }
    if(code >= 65 && code <= 90) return ch.toUpperCase(); // A-Z
    if(code >= 97 && code <= 122) return ch.toUpperCase(); // a-z
    return ch.toUpperCase();
  };

  // 한글 ㄱㄴㄷ 순서
  const HANGUL_ORDER = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const isHangul = ch => /[ㄱ-ㅎ가-힣]/.test(ch);
  const isAlpha = ch => /[A-Za-z]/.test(ch);

  // 실제 존재하는 초성 목록 추출 + 정렬
  const allInitials = [...new Set(state.data.companies.map(c=>getChoseong(c.name[0]||'')).filter(Boolean))];
  const sortedInitials = allInitials.sort((a,b) => {
    const aH = isHangul(a), bH = isHangul(b);
    if(aH && bH) return HANGUL_ORDER.indexOf(a) - HANGUL_ORDER.indexOf(b);
    if(aH) return -1; // 한글 먼저
    if(bH) return 1;
    return a.localeCompare(b); // 영문은 알파벳순
  });

  const alphaButtons = ['ALL', ...sortedInitials].map(ch=>
    `<button class="btn ${alphaFilter===ch?'btn-o':''}" data-alpha="${ch}" style="padding:4px 8px;font-size:11px;min-width:32px">${ch}</button>`

  return `

        <div class="search-wrap" style="width:220px"><i class="ti ti-search"></i><input class="inp" id="companySearchInput" placeholder="회사 또는 담당자 검색" value="${state.companySearch}" style="margin:0"/></div>
      </div>
      ${!isReadOnly()?`<button class="btn btn-o" id="addCompanyBtn"><i class="ti ti-plus"></i> 회사 추가</button>`:''}
    </div>

    <div class="pill-bar" style="margin-bottom:12px">${alphaButtons}</div>

    <div class="krow" style="grid-template-columns:repeat(2,1fr);max-width:320px;margin-bottom:14px">
      <div class="kpi"><div class="kn">${companies.length}</div><div class="kl">표시 중</div></div>
      <div class="kpi"><div class="kn">${allPeopleFlat().length}</div><div class="kl">등록된 담당자</div></div>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <table class="tbl">
        <colgroup><col style="width:28%"><col style="width:10%"><col style="width:20%"><col style="width:42%"></colgroup>
        <thead><tr><th>회사명</th><th>담당자 수</th><th>메인 담당자</th><th>담당자 목록</th></tr></thead>
        <tbody>
        ${companies.length===0?`<tr><td colspan="4"><div class="empty-state">검색 결과가 없습니다.</div></td></tr>`:
          companies.map(c=>{
            const mainP = c.people.find(p=>p.isMain) || c.people[0];
            // 연결된 거래처 찾기
            const linkedVendor = state.data.vendors.find(v=>v.name===c.name);

                </div>
              </div></td>
              <td>${c.people.length}명</td>
              <td>${mainP?`<div style="display:flex;align-items:center;gap:4px">${av(mainP.name,20)}<span style="font-size:12px">${mainP.name}</span></div>`:'-'}</td>
              <td style="color:var(--muted);font-size:12px">${c.people.slice(0,3).map(p=>p.name).join(', ')}${c.people.length>3?` 외 ${c.people.length-3}명`:''}</td>

      </table>

function openModal(html){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  const stackIndex = document.querySelectorAll('.overlay').length;
  if(stackIndex===0) overlay.id = 'modalOverlay'; // 하위 호환용 (기존 코드가 이 id를 참조할 수 있음)
  overlay.style.zIndex = String(200 + stackIndex*10);
  overlay.innerHTML = html;
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
}
function closeModal(){
  const overlays = document.querySelectorAll('.overlay');
  const last = overlays[overlays.length-1];
  if(last) last.remove();
}

function bindBulkPurchaseUpdateModal(){
  const yearFromSel = document.getElementById('bulkPurchaseYearFromSel');
  const yearToSel = document.getElementById('bulkPurchaseYearToSel');
  const downloadBtn = document.getElementById('downloadPurchaseTemplateBtn');
  const dropZone = document.getElementById('bulkUploadDropZone');
  const fileInput = document.getElementById('bulkUploadFileInput');
  const resultEl = document.getElementById('bulkUploadResult');

  if(downloadBtn) downloadBtn.addEventListener('click', ()=>{
    let yFrom = Number(yearFromSel.value), yTo = Number(yearToSel.value);
    if(yFrom > yTo){ [yFrom, yTo] = [yTo, yFrom]; }
    const yearRange = [];
    for(let y=yFrom; y<=yTo; y++) yearRange.push(y);
    const vendors = (state.data.vendors||[]).filter(v=>(v.companyType||'벤더')==='벤더');
    const rows = [];
    vendors.forEach(v=>{
      yearRange.forEach(year=>{
        const pd = (v.purchaseData && v.purchaseData[year]) || {};
        const row = {'벤더명': v.name, '연도': year};
        for(let m=1;m<=12;m++){ row[`${m}월`] = pd[m]!==undefined ? pd[m] : ''; }
        rows.push(row);
      });
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:24}, {wch:8}, ...Array(12).fill({wch:10})];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, `구매액`);
    XLSX.writeFile(wb, `벤더_구매액_${yFrom}-${yTo}.xlsx`);
    showToast('엑셀 템플릿을 다운로드했습니다.');
  });

  function handleBulkPurchaseFile(file){
    resultEl.innerHTML = '<span style="color:var(--muted)">처리 중...</span>';
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
        const matchedVendors = new Set();
        const yearsUpdated = new Set();
        let updatedCells = 0;
        const unmatched = [];
        json.forEach(row=>{
          const name = (row['벤더명']||'').toString().trim();
          if(!name) return;
          const year = Number(row['연도']);
          if(!year || isNaN(year)){ return; }
          const v = state.data.vendors.find(x=>x.name.trim()===name && (x.companyType||'벤더')==='벤더');
          if(!v){ if(!unmatched.includes(name)) unmatched.push(name); return; }
          matchedVendors.add(v.id);
          yearsUpdated.add(year);
          if(!v.purchaseData) v.purchaseData = {};
          if(!v.purchaseData[year]) v.purchaseData[year] = {};
          for(let m=1;m<=12;m++){
            const raw = row[`${m}월`];
            if(raw===''||raw===undefined||raw===null) continue;
            const num = Number(raw);
            if(!isNaN(num)){
              v.purchaseData[year][m] = num;
              updatedCells++;
            }
          }
        });
        persist(false); render();
        const yearsList = Array.from(yearsUpdated).sort((a,b)=>a-b).join(', ');
        resultEl.innerHTML = `<div style="padding:10px 12px;background:var(--sf);border-radius:8px">
          <div style="font-weight:600;color:var(--text);margin-bottom:4px">✔ 업로드 완료</div>
          <div style="color:var(--muted)">${matchedVendors.size}개 벤더 · ${yearsUpdated.size}개 연도(${yearsList}) · ${updatedCells}개 값 업데이트됨</div>
          ${unmatched.length>0?`<div style="color:#E5484D;margin-top:6px">일치하는 벤더명을 찾지 못함 (${unmatched.length}개): ${unmatched.slice(0,5).join(', ')}${unmatched.length>5?' 외':''}</div>`:''}
        </div>`;
        showToast(`구매액 업데이트 완료: ${matchedVendors.size}개 벤더, ${yearsUpdated.size}개 연도`);
      }catch(err){
        console.error(err);
        resultEl.innerHTML = `<span style="color:#E5484D">파일을 읽을 수 없습니다. 엑셀 템플릿 형식을 확인해주세요.</span>`;
      }
    };
    reader.readAsArrayBuffer(file);
  }

  if(dropZone){
    dropZone.addEventListener('click', ()=>fileInput.click());
    dropZone.addEventListener('dragover', e=>{ e.preventDefault(); dropZone.style.borderColor='var(--o)'; dropZone.style.background='var(--ol)'; });
    dropZone.addEventListener('dragleave', ()=>{ dropZone.style.borderColor='var(--bd)'; dropZone.style.background='transparent'; });
    dropZone.addEventListener('drop', e=>{
      e.preventDefault();
      dropZone.style.borderColor='var(--bd)'; dropZone.style.background='transparent';
      const file = e.dataTransfer.files[0];
      if(file) handleBulkPurchaseFile(file);
    });
  }
  if(fileInput) fileInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(file) handleBulkPurchaseFile(file);
    e.target.value='';
  });
}

  const logs = state.data.vendorLogs.filter(l=>(l.summary||'').toLowerCase().includes(q) || (l.rawText||'').toLowerCase().includes(q) || (l.nextStep||'').toLowerCase().includes(q)).slice(0,10);

  if(vendors.length===0 && projects.length===0 && logs.length===0){
    return `<div style="font-size:12px;color:var(--muted);text-align:center;padding:24px 0">'${query}'에 대한 검색 결과가 없습니다.</div>`;

      </div>
      <i class="ti ti-chevron-right" style="font-size:13px;color:var(--muted)"></i>
    </div>`).join('');
  }
  if(projects.length>0){
    html += `<div style="font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">프로젝트</div>`;

  }
  if(logs.length>0){
    html += `<div style="font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">로그</div>`;

function stripHtml(html){
  if(!html) return '';
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return (tmp.textContent || tmp.innerText || '').trim();
}

function applyFontSize(px){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.getRangeAt(0).collapsed){
    showToast('먼저 크기를 바꿀 텍스트를 드래그해서 선택해주세요.');
    return;
  }
  const range = sel.getRangeAt(0);
  const span = document.createElement('span');
  span.style.fontSize = px+'px';
  const content = range.extractContents();
  span.appendChild(content);
  range.insertNode(span);
  sel.removeAllRanges();
  const newRange = document.createRange();
  newRange.selectNodeContents(span);
  sel.addRange(newRange);
}

function applyFontFamily(fontFamily){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.getRangeAt(0).collapsed){
    showToast('먼저 글꼴을 바꿀 텍스트를 드래그해서 선택해주세요.');
    return;
  }
  const range = sel.getRangeAt(0);
  const span = document.createElement('span');
  if(fontFamily) span.style.fontFamily = fontFamily;
  const content = range.extractContents();
  span.appendChild(content);
  range.insertNode(span);
  sel.removeAllRanges();
  const newRange = document.createRange();
  newRange.selectNodeContents(span);
  sel.addRange(newRange);
}

function applyLineHeight(value, editor){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0) return;
  const range = sel.getRangeAt(0);
  let node = range.commonAncestorContainer;
  if(node.nodeType===3) node = node.parentElement;
  let block = node;
  const blockTags = ['DIV','P','LI','TD','TH','BLOCKQUOTE'];
  while(block && block!==editor && !blockTags.includes(block.tagName)){
    block = block.parentElement;
  }
  if(!block || block===editor){
    editor.style.lineHeight = value;
    return;
  }
  block.style.lineHeight = value;
}

function richEditorHtml(editorId, placeholder, contentHtml){
  return `<div id="${editorId}" class="rte-editor" contenteditable="true" data-placeholder="${placeholder}">${contentHtml||''}</div>`;
}

function bindRichEditor(editorId){
  const toolbar = document.querySelector(`.rte-toolbar[data-target="${editorId}"]`);
  const editor = document.getElementById(editorId);
  if(!toolbar || !editor) return;

  toolbar.querySelectorAll('.rte-btn[data-cmd]').forEach(btn=>{
    btn.addEventListener('mousedown', e=>e.preventDefault());
    btn.addEventListener('click', ()=>{
      editor.focus();
      document.execCommand(btn.dataset.cmd, false, null);
    });
  });

  toolbar.querySelectorAll('.rte-highlight-btn, .rte-textcolor-btn, .rte-fontsize-btn, .rte-fontfamily-btn, .rte-lineheight-btn').forEach(btn=>{
    btn.addEventListener('mousedown', e=>e.preventDefault());
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const pop = btn.nextElementSibling;
      toolbar.querySelectorAll('.rte-color-popover').forEach(p=>{ if(p!==pop) p.style.display='none'; });
      pop.style.display = pop.style.display==='flex' ? 'none' : 'flex';
    });
  });
  toolbar.querySelectorAll('.rte-size-opt').forEach(opt=>{
    opt.addEventListener('mousedown', e=>e.preventDefault());
    opt.addEventListener('mouseover', ()=>{ opt.style.background='var(--sf)'; });
    opt.addEventListener('mouseout', ()=>{ opt.style.background='transparent'; });
    opt.addEventListener('click', e=>{
      e.stopPropagation();
      editor.focus();
      applyFontSize(opt.dataset.size);
      opt.closest('.rte-color-popover').style.display = 'none';
    });
  });
  toolbar.querySelectorAll('.rte-ff-opt').forEach(opt=>{
    opt.addEventListener('mousedown', e=>e.preventDefault());
    opt.addEventListener('mouseover', ()=>{ opt.style.background='var(--sf)'; });
    opt.addEventListener('mouseout', ()=>{ opt.style.background='transparent'; });
    opt.addEventListener('click', e=>{
      e.stopPropagation();
      editor.focus();
      applyFontFamily(opt.dataset.ff);
      opt.closest('.rte-color-popover').style.display = 'none';
    });
  });
  toolbar.querySelectorAll('.rte-lh-opt').forEach(opt=>{
    opt.addEventListener('mousedown', e=>e.preventDefault());
    opt.addEventListener('mouseover', ()=>{ opt.style.background='var(--sf)'; });
    opt.addEventListener('mouseout', ()=>{ opt.style.background='transparent'; });
    opt.addEventListener('click', e=>{
      e.stopPropagation();
      editor.focus();
      applyLineHeight(opt.dataset.lh, editor);
      opt.closest('.rte-color-popover').style.display = 'none';
    });
  });
  toolbar.querySelectorAll('.rte-color-dot').forEach(dot=>{
    dot.addEventListener('mousedown', e=>e.preventDefault());
    dot.addEventListener('click', e=>{
      e.stopPropagation();
      editor.focus();
      const pop = dot.closest('.rte-color-popover');
      const type = pop.dataset.type;
      const color = dot.dataset.color;
      if(type==='hilite'){
        document.execCommand('hiliteColor', false, color);
      } else {
        document.execCommand('foreColor', false, color);
      }
      pop.style.display = 'none';
    });
  });
  toolbar.querySelectorAll('.rte-color-popover').forEach(pop=>{
    pop.addEventListener('click', e=>e.stopPropagation());
    pop.addEventListener('mousedown', e=>e.stopPropagation());
  });
  document.addEventListener('click', ()=>{
    toolbar.querySelectorAll('.rte-color-popover').forEach(p=>p.style.display='none');
  });

  let savedTableRange = null;
  const tableBtn = toolbar.querySelector('.rte-table-btn');
  if(tableBtn){
    tableBtn.addEventListener('mousedown', e=>e.preventDefault());
    tableBtn.addEventListener('click', e=>{
      e.stopPropagation();
      const sel = window.getSelection();
      if(sel && sel.rangeCount>0){
        savedTableRange = sel.getRangeAt(0).cloneRange();
      }
      const pop = tableBtn.nextElementSibling;
      toolbar.querySelectorAll('.rte-color-popover').forEach(p=>{ if(p!==pop) p.style.display='none'; });
      pop.style.display = pop.style.display==='flex' ? 'none' : 'flex';
    });
  }
  const tableInsertBtn = toolbar.querySelector('.rte-table-insert-btn');
  if(tableInsertBtn){
    tableInsertBtn.addEventListener('click', ()=>{
      const rowsEl = toolbar.querySelector('.rte-table-rows-input');
      const colsEl = toolbar.querySelector('.rte-table-cols-input');
      const rows = Math.max(1, parseInt(rowsEl.value)||3);
      const cols = Math.max(1, parseInt(colsEl.value)||3);
      let html = '<table>';
      for(let r=0;r<rows;r++){
        html += '<tr>' + Array.from({length:cols}).map(()=>'<td>&nbsp;</td>').join('') + '</tr>';
      }
      html += '</table><p><br></p>';
      editor.focus();
      const sel = window.getSelection();
      if(savedTableRange){
        sel.removeAllRanges();
        sel.addRange(savedTableRange);
      }
      document.execCommand('insertHTML', false, html);
      const pop = tableBtn.nextElementSibling;
      if(pop) pop.style.display = 'none';
    });
  }

  function findCurrentTableCell(){
    const sel = window.getSelection();
    if(!sel || sel.rangeCount===0) return null;
    let node = sel.getRangeAt(0).startContainer;
    if(node.nodeType===3) node = node.parentElement;
    while(node && node!==editor){
      if(node.tagName==='TD' || node.tagName==='TH') return node;
      node = node.parentElement;
    }
    return null;
  }

  const addRowBtn = toolbar.querySelector('.rte-table-addrow-btn');
  if(addRowBtn){
    addRowBtn.addEventListener('mousedown', e=>e.preventDefault());
    addRowBtn.addEventListener('click', ()=>{
      const cell = findCurrentTableCell();
      if(!cell){ showToast('표 안에 커서(클릭)를 두고 눌러주세요.'); return; }
      const row = cell.closest('tr');
      const cols = row.children.length;
      const newRow = document.createElement('tr');
      for(let i=0;i<cols;i++){
        const td = document.createElement('td');
        td.innerHTML = '&nbsp;';
        newRow.appendChild(td);
      }
      row.parentNode.insertBefore(newRow, row.nextSibling);
    });
  }
  const addColBtn = toolbar.querySelector('.rte-table-addcol-btn');
  if(addColBtn){
    addColBtn.addEventListener('mousedown', e=>e.preventDefault());
    addColBtn.addEventListener('click', ()=>{
      const cell = findCurrentTableCell();
      if(!cell){ showToast('표 안에 커서(클릭)를 두고 눌러주세요.'); return; }
      const table = cell.closest('table');
      const colIndex = Array.from(cell.parentNode.children).indexOf(cell);
      table.querySelectorAll('tr').forEach(tr=>{
        const tag = (tr.children[0] && tr.children[0].tagName==='TH') ? 'th' : 'td';
        const td = document.createElement(tag);
        td.innerHTML = '&nbsp;';
        const refCell = tr.children[colIndex];
        if(refCell && refCell.nextSibling) tr.insertBefore(td, refCell.nextSibling);
        else tr.appendChild(td);
      });
    });
  }
}

  const personTrigger = document.getElementById('vmPersonTrigger');
  const personLabel = document.getElementById('vmPersonLabel');
  function syncPersonLabel(){
    if(selectedPersonIds.length===0){ personLabel.textContent = '담당자 선택'; personLabel.style.color = 'var(--muted)'; }
    else {
      const names = people.filter(p=>selectedPersonIds.includes(p.id)).map(p=>p.name);
      personLabel.textContent = names.join(', ');
      personLabel.style.color = 'var(--text)';
    }
  }
  syncPersonLabel();
  if(personTrigger) personTrigger.addEventListener('click', e=>{
    e.stopPropagation();
    if(_activeDropdown && _activeDropdown.trigger === personTrigger){ closeDropdown(); return; }
    closeDropdown();
    const rect = personTrigger.getBoundingClientRect();
    const menu = document.createElement('div');
    menu.className = 'cdd-menu-portal';
    menu.innerHTML = people.length ? people.map(p=>{
      const active = selectedPersonIds.includes(p.id);
      return `<div class="cdd-item ${active?'active':''}" data-pid="${p.id}"><i class="ti ${active?'ti-square-check':'ti-square'} cdd-icon" style="color:${active?'var(--o)':'var(--muted)'}"></i><span>${p.name}${p.title?' ('+p.title+')':''}</span></div>`;
    }).join('') : '<div class="empty-state" style="padding:16px;font-size:12px">등록된 담당자가 없습니다.</div>';
    document.body.appendChild(menu);
    const mw = menu.offsetWidth, mh = menu.offsetHeight;
    let top = rect.bottom + 6, left = rect.left;
    if(left + mw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - mw - 8);
    if(top + mh > window.innerHeight - 8) top = Math.max(8, rect.top - mh - 6);
    menu.style.top = top+'px'; menu.style.left = left+'px'; menu.style.minWidth = Math.max(rect.width, 200)+'px';
    personTrigger.classList.add('cdd-open');
    _dropdownOpenedAt = Date.now();
    menu.querySelectorAll('.cdd-item[data-pid]').forEach(item=>{
      item.addEventListener('click', ev=>{
        ev.stopPropagation();
        const pid = item.dataset.pid;

        const isActive = selectedPersonIds.includes(pid);
        item.classList.toggle('active', isActive);
        const icon = item.querySelector('.cdd-icon');
        icon.className = 'ti '+(isActive?'ti-square-check':'ti-square')+' cdd-icon';
        icon.style.color = isActive?'var(--o)':'var(--muted)';
        syncPersonLabel();
      });
    });
    _activeDropdown = {trigger:personTrigger, menu};
  });

  const saveBtn = document.getElementById('vmSaveBtn');
  if(!saveBtn) return;
  saveBtn.addEventListener('click', ()=>{
    const isEdit = !!editCtx;
    const projectId = isEdit ? editCtx.projectId : document.getElementById('vmProjectSel').value;

    if(!title){ showToast('제목을 입력해주세요.'); return; }
    if(!plainText){ showToast('회의 내용을 입력해주세요.'); return; }
    const p = state.data.projects.find(x=>x.id===projectId);
    if(!p) return;
    const selectedPeople = people.filter(pp=>selectedPersonIds.includes(pp.id));
    const personName = selectedPeople.map(pp=>pp.name).join(', ');
    if(!p.vendorMeetings) p.vendorMeetings = {};
    if(!p.vendorMeetings[vid]) p.vendorMeetings[vid] = [];
    if(isEdit){
      const n = p.vendorMeetings[vid].find(x=>x.id===editCtx.note.id);
      if(n){
        n.title = title; n.date = date; n.text = textHtml; n.summary = generateOneLineSummary(plainText);
        n.personIds = selectedPersonIds; n.personId = selectedPersonIds[0] || ''; n.personName = personName;
      }
    } else {
      p.vendorMeetings[vid].unshift({
        id: uid('vm'), title, date, text: textHtml, summary: generateOneLineSummary(plainText),
        personIds: selectedPersonIds, personId: selectedPersonIds[0] || '', personName
      });
    }
    closeModal(); persist(false); render();
    showToast(isEdit?'회의록이 수정되었습니다.':'회의록이 저장되었습니다.');
  });
}

function bindVendorMeetingNoteDetail(pid, vid, mid){
  const editBtn = document.getElementById('editVendorMeetingNoteBtn');
  if(editBtn) editBtn.addEventListener('click', ()=>{
    const proj = state.data.projects.find(x=>x.id===pid);
    const note = proj?.vendorMeetings?.[vid]?.find(x=>x.id===mid);
    if(!note) return;
    closeModal();
    openModal(modalVendorMeetingNoteForm(vid, {projectId: pid, note}));
    bindModalCommon();
    bindVendorMeetingNoteForm(vid, {projectId: pid, note});
  });
  const delBtn = document.getElementById('deleteVendorMeetingNoteBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    if(!confirm('이 회의록을 삭제하시겠습니까?')) return;
    const proj = state.data.projects.find(x=>x.id===pid);
    if(proj?.vendorMeetings?.[vid]){
      proj.vendorMeetings[vid] = proj.vendorMeetings[vid].filter(x=>x.id!==mid);
    }
    persist(false); closeModal(); render();
    showToast('회의록이 삭제되었습니다.');
  });
}

function vendorMeetingsAcrossProjects(vid){
  const rows = [];
  (state.data.projects||[]).forEach(p=>{
    ((p.vendorMeetings||{})[vid]||[]).forEach(m=>rows.push({source:'project', project:p, note:m, date:m.date}));
  });
  (state.data.calendar||[]).forEach(ev=>{
    if((ev.vendorIds||[]).includes(vid)){
      eventMeetingNotes(ev).forEach(n=>rows.push({source:'event', event:ev, note:n, date:n.date||ev.date}));
    }
  });
  return rows.sort((a,b)=>dayjs(b.date).diff(dayjs(a.date)));
}

function htmlFirstLine(html){
  if(!html) return '';
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('div,p,li,br,tr').forEach(el=>{ el.insertAdjacentText('afterend','\n'); });
  const lines = (tmp.textContent||'').split('\n').map(s=>s.trim()).filter(Boolean);
  return lines[0] || '';
}

function generateMeetingSummary(text){
  const sentences = text.split(/[.。\n\r]/).map(s=>s.trim()).filter(Boolean);
  const summary = sentences.slice(0,2).join('. ') + (sentences.length>0?'.':'');
  const actionKeywords = ['필요','예정','하기로','전달','검토','보고','확인','요청','작성'];
  const candidates = sentences.filter(s=> actionKeywords.some(k=>s.includes(k)));
  const items = candidates.slice(0,5).map(s=>({text:s.replace(/^(그리고|또한|그래서)\s*/,''), deadline:''}));
  if(items.length===0 && sentences.length>0){
    items.push({text:sentences[0], deadline:''});
  }
  return {summary: summary || '요약할 내용이 없습니다.', items};
}

function generateVendorTrendInsightsRuleBased(ctx){
  const { selectedYear, thisYearTotal, yoyChange, monthVals, anomalyIdx, concentrationPct, topVendorName, topVendorTotal, avgMonthlyThisYear } = ctx;
  const insights = [];

  if(yoyChange !== null){
    insights.push({
      tag: yoyChange>=0?'상승':'하락', tagColor: yoyChange>=0?'#30A46C':'#E5484D',
      text: `${selectedYear}년 총 구매액이 전년대비 ${Math.abs(yoyChange)}% ${yoyChange>=0?'증가':'감소'}했습니다.`
    });
  }

  if(anomalyIdx && anomalyIdx.length>0){
    anomalyIdx.slice(0,2).forEach(idx=>{
      const cur = monthVals[idx], prev = monthVals[idx-1];
      const pct = prev>0 ? Math.round(((cur-prev)/prev)*1000)/10 : null;
      if(pct!==null){
        insights.push({
          tag:'급변동', tagColor:'#E5484D',
          text:`${idx+1}월 구매액이 전월대비 ${pct>=0?'':''}${pct}% ${pct>=0?'급증':'급감'}했습니다 (전월 $${prev.toLocaleString()} → $${cur.toLocaleString()}).`
        });
      }
    });
  }

  insights.push({
    tag: concentrationPct>=60?'집중 리스크':'양호', tagColor: concentrationPct>=60?'#E5484D':'#30A46C',
    text: concentrationPct>=60
      ? `상위 3개 벤더에 구매가 ${concentrationPct}% 집중되어 있어, 특정 벤더 의존도가 높은 편입니다.`
      : `상위 3개 벤더 비중이 ${concentrationPct}%로 벤더 구성이 비교적 분산되어 있습니다.`
  });

  if(topVendorName){
    insights.push({
      tag:'최다 구매', tagColor:'#3E7BFA',
      text:`전체 누적 기준 가장 많이 구매한 벤더는 "${topVendorName}"이며, 누적 $${topVendorTotal.toLocaleString()}를 기록했습니다.`
    });
  }

  if(avgMonthlyThisYear>0){
    insights.push({
      tag:'평균', tagColor:'#8E4EC6',
      text:`${selectedYear}년 월평균 구매액은 $${avgMonthlyThisYear.toLocaleString()} 수준입니다.`
    });
  }

  return insights.slice(0,5);
}

async function callClaudeVendorTrend(ctx){
  if(!state.anthropicApiKey) return null;
  const digest = {
    선택연도: ctx.selectedYear,
    올해총구매액: ctx.thisYearTotal,
    전년대비증감률: ctx.yoyChange,
    월별구매액: ctx.monthVals,
    급변동월인덱스: ctx.anomalyIdx,
    상위3개벤더집중도: ctx.concentrationPct,
    최다구매벤더: ctx.topVendorName,
    최다구매벤더누적액: ctx.topVendorTotal,
    월평균구매액: ctx.avgMonthlyThisYear,
  };
  const prompt = `다음은 회사의 벤더(공급업체) 구매 데이터 요약(JSON)입니다. 이 데이터를 분석해서 경영진이 참고할 만한 핵심 트렌드 인사이트를 3~5개, 각각 15~50자 내외의 한국어 한 문장으로 작성해줘.\n각 인사이트는 {"tag": "짧은 태그(2~5자, 예: 상승/하락/급변동/집중리스크/양호/최다구매)", "text": "인사이트 문장"} 형태의 객체로, 전체를 JSON 배열로만 출력해. 다른 설명이나 마크다운은 절대 포함하지마.\n\n데이터: ${JSON.stringify(digest)}`;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': state.anthropicApiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-5',
      max_tokens: 1024,
      messages: [{ role: 'user', content: prompt }],
    }),
  });
  if(!res.ok){
    const errBody = await res.text().catch(()=>'');
    throw new Error(`API 오류 (${res.status}): ${errBody.slice(0,200)}`);
  }
  const data = await res.json();
  const textBlock = data.content?.find(b=>b.type==='text');
  if(!textBlock?.text) return null;
  try{
    const raw = textBlock.text.trim();
    const match = raw.match(/\[[\s\S]*\]/); // 앞뒤에 설명/마크다운이 섞여 있어도 배열 부분만 추출
    if(!match){ console.error('Claude 트렌드 분석: JSON 배열을 찾지 못함. 원문:', raw); return null; }
    const arr = JSON.parse(match[0]);
    const tagColors = {'상승':'#30A46C','하락':'#E5484D','급변동':'#E5484D','집중리스크':'#E5484D','양호':'#30A46C','최다구매':'#3E7BFA'};
    return arr.map(it=>({ tag: it.tag||'인사이트', tagColor: tagColors[it.tag]||'#8E4EC6', text: it.text||'' })).filter(it=>it.text);
  }catch(e){ console.error('Claude 트렌드 분석 파싱 실패:', e, textBlock.text); return null; }
}

async function callClaudeSummary(text){
  if(!state.anthropicApiKey) return null;
  const prompt = `다음은 업무 이메일/통화/미팅 원문입니다. 인사말이나 서명은 무시하고, 핵심 요청사항·결정사항·다음 액션이 드러나도록 15~40자 내외의 한국어 한 줄로 요약해줘. 요약 문장 하나만 출력하고 다른 설명은 절대 하지마.\n\n---\n${text.slice(0,4000)}`;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': state.anthropicApiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-5',
      max_tokens: 120,
      messages: [{ role: 'user', content: prompt }],
    }),
  });
  if(!res.ok){
    const errBody = await res.text().catch(()=>'');
    throw new Error(`API 오류 (${res.status}): ${errBody.slice(0,200)}`);
  }
  const data = await res.json();
  const textBlock = data.content?.find(b=>b.type==='text');
  return textBlock?.text?.trim() || null;
}

/* 규칙 기반 폴백 요약 (API 키 없거나 호출 실패 시 사용)
   인사말/서명/기밀고지 등 정보값 낮은 문장은 제외하고, 핵심 키워드나 질문이 담긴 문장을 우선 선택 */
function generateOneLineSummary(text){
  if(!text) return '';
  // 서명 블록/기밀고지 등 뒷부분 통째로 제거 (흔한 마커 기준)
  const cutMarkers = [
    /confidentiality notice/i, /this (message|email) and any attachments/i,
    /sent from my iphone/i, /ios용 outlook/i, /보낸 사람\s*:/,
  ];
  let body = text;
  cutMarkers.forEach(m=>{
    const idx = body.search(m);
    if(idx > 20) body = body.slice(0, idx);
  });

  const rawLines = body.split(/[\n\r]+/).map(s=>s.trim()).filter(Boolean);
  const sentences = [];
  rawLines.forEach(line=>{
    line.split(/(?<=[.?!。])\s+/).forEach(s=>{
      const t = s.trim();
      if(t) sentences.push(t);
    });
  });
  if(sentences.length===0) return '';

  // 인사말/클로징/서명/연락처 라인 등 정보값 낮은 문장 제외
  const skipPatterns = [
    /^(hi|hello|dear|hey)\b/i, /^안녕하세요/, /^(thanks?|thank you|best regards|regards|sincerely|kind regards|cheers)\b[,.]?$/i,
    /^감사합니다[.!]?$/, /드림\s*$/, /^[A-Za-z가-힣\s]{1,15}(드림|올림)$/,
    /^(e|m|tel|mobile|phone|office)\s*[:.]/i, /^\+?\d[\d\-\s()]{6,}$/, /^https?:\/\//i,
    /^[\w.+-]+@[\w-]+\.[\w.]+$/,
  ];
  const candidates = sentences.filter(s => !skipPatterns.some(p=>p.test(s)) && s.length>3);
  const pool = candidates.length>0 ? candidates : sentences;

  // 핵심 키워드/질문 포함 문장 우선순위 부여
  const keywords = ['필요','예정','요청','확인','회신','검토','전달','계약','견적','가격','협의','일정','안내','부탁',
    'please','request','need','confirm','schedule','meeting','quote','price','contract','deadline','follow up','asap','urgent'];
  const scored = pool.map(s=>{
    let score = 0;
    if(/\?$/.test(s)) score += 3;
    keywords.forEach(k=>{ if(s.toLowerCase().includes(k)) score += 2; });
    if(s.length>=15 && s.length<=90) score += 1;
    return {s, score};
  }).sort((a,b)=>b.score-a.score);

  let picked = scored[0]?.s || pool[0];
  if(picked.length>80) picked = picked.slice(0,77)+'...';
  return picked;
}

function bindViewEvents(){

  /* ── 파일 모음 탭 이벤트 ── */

      state.filesPage=0;
      render();
    });

    card.addEventListener('mouseleave',()=>{ const a=card.querySelector('.fc-actions'); if(a) a.style.opacity='0'; });
  });

  // ── 파일 카드 클릭: 선택/해제 토글 ──
  if(!state.filesSelected) state.filesSelected=new Set();

  document.querySelectorAll('.fc-file').forEach(card=>{
    card.addEventListener('click',e=>{
      if(e.target.closest('.fc-actions')) return;
      const fid=card.dataset.fid;
      if(state.filesSelected.has(fid)) state.filesSelected.delete(fid);
      else state.filesSelected.add(fid);
      // 체크박스만 빠르게 업데이트 (re-render 없이)
      const ck=card.querySelector('.fc-check');
      const isSel=state.filesSelected.has(fid);
      if(ck){
        ck.style.opacity=isSel?'1':'0';
        ck.style.background=isSel?'var(--o)':'rgba(255,255,255,.7)';
        ck.style.borderColor=isSel?'var(--o)':'rgba(0,0,0,.25)';
        ck.innerHTML=isSel?'<i class="ti ti-check" style="font-size:11px;color:#fff"></i>':'';
      }
      card.style.background=isSel?'rgba(28,133,232,.12)':'rgba(255,255,255,.72)';
      card.style.border=isSel?'2px solid rgba(28,133,232,.5)':'1px solid rgba(255,255,255,.8)';
      // selBar 업데이트
      const bar=document.getElementById('fcSelBar');
      if(bar){
        if(state.filesSelected.size>0){
          bar.style.display='flex';
          const cnt=bar.querySelector('#fcSelCount');
          if(cnt) cnt.textContent=state.filesSelected.size+'개 선택됨';
        } else {
          bar.style.display='none';
        }
      } else if(state.filesSelected.size>0){
        // 처음 선택 시 selBar 동적 삽입
        const grid=document.getElementById('filesGrid');
        if(grid){
          const div=document.createElement('div');
          div.id='fcSelBar';
          div.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px 14px;background:rgba(28,133,232,.1);border:1px solid rgba(28,133,232,.25);border-radius:12px;grid-column:1/-1';
          div.innerHTML=`<i class="ti ti-checkbox" style="color:var(--o);font-size:16px"></i><span id="fcSelCount" style="font-size:13px;font-weight:600;color:var(--od)">${state.filesSelected.size}개 선택됨</span><span style="font-size:12px;color:var(--muted)">— 내 폴더 카드로 드래그해서 이동</span><button id="fcClearSelBtn" class="btn" style="margin-left:auto;font-size:11px;padding:3px 10px;border-radius:999px">선택 해제</button>`;
          grid.prepend(div);
          div.querySelector('#fcClearSelBtn').addEventListener('click',()=>{
            state.filesSelected.clear();
            render();
          });
        }
      }
    });
    // 호버시 체크박스 노출
    card.addEventListener('mouseenter',()=>{
      const ck=card.querySelector('.fc-check');
      if(ck&&!state.filesSelected.has(card.dataset.fid)) ck.style.opacity='1';
    });
    card.addEventListener('mouseleave',()=>{
      const ck=card.querySelector('.fc-check');
      if(ck&&!state.filesSelected.has(card.dataset.fid)) ck.style.opacity='0';
    });
  });

  // 선택 해제 버튼
  const clearSelBtn=document.getElementById('fcClearSelBtn');
  if(clearSelBtn) clearSelBtn.addEventListener('click',()=>{ state.filesSelected.clear(); render(); });

  // ── 드래그&드롭 ──
  let dragFolderId=null;
  let dragFileIds=new Set(); // 다중 선택 드래그

  // 파일 카드 드래그
  document.querySelectorAll('.fc-file[draggable="true"]').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      dragFolderId=null;
      // 선택된 게 있고 드래그 카드도 선택된 경우 → 다중
      if(state.filesSelected.size>0&&state.filesSelected.has(card.dataset.fid)){
        dragFileIds=new Set(state.filesSelected);
      } else {
        // 단일 드래그 (선택 안 된 카드 드래그)
        dragFileIds=new Set([card.dataset.fid]);
      }
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',card.dataset.fid);
      // 드래그 중인 카드들 흐리게
      document.querySelectorAll('.fc-file').forEach(c=>{
        if(dragFileIds.has(c.dataset.fid)) c.style.opacity='.4';
      });
      // 드래그 고스트 텍스트
      if(dragFileIds.size>1){
        const ghost=document.createElement('div');
        ghost.style.cssText='position:fixed;top:-100px;left:-100px;padding:8px 14px;background:rgba(28,133,232,.9);color:#fff;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap';
        ghost.textContent=dragFileIds.size+'개 선택';
        document.body.appendChild(ghost);
        e.dataTransfer.setDragImage(ghost,0,0);
        setTimeout(()=>ghost.remove(),0);
      }
    });
    card.addEventListener('dragend',()=>{
      document.querySelectorAll('.fc-file').forEach(c=>c.style.opacity='');
      dragFileIds=new Set();
      document.querySelectorAll('.fc-drop-overlay').forEach(o=>o.style.display='none');
    });
  });

  // 폴더 카드 드래그 (폴더 이동)
  document.querySelectorAll('.fc-folder[draggable="true"]').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      dragFolderId=card.dataset.fid;
      dragFileIds=new Set();
      e.dataTransfer.effectAllowed='move';
      card.style.opacity='.5';
    });
    card.addEventListener('dragend',()=>{
      card.style.opacity='';
      dragFolderId=null;
      document.querySelectorAll('.fc-drop-overlay').forEach(o=>o.style.display='none');
    });
  });

  // 폴더 카드: dragover + drop
  document.querySelectorAll('.fc-folder').forEach(card=>{
    const targetFid=card.dataset.fid;
    if(targetFid.startsWith('auto_')) return;

    card.addEventListener('dragover',e=>{
      if(dragFileIds.size===0&&!dragFolderId) return;
      if(dragFolderId===targetFid) return;
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      const ov=card.querySelector('.fc-drop-overlay');
      if(ov) ov.style.display='flex';
    });
    card.addEventListener('dragleave',e=>{
      if(card.contains(e.relatedTarget)) return;
      const ov=card.querySelector('.fc-drop-overlay');
      if(ov) ov.style.display='none';
    });
    card.addEventListener('drop',e=>{
      e.preventDefault();
      const ov=card.querySelector('.fc-drop-overlay');
      if(ov) ov.style.display='none';

      // ── 파일(들) → 폴더 이동 ──
      if(dragFileIds.size>0){
        const targetFolder=findFolder(state.data.fileFolders,targetFid);
        if(!targetFolder) return;
        if(!targetFolder.items) targetFolder.items=[];
        function removeFileFromTree(folders,fid){
          for(const f of folders){
            if(f.items){const i=f.items.indexOf(fid);if(i>-1) f.items.splice(i,1);}
            if(f.children) removeFileFromTree(f.children,fid);
          }
        }
        let movedCount=0;
        dragFileIds.forEach(fid=>{
          removeFileFromTree(state.data.fileFolders,fid);
          if(!targetFolder.items.includes(fid)){targetFolder.items.push(fid);movedCount++;}
        });
        state.filesSelected.clear();
        persist(false);render();
        showToast(`${movedCount}개 파일이 "${targetFolder.name}"으로 이동됐습니다.`);
        return;
      }

      // ── 폴더 → 폴더 이동 ──
      if(dragFolderId&&dragFolderId!==targetFid){
        const dragged=findFolder(state.data.fileFolders,dragFolderId);
        if(!dragged) return;
        function isDesc(f,id){if(f.id===id) return true;return(f.children||[]).some(c=>isDesc(c,id));}
        if(isDesc(dragged,targetFid)){showToast('상위 폴더를 하위로 이동할 수 없습니다.');return;}
        function rmFromTree(folders,id){
          const i=folders.findIndex(f=>f.id===id);if(i>-1) return folders.splice(i,1)[0];
          for(const f of folders){const r=rmFromTree(f.children||[],id);if(r) return r;}return null;
        }
        const moved=rmFromTree(state.data.fileFolders,dragFolderId);
        if(!moved) return;
        const target=findFolder(state.data.fileFolders,targetFid);
        if(!target){state.data.fileFolders.push(moved);}
        else{if(!target.children) target.children=[];target.children.push(moved);}
        persist(false);render();
        showToast(`"${moved.name}"이(가) "${target?.name||'루트'}"으로 이동됐습니다.`);
      }
    });
  });

  // addFolderBtn
  const addFolderBtn=document.getElementById('addFolderBtn');
  if(addFolderBtn) addFolderBtn.addEventListener('click',()=>{
    const pid=(!['root','all','unassigned'].includes(state.filesActiveFolderId||'root')&&!(state.filesActiveFolderId||'').startsWith('auto_'))?state.filesActiveFolderId:null;
    openModal(folderEditModal(null,pid)); bindModalCommon(); bindFolderModal(null,pid);
  });

  // 하위 폴더 추가
  document.querySelectorAll('.folder-add-child-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      openModal(folderEditModal(null,btn.dataset.fid)); bindModalCommon(); bindFolderModal(null,btn.dataset.fid);
    });
  });

  // 폴더 트리 접기/펼치기
  document.querySelectorAll('.files-tree-toggle').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      if(!state.filesOpenFolders) state.filesOpenFolders={};
      const fid=btn.dataset.fid;
      state.filesOpenFolders[fid]=(state.filesOpenFolders[fid]===false)?true:false;
      render();
    });
  });

  // 파일 목록 페이지네이션
  document.querySelectorAll('.files-page-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{ state.filesPage=parseInt(btn.dataset.p); render(); });
  });
  document.querySelectorAll('.folder-edit-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const f=findFolder(state.data.fileFolders,btn.dataset.fid);
      if(!f) return;
      openModal(folderEditModal(f,null)); bindModalCommon(); bindFolderModal(f,null);
    });
  });
  const addItemsBtn=document.getElementById('addItemsToFolderBtn');
  if(addItemsBtn) addItemsBtn.addEventListener('click',()=>{
    const f=state.data.fileFolders.find(x=>x.id===state.filesActiveFolderId);
    if(!f) return;
    openModal(folderAddItemsModal(f)); bindModalCommon();
    document.getElementById('folderItemsSaveBtn').addEventListener('click',()=>{
      f.items=[...document.querySelectorAll('.folder-item-cb:checked')].map(cb=>cb.value);
      closeModal(); persist(false); render(); showToast('폴더가 업데이트됐습니다.');
    });
  });
  document.querySelectorAll('.files-doc-open').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const it=findFileItemById(btn.dataset.id);
      if(it) openDocEditorFiles(it.target,it.link);
    });
  });
  document.querySelectorAll('.files-doc-dl').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const it=findFileItemById(btn.dataset.id);
      if(it?.link) downloadDocAsWord(it.link.label,it.link.content);
    });
  });

  // 홈/리스트 -> 상세 이동 링크들
  document.querySelectorAll('.vendor-link, .vendor-row').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.selectedVendorId = el.dataset.vid;
      state.activeBrandId = el.dataset.bid || null;
      state.view = 'vendors';
      state.vendorProjectPage = 0;
      state.vendorPastEventPage = 0;
      state.vendorFileLinkPage = 0;
      render();
    });
  });
  document.querySelectorAll('.proj-link, .proj-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.selectedProjectId = el.dataset.pid;
      state.view = 'projects';
      state.projChecklistShowAll = false;
      state.projPastEventPage = 0;
      state.projFileLinkPage = 0;
      render();
    });
  });

  document.querySelectorAll('.proj-col-more-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      openModal(modalProjectStatusList(el.dataset.status));
      bindModalCommon();
      document.querySelectorAll('.modal-proj-link').forEach(item=>{
        item.addEventListener('click', ()=>{
          state.selectedProjectId = item.dataset.pid;
          state.view = 'projects';
          state.projChecklistShowAll = false;
          state.projPastEventPage = 0;
          state.projFileLinkPage = 0;
          closeModal();
          render();
        });
      });
    });
  });

  // 프로젝트 카드 드래그 앤 드롭 (상태 변경 + 순서 변경)
  if(!isReadOnly()){
    let dragPid = null;
    document.querySelectorAll('.proj-card[draggable="true"]').forEach(card=>{
      card.addEventListener('dragstart', e=>{
        dragPid = card.dataset.pid;
        card.style.opacity = '.4';
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', ()=>{
        card.style.opacity = '';
        document.querySelectorAll('.proj-card').forEach(c=>c.style.borderTop='');
      });
      card.addEventListener('dragover', e=>{
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        card.style.borderTop = '2px solid var(--o)';
      });
      card.addEventListener('dragleave', ()=>{ card.style.borderTop=''; });
      card.addEventListener('drop', e=>{
        e.preventDefault();
        card.style.borderTop = '';
        if(!dragPid || dragPid===card.dataset.pid) return;
        const targetPid = card.dataset.pid;
        const targetStatus = card.closest('.proj-col-list').dataset.status;
        const list = state.data.projects;
        const dragIdx = list.findIndex(p=>p.id===dragPid);
        if(dragIdx<0) return;

    regenVendorTrendBtn.disabled = true;
    const origHtml = regenVendorTrendBtn.innerHTML;
    regenVendorTrendBtn.innerHTML = '<i class="ti ti-loader-2"></i> 분석 중...';
    try{
      const { yearTotals, vendorTotals, monthlyByYear } = computeVendorAnalyticsData();
      const currentYearNum = Number(dayjs().format('YYYY'));
      const currentMonthNum = Number(dayjs().format('M'));
      const yearsWithData = Object.keys(yearTotals).map(Number).sort((a,b)=>b-a);
      const selectedYear = state.vendorAnalyticsYear && yearTotals[state.vendorAnalyticsYear]!==undefined
        ? state.vendorAnalyticsYear
        : (yearsWithData.includes(currentYearNum) ? currentYearNum : (yearsWithData[0] || currentYearNum));
      const thisYearTotal = yearTotals[selectedYear]||0;
      const prevYearTotal = yearTotals[selectedYear-1]||0;
      const yoyChange = prevYearTotal>0 ? Math.round(((thisYearTotal-prevYearTotal)/prevYearTotal)*1000)/10 : null;
      const monthCount = selectedYear===currentYearNum ? currentMonthNum : 12;
      const selMonths = monthlyByYear[selectedYear]||{};
      const monthVals = []; for(let m=1;m<=monthCount;m++) monthVals.push(selMonths[m]||0);
      const anomalyIdx = [];
      for(let i=1;i<monthVals.length;i++){ const prev=monthVals[i-1]; if(prev>0){ const chg=((monthVals[i]-prev)/prev)*100; if(Math.abs(chg)>=40) anomalyIdx.push(i); } }
      const allTimeTotal = Object.values(yearTotals).reduce((a,b)=>a+b,0);
      const allRanked = Object.entries(vendorTotals).sort((a,b)=>b[1]-a[1]);
      const top3Total = allRanked.slice(0,3).reduce((a,[,t])=>a+t,0);
      const concentrationPct = allTimeTotal>0 ? Math.round((top3Total/allTimeTotal)*1000)/10 : 0;
      const topEntry = allRanked[0];
      const vendorsList = (state.data.vendors||[]).filter(v=>(v.companyType||'벤더')==='벤더');
      const topVendorName = topEntry ? (vendorsList.find(x=>x.id===topEntry[0])||{}).name : null;
      const topVendorTotal = topEntry ? topEntry[1] : 0;
      const selMonthKeysWithData = Object.keys(selMonths).filter(m=>selMonths[m]>0);
      const avgMonthlyThisYear = selMonthKeysWithData.length>0 ? Math.round(thisYearTotal/selMonthKeysWithData.length) : 0;

      const ctx = { selectedYear, thisYearTotal, yoyChange, monthVals, anomalyIdx, concentrationPct, topVendorName, topVendorTotal, avgMonthlyThisYear };
      const result = await callClaudeVendorTrend(ctx);
      if(result && result.length>0){
        state.vendorTrendInsightsClaude = result;
        state.vendorTrendInsightsClaudeYear = selectedYear;
        showToast('Claude AI 트렌드 분석이 생성되었습니다.');
      } else {
        showToast('AI 응답이 비어있어 규칙 기반 분석을 사용합니다.');
      }
    }catch(err){
      console.error(err);
      showToast('AI 분석 실패: ' + (err.message||'').slice(0,100));
    }finally{
      render();
    }
  });

            const positive = pct>=0;
            changeBadgeEl.style.display = 'inline';
            changeBadgeEl.style.color = positive?'#30A46C':'#E5484D';
            changeBadgeEl.textContent = (positive?'↑ ':'↓ ')+Math.abs(pct)+'%';

          }

          compareRowEl.style.display = 'none';
          changeBadgeEl.style.display = 'none';
        }
        const leftPct = (pt[0]/700)*100;
        const topPct = (pt[1]/H)*100;
        tooltip.style.left = leftPct+'%';
        tooltip.style.top = topPct+'%';
      });

function moveCalendarEventToDate(eid, newDate){
  if(eid.startsWith('deadline_')){
    const pid = eid.slice('deadline_'.length);
    const p = state.data.projects.find(x=>x.id===pid);
    if(p){ p.deadline = newDate; return {ok:true, label:'프로젝트 마감일'}; }
    return {ok:false};
  }
  if(eid.startsWith('ck_')){
    const cid = eid.slice('ck_'.length);
    for(const p of state.data.projects){
      const item = (p.checklist||[]).find(c=>c.id===cid);
      if(item){ item.dueDate = newDate; return {ok:true, label:'체크리스트 마감일'}; }
    }
    return {ok:false};
  }
  if(eid.startsWith('log_')){
    const lid = eid.slice('log_'.length);
    const log = state.data.vendorLogs.find(x=>x.id===lid);
    if(log){ log.nextStepDue = newDate; return {ok:true, label:'다음 액션 마감일'}; }
    return {ok:false};
  }
  if(eid.startsWith('leave_') || eid.startsWith('holiday_')){
    return {ok:false};
  }
  const ev = state.data.calendar.find(x=>x.id===eid);
  if(ev){ ev.date = newDate; return {ok:true, label:'일정'}; }
  return {ok:false};
}

  // 캘린더 이벤트 드래그 앤 드롭 → 날짜(마감일) 변경
  if(!isReadOnly()){
    document.querySelectorAll('.cal-ev[draggable="true"]').forEach(el=>{
      el.addEventListener('dragstart', e=>{
        e.dataTransfer.setData('text/plain', el.dataset.eid);
        e.dataTransfer.effectAllowed = 'move';
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', ()=>{
        el.classList.remove('dragging');
      });
    });

    document.querySelectorAll('.cal-cell[data-date]').forEach(el=>{
      el.addEventListener('dragover', e=>{
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        el.classList.add('drag-over');
      });
      el.addEventListener('dragleave', ()=>{
        el.classList.remove('drag-over');
      });
      el.addEventListener('drop', e=>{
        e.preventDefault();
        el.classList.remove('drag-over');
        const eid = e.dataTransfer.getData('text/plain');
        if(!eid) return;
        const newDate = el.dataset.date;
        const result = moveCalendarEventToDate(eid, newDate);
        if(result.ok){
          persist(false);
          render();
          showToast(`${result.label}이(가) ${fmtDate(newDate)}(으)로 변경되었습니다.`);
        }
      });
    });
  }

function bindChecklistDetailForm(item){
  const typeSel = document.getElementById('assigneeTypeSelect');
  typeSel.addEventListener('change', ()=>{
    document.getElementById('assigneeInternalField').style.display = typeSel.value==='internal' ? 'block' : 'none';
    document.getElementById('assigneeExternalField').style.display = typeSel.value==='external' ? 'block' : 'none';
  });

  const internalPeople = getInternalPeople();
  const initialInternalIds = item.assigneeType==='internal'
    ? (item.assigneeIds && item.assigneeIds.length ? item.assigneeIds : (item.assigneeId ? internalPeople.filter(p=>p.name===item.assigneeId).map(p=>p.id) : []))
    : [];
  const internalTrigger = document.getElementById('ckInternalAssigneeTrigger');
  let internalAssigneeAPI = null;
  if(internalTrigger) internalAssigneeAPI = bindMultiPersonSelect(internalTrigger, internalPeople, initialInternalIds);

  let attachments = (item.attachments||[]).slice();
  document.getElementById('addAttachmentBtn').addEventListener('click', ()=>{
    const list = document.getElementById('attachmentList');
    const idx = list.children.length;
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; gap:6px; align-items:center;';
    row.innerHTML = `<input type="text" class="attachment-input" placeholder="https://..." style="flex:1;"/><i class="ti ti-x remove-attachment" style="cursor:pointer; color:var(--text-muted);"></i>`;
    list.appendChild(row);
    row.querySelector('.remove-attachment').addEventListener('click', ()=> row.remove());
  });
  document.querySelectorAll('.remove-attachment').forEach(el=>{
    el.addEventListener('click', ()=> el.closest('div').remove());
  });

  document.getElementById('checklistDetailForm').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const p = state.data.projects.find(x=>x.id===state.selectedProjectId);
    const target = p.checklist.find(c=>c.id===item.id);
    target.text = fd.get('text');
    target.status = fd.get('status');
    target.priority = fd.get('priority');
    target.startDate = fd.get('startDate')||'';
    target.dueDate = fd.get('dueDate')||'';
    target.requester = fd.get('requester')||'';
    target.done = fd.get('status')==='완료';
    const aType = fd.get('assigneeType');
    target.assigneeType = aType;
    if(aType==='internal'){
      const selectedIds = internalAssigneeAPI ? internalAssigneeAPI.getSelected() : [];
      target.assigneeIds = selectedIds;
      target.assigneeId = internalPeople.filter(pp=>selectedIds.includes(pp.id)).map(pp=>pp.name).join(', ');
    } else if(aType==='external'){
      target.assigneeIds = [];
      target.assigneeId = fd.get('assigneeExternal')||'';
    } else {
      target.assigneeIds = [];
      target.assigneeId = '';
    }
    target.attachments = Array.from(document.querySelectorAll('.attachment-input')).map(i=>i.value.trim()).filter(Boolean);
    closeModal(); persist(true); showToast('체크리스트 항목이 저장되었습니다.');
  });
  const deleteBtn = document.getElementById('deleteChecklistBtn');
  if(deleteBtn) deleteBtn.addEventListener('click', ()=>{
    if(confirm('이 항목을 삭제하시겠습니까?')){
      const p = state.data.projects.find(x=>x.id===state.selectedProjectId);
      p.checklist = p.checklist.filter(c=>c.id!==item.id);
      closeModal(); persist(true); showToast('항목이 삭제되었습니다.');
    }
  });
}

function bindVendorFormSubmit(existingVendor){
  document.getElementById('vendorForm').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const nameVal = (fd.get('name')||'').trim();
    const updates = {
      name: nameVal,
      priority: fd.get('priority'),
      companyType: fd.get('companyType') || '벤더',
      contact:{name:fd.get('contactName'), title:fd.get('contactTitle'), email:fd.get('contactEmail'), phone:fd.get('contactPhone')},
      notes:{discount:fd.get('discount'), payment:fd.get('payment'), moq:fd.get('moq'), creditLimit:fd.get('creditLimit')}
    };

    const doSave = ()=>{
      if(existingVendor){
        const idx = state.data.vendors.findIndex(v=>v.id===existingVendor.id);
        // 기존 데이터(people, customNotes, logoUrl, companyStatus 등) 보존하고 편집 필드만 업데이트
        state.data.vendors[idx] = { ...state.data.vendors[idx], ...updates };
      } else {
        state.data.vendors.push({
          id: uid('v'),
          status: '전송',
          actionStatus: '',
          companyStatus: 'Active',
          people: [],
          customNotes: [],
          ...updates
        });
      }
      closeModal(); persist(false); showToast('회사 정보가 저장되었습니다.');
    };

    // 신규 등록 시 동일 이름의 거래처가 이미 있으면 경고 모달 표시
    if(!existingVendor && nameVal){
      const dup = state.data.vendors.find(v=>(v.name||'').trim().toLowerCase()===nameVal.toLowerCase());
      if(dup){
        openModal(`
          <div class="modal" style="max-width:400px">
            <div class="mh"><h3>중복된 거래처</h3><button class="btn btn-g close-x" id="closeDupModal"><i class="ti ti-x"></i></button></div>
            <div class="mb">
              <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:18px">
                <span style="width:36px;height:36px;border-radius:10px;background:#F0883E1a;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-alert-triangle" style="font-size:18px;color:#F0883E"></i></span>
                <div style="font-size:13px;color:var(--text);line-height:1.6">"<b>${dup.name}</b>" 이름으로 이미 등록된 거래처가 있습니다.<br/>그래도 새로 추가하시겠어요?</div>
              </div>
              <div style="display:flex;gap:8px;justify-content:flex-end">
                <button type="button" class="btn" id="cancelDupBtn">취소</button>
                <button type="button" class="btn btn-o" id="proceedDupBtn">그래도 추가</button>
              </div>
            </div>
          </div>
        `);
        document.getElementById('closeDupModal').addEventListener('click', closeModal);
        document.getElementById('cancelDupBtn').addEventListener('click', closeModal);
        document.getElementById('proceedDupBtn').addEventListener('click', ()=>{
          closeModal();
          doSave();
        });
        return;
      }
    }

    doSave();
  });
  // 모달 내 삭제 버튼 (편집 모달에서)
  const deleteBtn = document.getElementById('deleteVendorBtn');
  if(deleteBtn && existingVendor) deleteBtn.addEventListener('click', ()=>{
    if(confirm(`"${existingVendor.name}"을(를) 삭제하시겠습니까?\n연결된 로그 데이터는 유지됩니다.`)){
      state.data.vendors = state.data.vendors.filter(v=>v.id!==existingVendor.id);
      state.selectedVendorId = null;
      closeModal(); persist(false); render(); showToast('삭제되었습니다.');
    }
  });
}

function bindProjectFormSubmit(existingProject){
  const p = existingProject || {owner:'천세나'};
  const internalPeople = getInternalPeople();
  const ownerNames = (p.owner||'').split(',').map(s=>s.trim()).filter(Boolean);
  const initialOwnerIds = internalPeople.filter(pp=>ownerNames.includes(pp.name)).map(pp=>pp.id);
  const ownerTrigger = document.getElementById('projOwnerTrigger');
  let ownerSelectAPI = null;
  if(ownerTrigger) ownerSelectAPI = bindMultiPersonSelect(ownerTrigger, internalPeople, initialOwnerIds);

  // 벤더 검색 필터
  const searchInput = document.getElementById('vendorSearchModal');
  if(searchInput) searchInput.addEventListener('input', e=>{
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.vendor-check-row').forEach(row=>{
      row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });

  // 선택 카운트 업데이트
  document.querySelectorAll('input[name="vendorIds"]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const count = document.querySelectorAll('input[name="vendorIds"]:checked').length;
      const el = document.getElementById('selectedVendorCount');
      if(el) el.textContent = count > 0 ? `${count}개 선택됨` : '선택 안함';
    });
  });

  document.getElementById('projectForm').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    let category = fd.get('category');
    if(category==='__new__'){
      const nc = (fd.get('newCategory')||'').trim();
      category = nc || '기타';
      if(nc && !state.data.categories.includes(nc)) state.data.categories.push(nc);
    }
    const vendorIds = Array.from(document.querySelectorAll('input[name="vendorIds"]:checked')).map(cb=>cb.value);
    const selectedOwnerIds = ownerSelectAPI ? ownerSelectAPI.getSelected() : [];
    const ownerName = internalPeople.filter(pp=>selectedOwnerIds.includes(pp.id)).map(pp=>pp.name).join(', ') || '천세나';
    const obj = {
      id: existingProject ? existingProject.id : uid('p'),
      title: fd.get('title'), category, owner: ownerName, ownerIds: selectedOwnerIds,
      deadline: fd.get('deadline')||'',
      vendorIds,
      vendorId: vendorIds[0]||'', // 하위 호환성 유지
      checklist: existingProject ? existingProject.checklist : [],
      meetingNotes: existingProject ? existingProject.meetingNotes : [],
      logs: existingProject ? (existingProject.logs||[]) : [],
      vendorLogs: existingProject ? (existingProject.vendorLogs||{}) : {} // 벤더별 로그 맵
    };
    if(existingProject){
      const idx = state.data.projects.findIndex(p=>p.id===existingProject.id);
      state.data.projects[idx] = obj;
    } else {
      state.data.projects.push(obj);
    }
    closeModal(); persist(false); showToast('프로젝트가 저장되었습니다.');
  });

  const deleteBtn = document.getElementById('deleteProjectBtn');
  if(deleteBtn) deleteBtn.addEventListener('click', ()=>{
    if(confirm('이 프로젝트를 삭제하시겠습니까?')){
      state.data.projects = state.data.projects.filter(p=>p.id!==existingProject.id);
      state.selectedProjectId = null;
      closeModal(); persist(false); showToast('프로젝트가 삭제되었습니다.');
    }
  });
}
