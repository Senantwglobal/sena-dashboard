function bindEventMeetingNoteForm(eid, noteId){
  const saveBtn = document.getElementById('emnSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const title = document.getElementById('emnTitle').value.trim();
    const text = document.getElementById('emnText').value.trim();
    const date = document.getElementById('emnDate').value;
    if(!title){ showToast('회의록 제목을 입력해주세요.'); return; }
    if(!text){ showToast('회의 내용을 입력해주세요.'); return; }
    const ev = state.data.calendar.find(x=>x.id===eid);
    if(!ev) return;
    if(!ev.meetingNotes) ev.meetingNotes = [];
    if(noteId){
      const n = ev.meetingNotes.find(x=>x.id===noteId);
      if(n){ n.title = title; n.text = text; n.date = date; n.summary = generateOneLineSummary(text); }
    } else {
      ev.meetingNotes.unshift({id: uid('emn'), title, text, date, summary: generateOneLineSummary(text)});
    }
    persist(false);
    closeModal();
    openModal(modalEventDetail(ev));
    bindModalCommon();
    bindEventDetailModal(eid);
    render();
    showToast('회의록이 저장되었습니다.');
  });
}

function modalAllMeetingNotes(){
  const allRows = [];
  (state.data.calendar||[]).forEach(e=>{
    eventMeetingNotes(e).forEach(n=>allRows.push({ev:e, note:n}));
  });
  allRows.sort((a,b)=>(b.note.date||b.ev.date||'').localeCompare(a.note.date||a.ev.date||''));

  const years = Array.from(new Set(allRows.map(r=>{
    const d = r.note.date || r.ev.date || '';
    return d ? d.slice(0,4) : null;
  }).filter(Boolean))).sort((a,b)=>b.localeCompare(a));

  const yf = state.meetingNotesYearFilter;
  const rows = yf ? allRows.filter(r=>{
    const d = r.note.date || r.ev.date || '';
    return d.slice(0,4) === yf;
  }) : allRows;

  const yearTabsHtml = years.length>0 ? `
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      <button class="btn meeting-year-filter-btn ${!yf?'btn-o':''}" data-year="" style="font-size:11px;padding:4px 10px">전체</button>
      ${years.map(y=>`<button class="btn meeting-year-filter-btn ${yf===y?'btn-o':''}" data-year="${y}" style="font-size:11px;padding:4px 10px">${y}년</button>`).join('')}
    </div>` : '';

  return `
    <div class="modal" style="width:640px">
      <div class="mh"><h3><i class="ti ti-notes" style="color:var(--o)"></i> 회의록 모아보기</h3><button class="btn btn-g close-x" id="closeModal"><i class="ti ti-x"></i></button></div>
      <div class="mb">
        ${yearTabsHtml}
        ${rows.length===0
          ? `<div class="empty-state" style="padding:24px">${yf?`${yf}년에 작성된 회의록이 없습니다.`:'아직 작성된 회의록이 없습니다. 일정 상세에서 회의록을 작성해보세요.'}</div>`
          : `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px">
              ${rows.map(({ev:e, note:n})=>{
                const c = eventColor(e.type);
                return `<div class="meeting-note-card-btn" data-eid="${e.id}" data-mid="${n.id}" style="border:0.5px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer;background:#fff;display:flex;flex-direction:column;gap:6px;min-height:96px">
                  <div style="font-size:11px;color:var(--o);font-weight:300;display:flex;align-items:center;gap:5px">
                    <i class="ti ti-calendar" style="font-size:11px"></i>${fmtDateDow(n.date||e.date)}
                  </div>
                  <div style="font-size:12px;font-weight:300;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(n.title||'제목 없음').replace(/</g,'&lt;')}</div>
                  <div style="font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.title}</div>
                  <div style="font-size:11px;line-height:1.5;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${(n.summary||n.text||'').replace(/</g,'&lt;')}</div>
                </div>`;
              }).join('')}
            </div>`}
      </div>
    </div>
  `;
}

function bindAllMeetingNotesModal(){
  document.querySelectorAll('.meeting-year-filter-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.meetingNotesYearFilter = btn.dataset.year || null;
      closeModal();
      openModal(modalAllMeetingNotes());
      bindModalCommon();
      bindAllMeetingNotesModal();
    });
  });
}

function modalEventDetail(ev){
  const c = eventColor(ev.type);
  const vendorIds = ev.vendorIds && ev.vendorIds.length ? ev.vendorIds : (ev.vendorId ? [ev.vendorId] : []);
  const evVendors = vendorIds.map(vid=>state.data.vendors.find(v=>v.id===vid)).filter(Boolean);
  const personIds = ev.attendeePersonIds && ev.attendeePersonIds.length ? ev.attendeePersonIds : (ev.attendeePersonId ? [ev.attendeePersonId] : []);
  const proj = ev.projectId ? state.data.projects.find(p=>p.id===ev.projectId) : null;
  const eventNotes = eventMeetingNotes(ev);

  const vendorPill = v => `<span style="display:inline-flex;align-items:center;gap:6px;background:var(--sf);padding:3px 12px 3px 4px;border-radius:20px;font-size:12px;font-weight:300;margin:2px 5px 2px 0">${av(v.name,20)}${v.name}</span>`;
  const vendorPillsHtml = evVendors.map(vendorPill).join('');

  const personGroups = evVendors
    .map(v=>({vendor:v, people: personIds.map(pid=>(v.people||[]).find(x=>x.id===pid)).filter(Boolean)}))
    .filter(g=>g.people.length>0);
  const personPill = p => `<span style="display:inline-flex;align-items:center;background:var(--ol);color:var(--od);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:300;margin:2px 4px 2px 0">${p.name}${p.title?` <span style="opacity:.7;font-weight:300;margin-left:3px">(${p.title})</span>`:''}</span>`;
  const personGroupsHtml = personGroups.map(g=>`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap">
      ${vendorPill(g.vendor)}
      <div style="display:flex;flex-wrap:wrap">${g.people.map(personPill).join('')}</div>
    </div>`).join('');

  const row = (icon, label, value) => value ? `
    <div style="display:flex;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--bd)">
      <i class="ti ${icon}" style="font-size:14px;color:var(--muted);flex-shrink:0;margin-top:1px"></i>
      <div style="flex:1;min-width:0">
        <div style="font-size:10px;color:var(--muted);margin-bottom:4px">${label}</div>
        <div style="font-size:13px;color:var(--text);line-height:1.5">${value}</div>
      </div>
    </div>` : '';

  return `
    <div class="modal">
      <div class="mh">
        <h3 style="display:flex;align-items:center;gap:8px">
          <span style="width:9px;height:9px;border-radius:50%;background:${c.dot};flex-shrink:0"></span>
          ${ev.title}
        </h3>
        <button class="btn btn-g close-x" id="closeModal"><i class="ti ti-x"></i></button>
      </div>
      <div class="mb">
        <span style="font-size:11px;padding:3px 10px;border-radius:20px;background:${c.bg};color:${c.text};font-weight:300">${ev.type}</span>
        <div style="margin-top:8px">
          ${row('ti-calendar','날짜', fmtDateDow(ev.date))}
          ${row('ti-clock','시간', ev.allDay ? '종일' : (ev.time||''))}
          ${row('ti-map-pin','장소', ev.location)}
          ${row('ti-clipboard-list','연결 프로젝트', proj?proj.title:'')}
          ${row('ti-building-store','관련 거래처', vendorPillsHtml)}
          ${row('ti-user','담당자', personGroupsHtml)}
          ${row('ti-users','추가 참석자', ev.attendees)}
          ${row('ti-note','메모', ev.memo ? ev.memo.replace(/\\n/g,'<br/>') : '')}
        </div>

        <div style="margin-top:6px;border-top:0.5px solid var(--bd);padding-top:12px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <span style="font-size:11px;font-weight:300;color:var(--muted);text-transform:uppercase;letter-spacing:.05em"><i class="ti ti-notes" style="font-size:12px"></i> 회의록${eventNotes.length>0?` <span style="font-size:10px;background:var(--sf);color:var(--muted);padding:1px 6px;border-radius:10px">${eventNotes.length}</span>`:''}</span>
            ${!isReadOnly()?`<button class="btn btn-o" id="addEventMeetingNoteBtn" data-eid="${ev.id}" style="font-size:10px;padding:3px 9px"><i class="ti ti-plus"></i> 추가</button>`:''}
          </div>
          ${eventNotes.length===0
            ? `<div style="font-size:12px;color:var(--muted)">아직 작성된 회의록이 없습니다.</div>`
            : `<div style="display:flex;flex-direction:column;gap:8px">
                ${eventNotes.map(n=>`
                <div class="meeting-note-card-btn" data-eid="${ev.id}" data-mid="${n.id}" style="border:0.5px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer;background:#fff;display:flex;flex-direction:column;gap:5px">
                  <div style="font-size:11px;color:var(--o);font-weight:300;display:flex;align-items:center;gap:5px">
                    <i class="ti ti-calendar" style="font-size:11px"></i>${fmtDateDow(n.date||ev.date)}
                  </div>
                  <div style="font-size:13px;font-weight:300;color:var(--text)">${(n.title||'제목 없음').replace(/</g,'&lt;')}</div>
                  <div style="font-size:12px;line-height:1.5;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${(n.summary||n.text||'').replace(/</g,'&lt;')}</div>
                </div>`).join('')}
              </div>`}
        </div>
      </div>
      ${!isReadOnly()?`<div class="mf">
        <button type="button" id="detailDeleteEventBtn" class="btn btn-red"><i class="ti ti-trash"></i> 삭제</button>
        <button type="button" id="detailEditEventBtn" class="btn btn-o"><i class="ti ti-pencil"></i> 수정</button>
      </div>`:''}
    </div>
  `;
}

function bindEventDetailModal(eid){
  const editBtn = document.getElementById('detailEditEventBtn');
  if(editBtn) editBtn.addEventListener('click', ()=>{
    const evData = state.data.calendar.find(x=>x.id===eid);
    if(!evData) return;
    openModal(modalEditEvent(evData));
    bindModalCommon();
    bindEditEventModal(eid);
  });
  const delBtn = document.getElementById('detailDeleteEventBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    if(confirm('이 일정을 삭제하시겠습니까?')){
      state.data.calendar = state.data.calendar.filter(x=>x.id!==eid);
      closeModal(); persist(false); render(); showToast('일정이 삭제되었습니다.');
    }
  });

  const addEventMeetingNoteBtn = document.getElementById('addEventMeetingNoteBtn');
  if(addEventMeetingNoteBtn) addEventMeetingNoteBtn.addEventListener('click', ()=>{
    closeModal();
    openModal(modalEventMeetingNoteForm(eid, null));
    bindModalCommon();
    bindEventMeetingNoteForm(eid, null);
  });
}

function bindEditEventModal(eid){
  bindVendorPersonChecklists('evVendorCheckListEdit', 'evPersonCheckListEdit', 'evVendorSearchEdit');

  const multiDayCheckEdit = document.getElementById('multiDayCheckEdit');
  const endDateFieldEdit = document.getElementById('endDateFieldEdit');
  const eventDateEdit = document.getElementById('eventDateEdit');
  const eventEndDateEdit = document.getElementById('eventEndDateEdit');
  if(multiDayCheckEdit) multiDayCheckEdit.addEventListener('change', ()=>{
    endDateFieldEdit.style.display = multiDayCheckEdit.checked ? '' : 'none';
    if(multiDayCheckEdit.checked && eventEndDateEdit.value < eventDateEdit.value) eventEndDateEdit.value = eventDateEdit.value;
  });
  if(eventDateEdit) eventDateEdit.addEventListener('change', ()=>{
    if(eventEndDateEdit.value < eventDateEdit.value) eventEndDateEdit.value = eventDateEdit.value;
  });

  document.getElementById('editEventForm').addEventListener('submit', e2=>{
    e2.preventDefault();
    const fd = new FormData(e2.target);
    const idx = state.data.calendar.findIndex(x=>x.id===eid);
    if(idx!==-1){
      const vendorIds = Array.from(document.querySelectorAll('#evVendorCheckListEdit .ev-vendor-cb:checked')).map(cb=>cb.value);
      const attendeePersonIds = Array.from(document.querySelectorAll('#evPersonCheckListEdit .ev-person-cb:checked')).map(cb=>cb.value);
      const isMultiDay = multiDayCheckEdit?.checked || false;
      const startDate = fd.get('date');
      let endDate = isMultiDay ? (fd.get('endDate')||startDate) : '';
      if(endDate && endDate < startDate) endDate = startDate;
      state.data.calendar[idx] = {
        ...state.data.calendar[idx],
        date: startDate,
        endDate,
        type: fd.get('type'),
        title: fd.get('title'),
        allDay: document.getElementById('allDayCheckEdit')?.checked||false,
        startTime: fd.get('startTime')||'',
        endTime: fd.get('endTime')||'',
        time: document.getElementById('allDayCheckEdit')?.checked ? '종일' : (fd.get('startTime')||(fd.get('endTime')?fd.get('startTime')+'~'+fd.get('endTime'):'')),
        vendorIds, vendorId: vendorIds[0]||'',
        attendeePersonIds, attendeePersonId: attendeePersonIds[0]||'',
        projectId: fd.get('projectId')||'',
        location: fd.get('location')||'',
        attendees: fd.get('attendees')||'',
        memo: fd.get('memo')||''
      };
    }
    closeModal(); persist(false); render(); showToast('일정이 수정되었습니다.');
  });
  const delBtn = document.getElementById('deleteEventBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    if(confirm('이 일정을 삭제하시겠습니까?')){
      state.data.calendar = state.data.calendar.filter(x=>x.id!==eid);
      closeModal(); persist(false); render(); showToast('일정이 삭제되었습니다.');
    }
  });
}

function bindEventFormSubmit(){
  bindVendorPersonChecklists('evVendorCheckListNew', 'evPersonCheckListNew', 'evVendorSearchNew');

  const multiDayCheckNew = document.getElementById('multiDayCheckNew');
  const endDateFieldNew = document.getElementById('endDateFieldNew');
  const eventDateNew = document.getElementById('eventDateNew');
  const eventEndDateNew = document.getElementById('eventEndDateNew');
  if(multiDayCheckNew) multiDayCheckNew.addEventListener('change', ()=>{
    endDateFieldNew.style.display = multiDayCheckNew.checked ? '' : 'none';
    if(multiDayCheckNew.checked && eventEndDateNew.value < eventDateNew.value) eventEndDateNew.value = eventDateNew.value;
  });
  if(eventDateNew) eventDateNew.addEventListener('change', ()=>{
    if(eventEndDateNew.value < eventDateNew.value) eventEndDateNew.value = eventDateNew.value;
  });

  document.getElementById('eventForm').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const allDay = document.getElementById('allDayCheckNew')?.checked || false;
    const startTime = fd.get('startTime')||'';
    const endTime = fd.get('endTime')||'';
    const timeLabel = allDay ? '종일' : startTime ? (endTime ? startTime+'~'+endTime : startTime) : '';
    const vendorIds = Array.from(document.querySelectorAll('#evVendorCheckListNew .ev-vendor-cb:checked')).map(cb=>cb.value);
    const attendeePersonIds = Array.from(document.querySelectorAll('#evPersonCheckListNew .ev-person-cb:checked')).map(cb=>cb.value);
    const isMultiDay = multiDayCheckNew?.checked || false;
    const startDate = fd.get('date');
    let endDate = isMultiDay ? (fd.get('endDate')||startDate) : '';
    if(endDate && endDate < startDate) endDate = startDate;
    state.data.calendar.push({
      id: uid('ev'), date: startDate, endDate, type: fd.get('type'), title: fd.get('title'),
      time: timeLabel, startTime, endTime, allDay,
      vendorIds, vendorId: vendorIds[0]||'',
      attendeePersonIds, attendeePersonId: attendeePersonIds[0]||'',
      projectId: fd.get('projectId')||'',
      location: fd.get('location')||'', attendees: fd.get('attendees')||'', memo: fd.get('memo')||''
    });
    closeModal(); persist(false); render(); showToast('일정이 등록되었습니다.');
  });
}

function bindDayDetailEvents(dateStr){
  document.querySelectorAll('.day-event-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const eid = el.dataset.eid;
      const evData = state.data.calendar.find(x=>x.id===eid);
      if(evData){
        closeModal();
        openModal(modalEventDetail(evData));
        bindModalCommon();
        bindEventDetailModal(eid);
      } else if(eid.startsWith('log_')){
        const logId = eid.slice(4);
        const log = state.data.vendorLogs.find(x=>x.id===logId);
        if(log){
          const vendor = state.data.vendors.find(x=>x.id===log.vendorId);
          closeModal();
          openModal(modalLogDetail(log, vendor?vendor.name:''));
          bindModalCommon();
        }
      } else if(el.dataset.projectid){
        state.selectedProjectId = el.dataset.projectid;
        state.view = 'projects';
        closeModal(); render();
      }
    });
  });
  const addBtn = document.getElementById('addEventFromDayBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    closeModal();
    openModal(modalEventForm(dateStr));
    bindModalCommon();
    bindEventFormSubmit();
  });
}

function renderMeetingResult(result, originalText){
  const resultDiv = document.getElementById('mnResult');
  resultDiv.innerHTML = `
    <div style="border-top:0.5px solid var(--border); padding-top:14px;">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
        <i class="ti ti-sparkles" style="font-size:16px; color:var(--accent-text);"></i>
        <h3 style="margin:0;">AI 요약</h3>
      </div>
      <p style="font-size:13px; color:var(--text-muted); line-height:1.6; margin:0 0 16px;">${result.summary}</p>
      <p style="font-size:13px; font-weight:300; margin:0 0 10px;">추출된 액션 아이템 · 체크한 항목만 체크리스트에 추가됩니다</p>
      <div id="actionItemsList" style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px;">
        ${result.items.map((item,i)=>`
          <label style="display:flex; align-items:flex-start; gap:10px; padding:10px 12px; background:var(--surface); border-radius:var(--radius); cursor:pointer;">
            <input type="checkbox" class="action-item-check" data-idx="${i}" checked style="width:14px; height:14px; margin-top:2px;"/>
            <span style="font-size:13px; flex:1;">${item.text}</span>
          </label>
        `).join('')}
      </div>
      <div style="display:flex; gap:8px;">
        <button type="button" id="cancelMeetingNote" style="flex:1;">취소</button>
        <button type="button" id="confirmAddItems" class="primary" style="flex:1;">체크리스트에 추가</button>
      </div>
    </div>
  `;
  document.getElementById('cancelMeetingNote').addEventListener('click', closeModal);
  document.getElementById('confirmAddItems').addEventListener('click', ()=>{
    const projectId = document.getElementById('mnProject').value;
    const date = document.getElementById('mnDate').value;
    const p = state.data.projects.find(x=>x.id===projectId);
    if(!p){ showToast('프로젝트를 찾을 수 없습니다.'); return; }

    const checks = document.querySelectorAll('.action-item-check');
    let addedCount = 0;
    checks.forEach(c=>{
      if(c.checked){
        const idx = parseInt(c.dataset.idx);
        p.checklist.push({id:uid('c'), text:result.items[idx].text, done:false});
        addedCount++;
      }
    });
    if(!p.meetingNotes) p.meetingNotes = [];
    p.meetingNotes.push({id:uid('mn'), date, text:originalText, summary:result.summary});

    closeModal();
    persist(false);
    showToast(`회의록이 저장되고 체크리스트에 ${addedCount}건 추가되었습니다.`);
  });
}

/* ---------- 이벤트 위임 (전역 1회 등록) ---------- */
// render() 후 새로 생긴 버튼들도 동작하도록 document.body에 위임
document.addEventListener('click', function(e){
  // ── 메모 삭제 ──
  const noteDelBtn = e.target.closest('.note-del-btn');
  if(noteDelBtn){
    e.stopPropagation();
    const v = state.data.vendors.find(x=>x.id===state.selectedVendorId);
    if(!v) return;
    const brand = state.activeBrandId && v.brands ? v.brands.find(b=>b.id===state.activeBrandId) : null;
    const target = (brand && brand.inherit === false) ? brand : v;
    if(!target.customNotes) target.customNotes = [];
    const idx = parseInt(noteDelBtn.dataset.idx);
    if(!isNaN(idx)){
      target.customNotes.splice(idx, 1);
      persist(false); render();
      showToast('항목이 삭제되었습니다.');
    }
    return;
  }

  // ── 담당자 삭제 ──
  const personDelBtn = e.target.closest('.person-del-btn');
  if(personDelBtn){
    e.stopPropagation();
    if(!confirm('이 담당자를 삭제하시겠습니까?')) return;
    const v = state.data.vendors.find(x=>x.id===state.selectedVendorId);
    if(!v) return;
    const brand = state.activeBrandId && v.brands ? v.brands.find(b=>b.id===state.activeBrandId) : null;
    const target = (brand && brand.inherit === false) ? brand : v;
    if(!target.people) target.people = [];
    const idx = parseInt(personDelBtn.dataset.idx);
    if(!isNaN(idx)){
      target.people.splice(idx, 1);
      persist(false); render();
      showToast('담당자가 삭제되었습니다.');
    }
    return;
  }

  // ── 담당자 메인 설정 ──
  const personMainBtn = e.target.closest('.person-set-main-btn');
  if(personMainBtn){
    e.stopPropagation();
    const v = state.data.vendors.find(x=>x.id===state.selectedVendorId);
    if(!v) return;
    const brand = state.activeBrandId && v.brands ? v.brands.find(b=>b.id===state.activeBrandId) : null;
    const target = (brand && brand.inherit === false) ? brand : v;
    if(!target.people) return;
    const idx = parseInt(personMainBtn.dataset.idx);
    target.people.forEach((p,i) => p.isMain = i===idx);
    persist(false); render();
    showToast('메인 담당자로 설정되었습니다.');
    return;
  }

  // ── 거래처 상세 - 예정된 미팅 클릭 → 일정 수정 모달 ──
  const calEventLink = e.target.closest('.calendar-event-link');
  if(calEventLink){
    e.stopPropagation();
    const evData = state.data.calendar.find(x=>x.id===calEventLink.dataset.eid);
    if(!evData) return;
    openModal(modalEventDetail(evData));
    bindModalCommon();
    bindEventDetailModal(calEventLink.dataset.eid);
    return;
  }

  const meetingNoteCardBtn = e.target.closest('.meeting-note-card-btn');
  if(meetingNoteCardBtn){
    e.stopPropagation();
    const evData = state.data.calendar.find(x=>x.id===meetingNoteCardBtn.dataset.eid);
    if(!evData) return;
    const mid = meetingNoteCardBtn.dataset.mid || '';
    closeModal();
    openModal(modalMeetingNoteFull(evData, mid));
    bindModalCommon();
    bindMeetingNoteFullModal(evData.id, mid);
    return;
  }

  // ── 브랜드 삭제 ──
  const brandDelBtn = e.target.closest('.brand-del-btn');
  if(brandDelBtn){
    e.stopPropagation();
    const v = state.data.vendors.find(x=>x.id===state.selectedVendorId);
    if(!v?.brands) return;
    const bname = brandDelBtn.dataset.bname || brandDelBtn.dataset.bid;
    if(!confirm(`"${bname}" 브랜드를 삭제하시겠습니까?\n담당자와 거래 메모가 삭제됩니다. 로그는 유지됩니다.`)) return;
    v.brands = v.brands.filter(b=>b.id!==brandDelBtn.dataset.bid);
    if(state.activeBrandId===brandDelBtn.dataset.bid) state.activeBrandId = v.brands[0]?.id || null;
    persist(false); render();
    showToast(`"${bname}" 브랜드가 삭제되었습니다.`);
    return;
  }

  // ── 브랜드 이름 편집 ──
  const brandEditBtn = e.target.closest('.brand-edit-btn');
  if(brandEditBtn){
    e.stopPropagation();
    const v = state.data.vendors.find(x=>x.id===state.selectedVendorId);
    const brand = v?.brands?.find(b=>b.id===brandEditBtn.dataset.bid);
    if(!brand) return;
    const newName = prompt('브랜드명을 수정하세요', brand.name || '');
    if(newName === null) return;
    if(!newName.trim()){ showToast('브랜드명을 입력해주세요.'); return; }
    brand.name = newName.trim();
    persist(false); render();
    showToast('브랜드명이 수정되었습니다.');
    return;
  }

  // ── 거래처 파일/링크 삭제 ──
  const vendorLinkDelBtn = e.target.closest('.vendor-link-del-btn');
  if(vendorLinkDelBtn){
    e.stopPropagation();
    const v = state.data.vendors.find(x=>x.id===state.selectedVendorId);
    if(!v) return;
    const brand = state.activeBrandId && v.brands ? v.brands.find(b=>b.id===state.activeBrandId) : null;
    const target = (brand && brand.inherit === false) ? brand : v;
    if(!target.links) return;
    target.links.splice(parseInt(vendorLinkDelBtn.dataset.idx), 1);
    persist(false); render();
    showToast('삭제되었습니다.');
    return;
  }

  // ── 프로젝트 파일/링크 삭제 ──
  const projLinkDelBtn = e.target.closest('.proj-link-del-btn');
  if(projLinkDelBtn){
    e.stopPropagation();
    const proj = state.data.projects.find(x=>x.id===state.selectedProjectId);
    if(!proj?.links) return;
    proj.links.splice(parseInt(projLinkDelBtn.dataset.idx), 1);
    persist(false); render();
    showToast('삭제되었습니다.');
    return;
  }

  // ── 가져온 거래처 링크 연결 해제 ──
  const projLinkUnlinkBtn = e.target.closest('.proj-link-unlink-btn');
  if(projLinkUnlinkBtn){
    e.stopPropagation();
    const proj = state.data.projects.find(x=>x.id===state.selectedProjectId);
    if(!proj?.importedVendorLinks) return;
    proj.importedVendorLinks.splice(parseInt(projLinkUnlinkBtn.dataset.refidx), 1);
    persist(false); render();
    showToast('가져오기가 해제되었습니다. (원본은 거래처에 그대로 남아있습니다)');
    return;
  }

  // ── 회의록 카드 클릭 → 전체 내용 모달 ──
  const meetingCardBtn = e.target.closest('.meeting-card-btn');
  if(meetingCardBtn){
    e.stopPropagation();
    const pid = meetingCardBtn.dataset.pid || state.selectedProjectId;
    const vid = meetingCardBtn.dataset.vid;
    const mid = meetingCardBtn.dataset.mid;
    closeModal();
    openModal(modalVendorMeetingNoteDetail(pid, vid, mid));
    bindModalCommon();
    bindVendorMeetingNoteDetail(pid, vid, mid);
    return;
  }
});

/* ---------- 앱 초기화 ---------- */
async function initApp(){
  const app = document.getElementById('app');
  app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--text-muted);font-size:13px;">불러오는 중...</div>`;
  try{
    state.data = await loadStoreRemote();
    purgeOldTrash();
    render();
    // 시계 위젯 시작
    startClock();
  }catch(e){
    console.error('Dashboard error:', e);
    const isNetworkError = e.message.includes('fetch') || e.message.includes('network') || e.message.includes('CORS');
    const errMsg = isNetworkError ? '<p style="font-size:12px;background:#f1f1f1;padding:8px 12px;border-radius:8px;margin-top:4px;">Supabase → Project Settings → API → Allowed origins에 <b>https://senantwglobal.github.io</b> 추가 필요</p>' : '';
    app.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;padding:2rem;text-align:center;">' +
      '<div style="font-size:32px;">⚠️</div>' +
      '<p style="font-size:15px;font-weight:300;color:#dc2626;">데이터를 불러오지 못했습니다</p>' +
      '<p style="font-size:12px;color:#888;max-width:400px;">' + e.message + '</p>' +
      errMsg +
      '<button id="retryBtn" class="btn btn-primary" style="margin-top:8px;padding:8px 20px;background:#1C85E8;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">다시 시도</button>' +
      '</div>';
    document.getElementById('retryBtn').addEventListener('click', initApp);
  }
}

// ── 공유 비밀번호 잠금 화면 ──
const LOCK_HASH = 'c1a481a82891a05f6854674cae553759d2bca40a2cde9afca0072a031d57b0c4';
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function showLockScreen(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)">
      <div style="background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:36px 32px;width:320px;box-shadow:var(--shadow-md);text-align:center">
        <div style="font-size:26px;margin-bottom:10px"><i class="ti ti-lock" style="color:var(--o)"></i></div>
        <div style="font-size:15px;font-weight:400;margin-bottom:4px;color:var(--text)">천세나 업무 대시보드</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:18px">비밀번호를 입력해주세요</div>
        <input type="password" id="lockPasswordInput" placeholder="비밀번호" class="inp" style="width:100%;box-sizing:border-box;margin:0 0 10px 0;text-align:center"/>
        <div id="lockError" style="font-size:11.5px;color:#DC2626;height:16px;margin-bottom:6px"></div>
        <button id="lockSubmitBtn" class="btn" style="width:100%;justify-content:center;background:var(--text);color:#fff;padding:10px">확인</button>
      </div>
    </div>
  `;
  const input = document.getElementById('lockPasswordInput');
  const btn = document.getElementById('lockSubmitBtn');
  const errEl = document.getElementById('lockError');
  const submit = async ()=>{
    const val = input.value;
    if(!val) return;
    btn.disabled = true;
    const hash = await sha256Hex(val);
    if(hash === LOCK_HASH){
      sessionStorage.setItem('opl_unlocked', 'true');
      initApp();
    } else {
      errEl.textContent = '비밀번호가 올바르지 않습니다.';
      input.value = '';
      input.focus();
      btn.disabled = false;
    }
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  input.focus();
}

if(sessionStorage.getItem('opl_unlocked') === 'true'){
  initApp();
} else {
  showLockScreen();
}
</script>
